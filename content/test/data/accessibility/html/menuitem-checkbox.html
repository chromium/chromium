<!--
@BLINK-ALLOW:checked
@BLINK-ALLOW:role
-->
<!DOCTYPE html>
<button id="button" popovertarget="menu">Show Menu</button>
<menulist id="menu" popover>
  <fieldset>
    <menuitemcheckbox defaultchecked>Checkbox 1</menuitemcheckbox>
    <menuitemcheckbox>Checkbox 2</menuitemcheckbox>
  </fieldset>
  <fieldset>
    <menuitemradio defaultchecked>Radio 1</menuitemradio>
    <menuitemradio>Radio 2</menuitemradio>
  </fieldset>
  <fieldset>
    <menuitem defaultchecked>Item 1</menuitem>
    <menuitem>Item 2</menuitem>
  </fieldset>
  <menuitem defaultchecked>Item 3</menuitem>
  <menuitem>Item 4</menuitem>
</menulist>
<script>
  window.addEventListener('load', () => {
    button.click();
  });
</script>
