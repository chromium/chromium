@BLINK-ALLOW:disabled
@BLINK-ALLOW:role
@AURALINUX-ALLOW:sensitive
-->
<!DOCTYPE html>
<button id="button" popovertarget="menu">Show Menu</button>
<menuitem disabled>Orphan Disabled</menuitem>
<menulist id="menu" popover>
  <menuitem>Item 1</menuitem>
  <menuitem disabled>Item 2</menuitem>
  <fieldset>
      <menuitemcheckbox disabled>Checkbox 1</menuitemcheckbox>
      <menuitemcheckbox disabled defaultchecked>Checkbox 2</menuitemcheckbox>
      <menuitemcheckbox>Checkbox 3</menuitemcheckbox>
  </fieldset>
  <fieldset>
      <menuitemradio disabled>Radio 1</menuitemradio>
      <menuitemradio disabled defaultchecked>Radio 2</menuitemradio>
      <menuitemradio>Radio 3</menuitemradio>
  </fieldset>
</menulist>
<script>
  window.addEventListener('load', () => {
    button.click();
  });
</script>
