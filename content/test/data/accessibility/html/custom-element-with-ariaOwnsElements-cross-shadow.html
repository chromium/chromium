<!--
Documents the tree scope policy for aria-owns element references
(ariaOwnsElements on an element or on ElementInternals): an owner can only own
elements from its own TreeScope, which matches how aria-owns IDs are resolved.
A reference across a shadow boundary is reflected by the DOM, but it does not
reparent anything in the accessibility tree. See crbug.com/406816521.
-->
<hr aria-label="Owner inside a shadow root referencing light DOM">
<x-inner-owner id="host1"></x-inner-owner>
<p id="light">Light DOM paragraph, stays in place</p>

<hr aria-label="Host referencing into its own shadow root via ElementInternals">
<x-internals-owner id="host2" role="group"></x-internals-owner>

<hr aria-label="Owner and owned element in the same shadow root">
<x-same-scope id="host3"></x-same-scope>

<script>
  class XInnerOwner extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({mode: 'open'}).innerHTML =
          '<div role="group" id="inner-owner" aria-label="Inner owner"></div>';
    }
  }
  customElements.define('x-inner-owner', XInnerOwner);

  class XInternalsOwner extends HTMLElement {
    constructor() {
      super();
      this.i = this.attachInternals();
      this.attachShadow({mode: 'open'}).innerHTML =
          '<button id="a">A</button><button id="b">B</button>';
    }
  }
  customElements.define('x-internals-owner', XInternalsOwner);

  class XSameScope extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({mode: 'open'}).innerHTML =
          '<div role="group" id="same-scope-owner" aria-label="Same scope owner"></div>' +
          '<button id="same-scope-target">Owned</button>';
    }
  }
  customElements.define('x-same-scope', XSameScope);

  // Reflected by the DOM, but not honored by the accessibility tree: the
  // paragraph is in a different TreeScope than the owner.
  const host1 = document.getElementById('host1');
  host1.shadowRoot.getElementById('inner-owner').ariaOwnsElements =
      [document.getElementById('light')];

  // ElementInternals references are not scope-checked by the DOM. The
  // accessibility tree rejects the reference, so button A keeps its natural
  // position before button B instead of being appended as an owned child.
  const host2 = document.getElementById('host2');
  host2.i.ariaOwnsElements = [host2.shadowRoot.getElementById('a')];

  // Same TreeScope: the button becomes a child of the group.
  const host3 = document.getElementById('host3');
  host3.shadowRoot.getElementById('same-scope-owner').ariaOwnsElements =
      [host3.shadowRoot.getElementById('same-scope-target')];
</script>
