<!--
@ANDROID-ALLOW:name*
@AURALINUX-ALLOW:name*
@BLINK-ALLOW:name*
@MAC-ALLOW:name*
@WIN-ALLOW:name*
-->
<!DOCTYPE html>

<button popovertarget=popover></button>
<button interestfor=popover></button>
<div popover=hint id=popover aria-label="popover description">Actual popover text</div>

<!-- Text in a paragraph is still plain content -->
<button popovertarget=popover2></button>
<button interestfor=popover2></button>
<div popover=hint id=popover2><p>Paragraph popover text</p></div>

<!-- A popover with role=tooltip is still plain content -->
<button popovertarget=popover3></button>
<button interestfor=popover3></button>
<div popover=hint id=popover3 role=tooltip>Tooltip popover text</div>
