<!--
@WIN-DENY:EVENT_OBJECT_STATECHANGE*
-->
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div id="div" aria-label="Horizontal Scroll Container" style="width: 200px; height: 200px; overflow: scroll;">
    <div style="width: 400px; background-color: green;">overflow div</div>
  </div>

  <div style="width: 150vw; background-color: yellow;">overflow window</div>

<script>
      document.getElementById('viewport').setAttribute('content', 'width=device-width, user-scalable=no, initial-scale=' + (1 / window.devicePixelRatio) + '');

      var go_passes = [
      // scroll page in the x direction
      () => window.scrollTo(20, 0),
      // scroll the overflow div in the x direction.
          () => document.getElementById('div').scrollTo(20, 0)
        ];

        var current_pass = 0;
        function go() {
          go_passes[current_pass++].call();
          return current_pass < go_passes.length;
        }
</script>
</body>
</html>
