<!--
Mirrors aria-owns.html, but the owner is a custom element whose aria-owns
relation is set via ElementInternals.ariaOwnsElements. The resulting tree must
be the same as for the aria-owns content attribute.
-->
<html>
  <script>
    class XList extends HTMLElement {
      constructor() {
        super();
        this.i = this.attachInternals();
      }
    }
    customElements.define('x-list', XList);
  </script>
  <body>
    <x-list id="owner" role="list" style="display: block">
      <!-- Marker will end in a space: "One" is on the same line. -->
      <li style="list-style-position: outside">
        <div>One</div>
      </li>
    </x-list>

    <div>
      <!-- Marker's space is collapsed: "Two" is not on the same line. -->
      <li id="two">
        <div>Two</div>
      </li>
    </div>

    <div>
      <!-- Marker's space is collapsed: "Three" is not on the same line. -->
      <li id="three">
        <div>Three</div>
      </li>
    </div>

    <div>
      <!-- This marker will have a space: "Four" is on the same line. -->
      <li id="four">
        <div style="display:inline;">Four</div>
      </li>
    </div>
    <script>
      document.getElementById("owner").i.ariaOwnsElements = [
        document.getElementById("two"),
        document.getElementById("four"),
      ];
    </script>
  </body>
</html>
