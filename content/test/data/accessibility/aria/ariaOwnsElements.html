<!--
Mirrors aria-owns.html, but the relation is set via the ariaOwnsElements IDL
attribute instead of the aria-owns content attribute. The resulting tree must
be the same.
-->
<html>
  <body>
    <ul id="owner">
      <!-- Marker will end in a space: "One" is on the same line. -->
      <li>
        <div>One</div>
      </li>
    </ul>

    <div>
      <!-- Marker's space is collapsed: "Two" is not on the same line. -->
      <li id="two">
        <div>Two</div>
      </li>
    </div>

    <div>
      <!-- Marker's space is collapsed: "Three" is not on the same line. -->
      <li id="three">
        <div>Three</div>
      </li>
    </div>

    <div>
      <!-- This marker will have a space: "Four" is on the same line. -->
      <li id="four">
        <div style="display:inline;">Four</div>
      </li>
    </div>
    <script>
      document.getElementById("owner").ariaOwnsElements = [
        document.getElementById("two"),
        document.getElementById("four"),
      ];
    </script>
  </body>
</html>
