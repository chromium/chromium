<!DOCTYPE html>
<html>
<body>
  <math>
    <a href="data:text/plain,MathML%20download%20test%20content"
      id="downloadlink"
      download="mathml-suggested-filename">
      <mtext>Click to download</mtext>
    </a>
  </math>

  <script>
    function clickMathMLDownloadLink() {
      const link = document.getElementById('downloadlink');
      if (link) {
        link.dispatchEvent(new MouseEvent('click', {
          bubbles: true,
          cancelable: true,
          view: window
        }));
        return "MathML download link clicked";
      }
      return "MathML download link not found";
    }
  </script>
</body>
</html>
