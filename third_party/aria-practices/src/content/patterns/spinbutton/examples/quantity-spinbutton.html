<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Quantity Spin Button Example</title>

    <!-- JS and CSS for this example -->
    <link href="css/quantity-spinbutton.css" rel="stylesheet">
    <script src="js/quantity-spinbutton.js"></script>
  </head>
  <body>
        <div id="example">
          <div class="spinners">
            <fieldset>
              <legend>Guests</legend>
              <div class="spinner-fields">
                <div class="spinner-field">
                  <label for="adults">
                    Adults
                  </label>
                  <div class="spinner">
                    <button
                      type="button"
                      title="Remove adult"
                      aria-controls="adults"
                      data-spinbutton-operation="decrement"
                      tabindex="-1"
                    >
                      <span aria-hidden="true">&minus;</span>
                    </button>
                    <input
                      id="adults"
                      aria-errormessage="error-adults"
                      role="spinbutton"
                      type="text"
                      size="4"
                      inputmode="numeric"
                      autocomplete="off"
                      spellcheck="false"
                      aria-valuemin="1"
                      aria-valuemax="8"
                      aria-valuenow="1"
                      value="1"
                      >
                    <button
                      type="button"
                      title="Add adult"
                      aria-controls="adults"
                      data-spinbutton-operation="increment"
                      tabindex="-1"
                    >
                      <span aria-hidden="true">&plus;</span>
                    </button>
                  </div>
                  <small id="error-adults">Must be between 1 and 8</small>
                  <small id="help-adults">1 to 8</small>
                  <output
                    for="adults"
                    data-self-destruct="2000"
                    class="visually-hidden"></output>
                </div>
                <div class="spinner-field">
                  <label for="kids">
                    Kids
                  </label>
                  <div class="spinner">
                    <button
                      type="button"
                      title="Remove kid"
                      aria-controls="kids"
                      data-spinbutton-operation="decrement"
                      tabindex="-1"
                    >
                      <span aria-hidden="true">&minus;</span>
                    </button>
                    <input
                      id="kids"
                      aria-errormessage="error-kids"
                      role="spinbutton"
                      type="text"
                      size="4"
                      inputmode="numeric"
                      autocomplete="off"
                      spellcheck="false"
                      aria-valuemin="0"
                      aria-valuemax="8"
                      aria-valuenow="0"
                      value="0"
                      >
                    <button
                      type="button"
                      title="Add kid"
                      aria-controls="kids"
                      data-spinbutton-operation="increment"
                      tabindex="-1"
                    >
                      <span aria-hidden="true">&plus;</span>
                    </button>
                  </div>
                  <small id="error-kids">Must be between 0 and 8</small>
                  <small id="help-kids">0 to 8</small>
                  <output
                    for="kids"
                    data-self-destruct="2000"
                    class="visually-hidden"></output>
                </div>
                <div class="spinner-field">
                  <label for="animals">
                    Animals
                  </label>
                  <div class="spinner">
                    <button
                      type="button"
                      title="Remove animal"
                      aria-controls="animals"
                      data-spinbutton-operation="decrement"
                      tabindex="-1"
                    >
                      <span aria-hidden="true">&minus;</span>
                    </button>
                    <input
                      id="animals"
                      aria-errormessage="error-animals"
                      role="spinbutton"
                      type="text"
                      size="4"
                      inputmode="numeric"
                      autocomplete="off"
                      spellcheck="false"
                      aria-valuemin="0"
                      aria-valuemax="12"
                      aria-valuenow="0"
                      value="0"
                      >
                    <button
                      type="button"
                      title="Add animal"
                      aria-controls="animals"
                      data-spinbutton-operation="increment"
                      tabindex="-1"
                    >
                      <span aria-hidden="true">&plus;</span>
                    </button>
                  </div>
                  <small id="error-animals">Must be between 0 and 12</small>
                  <small id="help-animals">0 to 12</small>
                  <output
                    for="animals"
                    data-self-destruct="2000"
                    class="visually-hidden"></output>
                </div>
              </div>
            </fieldset>
          </div>
        </div>
  </body>
</html>
