# https://docs.pytest.org/en/latest/reference/customize.html
[pytest]
addopts = --doctest-modules
minversion = 7.0
testpaths = tests
# Exclude performance tests from default run because they are slow and should be run explicitly.
norecursedirs = performance

# https://pypi.org/project/pytest-timeout/
# timeout in seconds
timeout = 20
# Apply the timeout to the test function only, not to fixture setup and
# teardown. The `websocket` fixture starts a new browser for each test. On slow
# bots this can take longer than the test timeout, and the fixture has its own
# retry logic with a longer timeout for `session.new`.
timeout_func_only = true
