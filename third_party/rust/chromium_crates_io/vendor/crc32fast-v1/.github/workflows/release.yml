name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Trusted publishing on crates.io names this environment; its protection
    # rules decide which refs may publish.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No cache here: a job that can publish should not restore what pull
      # requests could have written.
      - name: Tag matches the crate version and is on master
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "crc32fast") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/master
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
