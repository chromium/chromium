language = "C"
include_guard = "HARFRUST_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 2
usize_is_size_t = true
no_includes = false
sys_includes = ["stdint.h", "stddef.h"]

header = """
/* Generated by cbindgen from the harfrust_capi crate. Do not edit by hand.
 *
 * Regenerate with:
 *
 *   cbindgen --config harfrust_capi/cbindgen.toml \\
 *            --crate harfrust_capi \\
 *            --output harfrust_capi/include/hr.h
 *
 * This is the C API for HarfRust, mirroring the shaping half of HarfBuzz's
 * API with an `hr_` prefix in place of `hb_`. Enumerators, flag values and
 * struct layouts match their HarfBuzz counterparts exactly.
 */
"""

trailer = """
/* Convenience macros with no Rust counterpart, matching HarfBuzz's. */

/** Builds a tag from four characters. */
#define HR_TAG(c1, c2, c3, c4) ((hr_tag_t)((((uint32_t) (c1) & 0xFF) << 24) | (((uint32_t) (c2) & 0xFF) << 16) | (((uint32_t) (c3) & 0xFF) << 8) | ((uint32_t) (c4) & 0xFF)))

/** Expands a tag into its four characters, as separate arguments. */
#define HR_UNTAG(tag) (uint8_t)(((tag) >> 24) & 0xFF), (uint8_t)(((tag) >> 16) & 0xFF), (uint8_t)(((tag) >> 8) & 0xFF), (uint8_t)((tag) & 0xFF)

/** Packs unpremultiplied sRGB blue, green, red, and alpha channels. */
#define HR_COLOR(b,g,r,a) ((hr_color_t)((((uint32_t)(b) & 0xffu) << 24) | (((uint32_t)(g) & 0xffu) << 16) | (((uint32_t)(r) & 0xffu) << 8) | ((uint32_t)(a) & 0xffu)))

/** An unset language. */
#define HR_LANGUAGE_INVALID ((hr_language_t) 0)

/** Segment properties with every field unset. */
#define HR_SEGMENT_PROPERTIES_DEFAULT { HR_DIRECTION_INVALID, HR_SCRIPT_INVALID, HR_LANGUAGE_INVALID, (void *) 0, (void *) 0 }

/* Spelled as macros because HarfBuzz spells them that way. */
#define HR_DIRECTION_IS_VALID(dir) ((((unsigned int) (dir)) & ~3U) == 4U)
#define HR_DIRECTION_IS_HORIZONTAL(dir) ((((unsigned int) (dir)) & ~1U) == 4U)
#define HR_DIRECTION_IS_VERTICAL(dir) ((((unsigned int) (dir)) & ~1U) == 6U)
#define HR_DIRECTION_IS_FORWARD(dir) ((((unsigned int) (dir)) & ~2U) == 4U)
#define HR_DIRECTION_IS_BACKWARD(dir) ((((unsigned int) (dir)) & ~2U) == 5U)
#define HR_DIRECTION_REVERSE(dir) ((hr_direction_t) (((unsigned int) (dir)) ^ 1U))

/** The version of this library, as a string. */
#define HR_VERSION_STRING "0.16.0"

/** True if this library is at least the given version. */
#define HR_VERSION_ATLEAST(major, minor, micro) ((major) < HR_VERSION_MAJOR || ((major) == HR_VERSION_MAJOR && ((minor) < HR_VERSION_MINOR || ((minor) == HR_VERSION_MINOR && (micro) <= HR_VERSION_MICRO))))

/** The HarfBuzz release matched by the shaping implementation. */
#define HR_HARFBUZZ_VERSION_STRING "15.1.0"

/** True if the matched HarfBuzz version is at least the given version. */
#define HR_HARFBUZZ_VERSION_ATLEAST(major, minor, micro) ((major) < HR_HARFBUZZ_VERSION_MAJOR || ((major) == HR_HARFBUZZ_VERSION_MAJOR && ((minor) < HR_HARFBUZZ_VERSION_MINOR || ((minor) == HR_HARFBUZZ_VERSION_MINOR && (micro) <= HR_HARFBUZZ_VERSION_MICRO))))
"""

[parse]
parse_deps = false

[export]
prefix = ""

[enum]
prefix_with_name = false
rename_variants = "None"
derive_helper_methods = false

[const]
allow_static_const = false
allow_constexpr = false

[fn]
sort_by = "None"

[struct]
derive_eq = false
