syntax = 'proto3';

option optimize_for = LITE_RUNTIME;
option java_package = 'org.chromium.components.omnibox';
option java_outer_classname = 'ToolRuleProto';

package omnibox;

import "input_type.proto";
import "model_mode.proto";
import "tool_mode.proto";

// Rule for restricting a tool.
// Next ID: 8
message ToolRule {
  // Numeric value of the `ToolMode` enum for the tool that is being restricted.
  // See crbug.com/545733743.
  int32 tool_key = 6;
  // Deprecated: Use `tool_key` instead. Cleared for clients that have
  // migrated to `tool_key`.
  // New clients must not use this field.
  //
  // The tool that is being restricted.
  optional ToolMode tool = 1 [deprecated = true];
  // The input types that are allowed to be used with the tool.
  // If allow_all_input_types is true, this field is ignored.
  repeated InputType allowed_input_types = 2;
  // If true, all input types are allowed to be used with the tool.
  optional bool allow_all_input_types = 3;
  // Numeric values of the `ModelMode` enums for the models that are allowed to
  // be used with the tool. See crbug.com/545733743.
  repeated int32 allowed_model_keys = 7;
  // Deprecated: Use `allowed_model_keys` instead. Cleared for clients that have
  // migrated to `allowed_model_keys`.
  // New clients must not use this field.
  //
  // The models that are allowed to be used with the tool.
  repeated ModelMode allowed_models = 4 [deprecated = true];
  // If true, all models are allowed to be used with the tool.
  optional bool allow_all_models = 5;
}
