syntax = 'proto3';

option optimize_for = LITE_RUNTIME;
option java_package = 'org.chromium.components.omnibox';
option java_outer_classname = 'SearchboxTutorialProto';

package omnibox;

// The Searchbox tutorial experience to trigger.
// Next ID: 2
enum SearchboxTutorial {
  SEARCHBOX_TUTORIAL_UNSPECIFIED = 0;

  // Glow animation on the plus button to educate users.
  SEARCHBOX_TUTORIAL_GLOW_PLUS_BUTTON = 1;
}
