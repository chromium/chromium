syntax = 'proto3';

option optimize_for = LITE_RUNTIME;
option java_package = 'org.chromium.components.omnibox';
option java_outer_classname = 'LhsRailConfigProto';

package omnibox;

// Configuration for the native folded LHS rail in Chrome NTP.
// Next ID: 2
message LhsRailConfig {
  // Next ID: 4
  message LhsItem {
    // Monochrome vector icon rendered directly by Chrome WebUI. Always a
    // complete, raw `<svg>...</svg>` element, never bare path data such as a
    // standalone `<path d="...">`. Clients must treat this markup as untrusted
    // and sanitize it before inserting it into the DOM to prevent DOM-based
    // XSS.
    string icon_svg = 1;

    // Server-localized name (resolved via `client_locale` on `/async/folae`).
    // Used for both the hover tooltip (`Tooltip`) and screen reader
    // `aria-label`.
    string name = 2;

    // Action to perform when the user clicks this item in the folded rail.
    ClickAction click_action = 3;
  }

  // Next ID: 3
  message ClickAction {
    // Native client-side action in Chrome WebUI.
    // Next ID: 4
    enum ClientAction {
      CLIENT_ACTION_UNSPECIFIED = 0;
      // Navigates the tab to `link.relative_url` on the Google DSE origin.
      CLIENT_ACTION_NAVIGATE = 1;
      // Expands the LHS `<ntp-iframe>` rail.
      CLIENT_ACTION_EXPAND_RAIL = 2;
      // Focuses the NTP Realbox / Composebox in AI Mode.
      CLIENT_ACTION_FOCUS_REALBOX_AIM = 3;
    }

    // Primary native action for clients that support it.
    ClientAction client_action = 1;

    // Target relative URL on the Google Default Search Engine (DSE) origin
    // (everything after `google.com`, e.g., `"/search?udm=50"`).
    // Used in two ways:
    // 1. As the primary target when `client_action` is
    // `CLIENT_ACTION_NAVIGATE`.
    // 2. As a **skew-safe fallback** when `client_action` is a newly added enum
    //    value that an older Chrome binary does not recognize yet (which
    //    deserializes to `CLIENT_ACTION_UNSPECIFIED` / fails `IsValid()`).
    LinkAction link = 2;
  }

  // Next ID: 2
  message LinkAction {
    // Relative path and query string on the Google DSE origin (everything after
    // `google.com`, e.g., `"/search?udm=50"` or `"/search?udm=50&atvm=3"`). The
    // string must start with a `/`. Any absolute URIs will be rejected.
    string relative_url = 1;
  }

  // Ordered list of items to render in the folded LHS rail.
  repeated LhsItem lhs_items = 1;
}
