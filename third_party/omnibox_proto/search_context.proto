syntax = 'proto2';

option optimize_for = LITE_RUNTIME;
option java_package = 'org.chromium.components.omnibox';
option java_outer_classname = 'SearchContextProto';

package omnibox;

// Transport proto for carrying all Ambient-related context information from
// client to server. It should be serialized and websafe-base64-encoded
// into passing the proto as a CGI param keyed with "mactx".
// NEXT-ID: 5
message SearchContext {
  optional string webpage_url = 1;
  optional string webpage_title = 2;
}
