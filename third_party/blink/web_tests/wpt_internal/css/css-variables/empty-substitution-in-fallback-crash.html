<!DOCTYPE html>
<title>A fallback starting with an empty substitution should not crash</title>
<link rel="help" href="https://drafts.csswg.org/css-variables/#substitute-a-var">
<style>
  /* An empty substitution at the start of a fallback leaves the whitespace
     that followed it at the start of the substitution value. The "/" is
     needed to reach the relevant code path in Blink. */
  #t1 { --empty:; --a: var(--b, var(--empty) 1/2); }
  #t2 { --a: var(--b, var(--c,) 1/2); }
  #t3 { --empty:; --nested: var(--empty) 1/2; --a: var(--b, var(--nested)); }
  #t4 { --a: var(--b, attr(data-missing type(*),) 1/2); }
</style>
<div id="t1">Test passes if it does not crash.</div>
<div id="t2"></div>
<div id="t3"></div>
<div id="t4"></div>
<script>
  for (const div of document.querySelectorAll('div')) {
    getComputedStyle(div).getPropertyValue('--a');
  }
</script>
