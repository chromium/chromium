<!DOCTYPE html>
<script src="/resources/testharness.js"></script>

<meta name="flags" content="ahem">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
#outer > div {
  max-content-sizing: shrink-to-fit;
  font: 20px/1 Ahem;
  width: fit-content;
  max-width: 120px;
}

</style>

<div id="outer">
<!-- Fit to the line "ab cd". -->
<div title="The target width should be shrunk"
     data-expected-width="100"
     style="display:inline-block;">ab cd ef</div>

<!-- Fit to the line "ab cd". -->
<div title="The target width should be shrunk"
     data-expected-width="100">
<div style="display:inline-block;">ab cd ef</div>
</div>

</div>

<script>
document.fonts.ready.then(() => checkLayout('[data-expected-width]'));
</script>
