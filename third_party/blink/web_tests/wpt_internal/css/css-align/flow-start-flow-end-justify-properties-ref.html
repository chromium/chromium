<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      color: black; background-color: white; font: 12.8px/1 monospace; padding: 0; margin: 0;
    }

    .row {
      font-size: 0;
    }

    .label {
      margin: 8px 4px 0;
    }

    .container {
      width: 80px;
      height: 80px;
      border: 1px solid black;
      margin: 4px;
      vertical-align: top;
    }

    item {
      display: block;
      width: 20px;
      height: 20px;
      background: green;
    }

    .flex {
      display: inline flex;
      flex-wrap: wrap;
    }

    .grid {
      display: inline grid;
      grid-template: 40px / auto;
    }

    .lanes-column {
      display: inline grid-lanes;
      grid-lanes-direction: column;
      grid-template-columns: auto;
    }

    .lanes-row {
      display: inline grid-lanes;
      grid-lanes-direction: row;
      grid-template-rows: 40px;
    }

  </style>
</head>
<body>

<div class="label">Flex: justify-content</div>
<div class="row">
  <div class="container flex" style="justify-content: flex-start"><item></item></div>
  <div class="container flex" style="justify-content: flex-end"><item></item></div>
</div>

<div class="label">Grid: justify-content, justify-items, justify-self</div>
<div class="row">
  <div class="container grid" style="justify-content: flex-start"><item></item></div>
  <div class="container grid" style="justify-content: flex-end"><item></item></div>
  <div class="container grid" style="justify-items: flex-start"><item></item></div>
  <div class="container grid" style="justify-items: flex-end"><item></item></div>
  <div class="container grid"><item style="justify-self: flex-start"></item></div>
  <div class="container grid"><item style="justify-self: flex-end"></item></div>
</div>

<div class="label">Column Grid Lanes, grid axis: justify-content, justify-items, justify-self</div>
<div class="row">
  <div class="container lanes-column" style="justify-content: flex-start"><item></item></div>
  <div class="container lanes-column" style="justify-content: flex-end"><item></item></div>
  <div class="container lanes-column" style="justify-items: flex-start"><item></item></div>
  <div class="container lanes-column" style="justify-items: flex-end"><item></item></div>
  <div class="container lanes-column"><item style="justify-self: flex-start"></item></div>
  <div class="container lanes-column"><item style="justify-self: flex-end"></item></div>
</div>

<div class="label">Row Grid Lanes, stacking axis: justify-content, justify-items, justify-self</div>
<div class="row">
  <div class="container lanes-row" style="justify-content: flex-start"><item></item></div>
  <div class="container lanes-row" style="justify-content: flex-end"><item></item></div>
  <div class="container lanes-row" style="justify-items: flex-start"><item></item></div>
  <div class="container lanes-row" style="justify-items: flex-end"><item></item></div>
  <div class="container lanes-row"><item style="justify-self: flex-start"></item></div>
  <div class="container lanes-row"><item style="justify-self: flex-end"></item></div>
</div>
</body>
</html>
