<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>'flow-start' and 'flow-end' behave like 'flex-start' and 'flex-end' in a flex container</title>
  <link rel="author" title="Celeste Pan" href="mailto:celestepan@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-align-3/#align-justify-content">
  <link rel="help" href="https://drafts.csswg.org/css-align-3/#align-items-property">
  <link rel="help" href="https://drafts.csswg.org/css-align-3/#align-self-property">
  <link rel="help" href="https://drafts.csswg.org/css-align-3/#typedef-content-position">
  <link rel="help" href="https://drafts.csswg.org/css-align-3/#typedef-self-position">
  <link rel="match" href="flow-start-flow-end-ref.html">
  <style>
    html, body {
      color: black; background-color: white; font: 12.8px/1 monospace; padding: 0; margin: 0;
    }

    .row {
      font-size: 0;
    }

    .label {
      margin: 8px 4px 0;
    }

    .container {
      width: 80px;
      height: 80px;
      border: 1px solid black;
      margin: 4px;
      vertical-align: top;
    }

    item {
      display: block;
      width: 20px;
      height: 20px;
      background: green;
    }

    .flex-row {
      display: inline flex;
    }

    .flex-column {
      display: inline flex;
      flex-direction: column;
    }

    .flex-row-wrap {
      display: inline flex;
      flex-wrap: wrap;
    }

    .flex-column-wrap {
      display: inline flex;
      flex-direction: column;
      flex-wrap: wrap;
    }

  </style>
</head>
<body>

<div class="label">Main axis, justify-content: row flex, then column flex</div>
<div class="row">
  <div class="container flex-row" style="justify-content: flow-start"><item></item></div>
  <div class="container flex-row" style="justify-content: flow-end"><item></item></div>
  <div class="container flex-column" style="justify-content: flow-start"><item></item></div>
  <div class="container flex-column" style="justify-content: flow-end"><item></item></div>
</div>

<div class="label">Cross axis, align-items and align-self: row flex, then column flex</div>
<div class="row">
  <div class="container flex-row" style="align-items: flow-start"><item></item></div>
  <div class="container flex-row" style="align-items: flow-end"><item></item></div>
  <div class="container flex-row"><item style="align-self: flow-start"></item></div>
  <div class="container flex-row"><item style="align-self: flow-end"></item></div>
  <div class="container flex-column" style="align-items: flow-start"><item></item></div>
  <div class="container flex-column" style="align-items: flow-end"><item></item></div>
  <div class="container flex-column"><item style="align-self: flow-start"></item></div>
  <div class="container flex-column"><item style="align-self: flow-end"></item></div>
</div>

<div class="label">Multi-line cross axis, align-content: row flex, then column flex</div>
<div class="row">
  <div class="container flex-row-wrap" style="align-content: flow-start"><item></item></div>
  <div class="container flex-row-wrap" style="align-content: flow-end"><item></item></div>
  <div class="container flex-column-wrap" style="align-content: flow-start"><item></item></div>
  <div class="container flex-column-wrap" style="align-content: flow-end"><item></item></div>
</div>
</body>
</html>
