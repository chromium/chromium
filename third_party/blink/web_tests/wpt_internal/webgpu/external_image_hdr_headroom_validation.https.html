<!DOCTYPE html>
<html>
<head>
<title>WebGPU external image HDR headroom validation</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
'use strict';

promise_test(async () => {
  const adapter = await navigator.gpu.requestAdapter();
  assert_true(adapter !== null, 'GPUAdapter should be available');
  const device = await adapter.requestDevice();
  assert_true(device !== null, 'GPUDevice should be available');

  const canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = 1;
  canvas.getContext('2d');
  const texture = device.createTexture({
    size: [1, 1],
    format: 'rgba8unorm',
    usage: GPUTextureUsage.COPY_DST,
  });
  const frame = new VideoFrame(canvas, {timestamp: 0});

  const testCases = [
    {
      name: 'copyExternalImageToTexture',
      fn: h => device.queue.copyExternalImageToTexture(
          {source: canvas}, {texture, linearHDRHeadroom: h}, [1, 1]),
    },
    {
      name: 'importExternalTexture',
      fn: h => device.importExternalTexture(
          {source: frame, linearHDRHeadroom: h}),
    },
  ];

  for (const {name, fn} of testCases) {
    // Valid values.
    fn(undefined);
    fn(1.0);
    fn(2.0);
    fn(Infinity);

    // Values < 1.0 or NaN throw OperationError.
    for (const h of [0.99, 0.5, 0.0, -1.0, -Infinity, NaN]) {
      assert_throws_dom('OperationError', () => fn(h),
          `${name}: linearHDRHeadroom = ${h} should throw OperationError`);
    }
  }
  frame.close();
}, 'WebGPU linearHDRHeadroom parameter validation');
</script>
</body>
</html>
