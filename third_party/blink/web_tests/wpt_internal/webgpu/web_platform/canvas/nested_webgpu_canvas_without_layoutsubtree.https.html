<!DOCTYPE html>
<html class="reftest-wait">
  <title>Nested WebGPU canvas without layoutsubtree in html-in-canvas</title>
  <meta charset="utf-8" />
  <link rel="help" href="https://github.com/WICG/html-in-canvas" />
  <link rel="match" href="nested_webgpu_canvas_without_layoutsubtree-ref.html" />
  <script src="/common/reftest-wait.js"></script>

  <canvas id="outer" width="100" height="100" layoutsubtree>
    <div id="outer_target" style="width: 100px; height: 100px;">
      <canvas id="inner" width="100" height="100"></canvas>
    </div>
  </canvas>

  <script type="module">
    import { resizeToPixelGrid } from "/wpt_internal/resources/canvas-draw-element/util.js";

    async function waitForOneFrame() {
      await new Promise(requestAnimationFrame);
      await new Promise(setTimeout);
    }

    onload = async function() {
      if (!navigator.gpu) {
        throw new Error("WebGPU is not supported in this browser.");
      }

      const adapter = await navigator.gpu.requestAdapter();
      const device = await adapter.requestDevice();

      const inner = document.getElementById("inner");
      const context = inner.getContext("webgpu");
      const format = navigator.gpu.getPreferredCanvasFormat();

      context.configure({
        device: device,
        format: format,
      });

      function draw_inner() {
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0.0, g: 0.0, b: 1.0, a: 1.0 },
            loadOp: "clear",
            storeOp: "store",
          }]
        });
        pass.end();
        device.queue.submit([encoder.finish()]);
      }

      await resizeToPixelGrid(inner);
      const outer = document.getElementById("outer");
      await resizeToPixelGrid(outer);
      await waitForOneFrame();

      outer.onpaint = () => {
        const outer_ctx = outer.getContext("2d");
        outer_ctx.reset();
        outer_ctx.drawElementImage(outer.firstElementChild, 0, 0);
      };
      draw_inner();
      takeScreenshot();
    }();
  </script>
</html>
