<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>

const kLongAnimationFrameExplicitlyRequested = 4577;

function clear() {
  internals.clearUseCounter(document, kLongAnimationFrameExplicitlyRequested);
}

promise_test(async () => {
  clear();
  performance.getEntries();
  performance.getEntriesByName("long-animation-frame");
  performance.getEntriesByType("longtask");
  new PerformanceObserver(() => {}).observe({entryTypes: ["resource"]});
  assert_false(internals.isUseCounted(document, kLongAnimationFrameExplicitlyRequested));
}, "UseCounter for LoAF should not be triggered for non-loaf types");

promise_test(async () => {
  clear();
  performance.getEntriesByType("long-animation-frame");
  assert_true(internals.isUseCounted(document, kLongAnimationFrameExplicitlyRequested));
}, "UseCounter for LoAF explicitly requested should be triggered by getEntriesByType");

promise_test(async () => {
  clear();
  new PerformanceObserver(() => {}).observe({type: "long-animation-frame"});
  assert_true(internals.isUseCounted(document, kLongAnimationFrameExplicitlyRequested));
}, "UseCounter for LoAF explicitly requested should be triggered by PerformanceObserver");
</script>
<body>
  <div id="log"></div>
</body>
