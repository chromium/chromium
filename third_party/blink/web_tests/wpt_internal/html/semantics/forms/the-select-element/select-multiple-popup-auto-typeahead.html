<!DOCTYPE html>
<link rel=author href="mailto:jarhar@chromium.org">
<link rel=help href="https://issues.chromium.org/issues/496002560">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>

<select multiple size=1>
  <option class=one>one</option>
  <option class=two>two</option>
</select>

<script>
const select = document.querySelector('select');
const optionOne = document.querySelector('.one');
const optionTwo = document.querySelector('.two');
const spaceKey = '\uE00D';
const escapeKey = '\uE00C';
const arrowLeft = '\uE012';
const arrowUp = '\uE013';
const arrowRight = '\uE014';
const arrowDown = '\uE015';

function pressKey(key) {
  return (new test_driver.Actions()
    .keyDown(key)
    .keyUp(key))
    .send();
}

promise_test(async () => {
  select.focus();
  await pressKey(spaceKey);
  assert_true(select.matches(':open'),
    'Select should be open after pressing space.');
  assert_equals(document.activeElement, optionOne,
    'Option one should be focused when opening picker.');

  await pressKey(spaceKey);
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Option one should be selected after pressing space on it.');

  await pressKey(arrowLeft);
  assert_equals(document.activeElement, optionOne,
    'Option one should stay focused after pressing arrow left.');
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Selected options should not change after pressing arrow left on option one.');

  await pressKey(arrowRight);
  assert_equals(document.activeElement, optionOne,
    'Option one should stay focused after pressing arrow right.');
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Selected options should not change after pressing arrow right on option one.');

  await pressKey(arrowDown);
  assert_equals(document.activeElement, optionTwo,
    'Option two should become focused after arrow down on option one.');
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Selected options should not change after pressing arrow down.');

  await pressKey(arrowLeft);
  assert_equals(document.activeElement, optionTwo,
    'Option two should stay focused after pressing arrow left.');
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Selected options should not change after pressing arrow left on option two.');

  await pressKey(arrowRight);
  assert_equals(document.activeElement, optionTwo,
    'Option two should stay focused after pressing arrow right.');
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Selected options should not change after pressing arrow right on option two.');

  await pressKey(arrowUp);
  assert_equals(document.activeElement, optionOne,
    'Option one should become focused after arrow up on option two.');
  assert_array_equals(Array.from(select.selectedOptions), [optionOne],
    'Selected options should not change after pressing arrow up.');

  await pressKey(spaceKey);
  assert_array_equals(Array.from(select.selectedOptions), [],
    'Option one should be deselected after pressing space on it again.');

  await pressKey(escapeKey);
  assert_false(select.matches(':open'),
    'Picker should close after pressing escape.');
}, 'Arrow keys in appearance:auto <select multiple size=1>');

promise_test(async () => {
  select.focus();
  await pressKey(spaceKey);
  assert_equals(document.activeElement, optionOne,
    'First option should be focused after opening the picker.');

  await pressKey('t');
  assert_equals(document.activeElement, optionTwo,
    'Second option should be focused after typing t.');
  assert_array_equals(Array.from(select.selectedOptions), [],
    'No options should be selected after using typeahead.');
  assert_true(select.matches(':open'),
    'Picker should still be open after using typeahead.');

  await pressKey(escapeKey);
  assert_false(select.matches(':open'),
    'Picker should close after pressing escape.');
}, 'Typeahead in appearance:auto <select multiple size=1>');
</script>
