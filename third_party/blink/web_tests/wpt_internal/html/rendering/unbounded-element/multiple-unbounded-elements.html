<!DOCTYPE html>
<meta charset="utf-8">
<link rel="author" href="mailto:masonf@chromium.org">
<link rel="help" href="https://crbug.com/524030528">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>

<div id=first unbounded></div>
<div id=second unbounded></div>

<style>
[unbounded] {
  width: 50px;
  height: 50px;
}
</style>

<script>
promise_test(async t => {
  const first = document.getElementById('first');
  const second = document.getElementById('second');

  await test_driver.bless("show both unbounded");
  const p1 = first.showUnboundedElement();
  const p2 = second.showUnboundedElement();

  await promise_rejects_dom(t, 'AbortError', p1);
  await p2;
}, 'Showing a second unbounded element while the first is pending should dismiss/reject the first.');
</script>
