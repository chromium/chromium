<!DOCTYPE html>
<meta charset="utf-8">
<link rel="author" href="mailto:masonf@chromium.org">
<link rel="help" href="https://crbug.com/524030528">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>

<div id="div" unbounded style="width: 100px; height: 100px;"></div>

<script>
promise_test(async t => {
  const div = document.getElementById('div');

  // Detach the element.
  div.remove();

  // Calling showUnboundedElement on a detached element should reject.
  await test_driver.bless("show unbounded element");
  const p = div.showUnboundedElement();
  await promise_rejects_dom(t, 'NotSupportedError', p);
}, 'Calling showUnboundedElement on a detached element of the active document should reject with NotSupportedError.');
</script>
