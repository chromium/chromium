<!-- A composited filter gives the descendant its own render surface inside
     the unbounded element's surface. -->
<style>
  #target {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 200px;
    height: 200px;
    background: green;
  }
  #child {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 100px;
    height: 100px;
    background: magenta;
    will-change: filter;
    filter: invert(1);
  }
</style>

<div id="target" unbounded><div id="child"></div></div>
