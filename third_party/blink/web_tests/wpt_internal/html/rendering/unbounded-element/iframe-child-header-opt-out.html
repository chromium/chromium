<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<link rel="author" href="mailto:masonf@chromium.org">
<link rel="help" href="https://crbug.com/508672616">
<link rel="match" href="iframe-child-header-opt-out-ref.html">
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="resources/unbounded-utils.js"></script>

<style>
  iframe {
    position: absolute;
    top: 50px;
    left: 100px;
    width: 100px;
    height: 100px;
    border: 0;
  }
</style>

<!-- The child's own Permissions-Policy header disables unbounded-element,
     so the element stays clamped to the iframe despite allow=. -->
<iframe id="iframe" allow="unbounded-element"
        src="resources/iframe-child-header-opt-out-child.html"></iframe>

<script>
unbounded_appearance_test(async () => {
  if (document.readyState !== 'complete') {
    await new Promise(resolve => window.addEventListener('load', resolve));
  }
  const gotMessage = new Promise((resolve) => {
    window.addEventListener('message', (e) => {
      if (e.data === 'finish') {
        resolve();
      }
    });
  });
  await test_driver.click(iframe);
  await gotMessage;
});
</script>
