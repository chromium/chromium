<!DOCTYPE html>
<meta charset="utf-8">
<title>Fetchpriority on parser-discovered modulepreload links</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/common.js"></script>

<script>
const priorityTests = [
  {
    promise: internals.getInitialResourcePriority(
        new URL("resources/dummy.js", location), document),
    expected_priority: kHigh,
    description: "high fetchpriority on <link rel=modulepreload> has no effect"
  },
  {
    promise: internals.getInitialResourcePriority(
        new URL("resources/dummy.js?1", location), document),
    expected_priority: kLow,
    description: "low fetchpriority on <link rel=modulepreload> lowers the priority to kLow"
  },
  {
    promise: internals.getInitialResourcePriority(
        new URL("resources/dummy.js?2", location), document),
    expected_priority: kHigh,
    description: "auto fetchpriority on <link rel=modulepreload> has no effect"
  },
  {
    promise: internals.getInitialResourcePriority(
        new URL("resources/dummy.js?3", location), document),
    expected_priority: kHigh,
    description: "invalid fetchpriority on <link rel=modulepreload> has no effect"
  },
  {
    promise: internals.getInitialResourcePriority(
        new URL("resources/dummy.js?4", location), document),
    expected_priority: kHigh,
    description: "missing fetchpriority on <link rel=modulepreload> has no effect"
  },
];
</script>

<link id="link1" rel="modulepreload" fetchpriority="high" href="resources/dummy.js">
<link id="link2" rel="modulepreload" fetchpriority="low" href="resources/dummy.js?1">
<link id="link3" rel="modulepreload" fetchpriority="auto" href="resources/dummy.js?2">
<link id="link4" rel="modulepreload" fetchpriority="xyz" href="resources/dummy.js?3">
<link id="link5" rel="modulepreload" href="resources/dummy.js?4">

<script>
promise_test(async () => {
  await new Promise(resolve => {
    addEventListener("DOMContentLoaded", resolve, {once: true});
  });

  const baseMessage = " was fetched by the preload scanner";
  assert_true(internals.isPreloaded(link1.href), link1.href + baseMessage);
  assert_true(internals.isPreloaded(link2.href), link2.href + baseMessage);
  assert_true(internals.isPreloaded(link3.href), link3.href + baseMessage);
  assert_true(internals.isPreloaded(link4.href), link4.href + baseMessage);
  assert_true(internals.isPreloaded(link5.href), link5.href + baseMessage);
}, "all modulepreloads must be fetched by the preload scanner");

for (const test of priorityTests) {
  promise_test(async () => {
    const loadPriority = await test.promise;
    assert_equals(loadPriority, test.expected_priority);
  }, test.description);
}
</script>
