<!DOCTYPE html>
<meta charset="utf-8">
<title>Fetchpriority on dynamically inserted modulepreload links</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/common.js"></script>

<script>
const tests = [
  {
    description: "high fetchPriority on dynamically-inserted <link rel=modulepreload> has no effect on resource load priority",
    fetchPriority: "high",
    expected_priority: kHigh
  },
  {
    description: "low fetchPriority on dynamically-inserted <link rel=modulepreload> lowers the priority to kLow",
    fetchPriority: "low",
    expected_priority: kLow
  },
  {
    description: "auto fetchPriority on dynamically-inserted <link rel=modulepreload> has no effect on resource load priority",
    fetchPriority: "auto",
    expected_priority: kHigh
  },
  {
    description: "invalid fetchPriority on dynamically-inserted <link rel=modulepreload> has no effect on resource load priority",
    fetchPriority: "xyz",
    expected_priority: kHigh
  },
  {
    description: "missing fetchPriority on dynamically-inserted <link rel=modulepreload> has no effect on resource load priority",
    expected_priority: kHigh
  },
];

let iteration = 0;
for (const test of tests) {
  promise_test(async () => {
    const link = document.createElement("link");
    link.rel = "modulepreload";
    if (test.fetchPriority) {
      link.fetchPriority = test.fetchPriority;
    }

    const url = new URL(`resources/dummy.js?${iteration++}`, location);
    const priorityPromise =
        internals.getInitialResourcePriority(url, document);
    link.href = url;
    document.head.appendChild(link);
    const loadPriority = await priorityPromise;
    assert_equals(loadPriority, test.expected_priority);
  }, test.description);
}
</script>
