<!DOCTYPE html>
<meta charset="utf-8">
<link rel="author" href="mailto:vmpstr@chromium.org">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<style>
  html, body {
    margin: 0;
  }
  #container {
    width: 200px;
    height: 200px;
    overflow: auto;
  }
  #menu {
    width: 100%;
    height: 100%;
    right: 100%; /* Overscrolls to the left of the container. */
  }
  #content {
    height: 600px;
  }
</style>

<div id="container" overscrollcontainer>
  <div id="menu" overscrollarea></div>
  <div id="content"></div>
</div>
<button id=button command="show-overscroll" commandfor="menu"></button>

<script>
test(() => {
  // The container is only vertically scrollable
  assert_equals(container.scrollWidth, container.clientWidth);
  assert_greater_than(container.scrollHeight, container.clientHeight);

  // Initially the menu is offscreen to the left (and abspos).
  assert_equals(menu.getBoundingClientRect().right, 0);
  assert_not_equals(menu.getBoundingClientRect().left, 0);
  assert_equals(getComputedStyle(menu).position, "absolute");
  assert_not_equals(getComputedStyle(content).position, "absolute");

  // Click the button to bring the menu into view.
  button.click();

  // The menu should now be in view.
  assert_equals(menu.getBoundingClientRect().left, 0, "left edge aligned");

  // The container has not scrolled.
  assert_equals(container.offsetLeft, 0, "container not scrolled");

  // Click the button again: showing when already shown should not toggle/hide.
  button.click();

  // The menu should still be in view.
  assert_equals(menu.getBoundingClientRect().left, 0, "left edge still aligned after second show click");

  // The container still has not scrolled.
  assert_equals(container.offsetLeft, 0, "container still not scrolled");

  // Remove overscrollarea attribute, which should remove the overscroll area.
  menu.removeAttribute("overscrollarea");
  assert_not_equals(getComputedStyle(menu).position, "absolute", "menu should no longer be an overscroll area");
}, "Activating show-overscroll brings the menu into view and clicking again does not toggle it");
</script>
