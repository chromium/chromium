<!DOCTYPE html>
<meta charset="utf-8">
<link rel="author" href="mailto:vmpstr@chromium.org">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<style>
  html, body {
    margin: 0;
  }
  #container {
    width: 200px;
    height: 200px;
    overflow: auto;
  }
  #menu {
    width: 100%;
    height: 100%;
    right: 100%; /* Overscrolls to the left of the container. */
  }
  #content {
    height: 600px;
  }
</style>

<div id="container" overscrollcontainer>
  <div id="menu" overscrollarea></div>
  <div id="content"></div>
</div>
<button id=show_btn command="show-overscroll" commandfor="menu"></button>
<button id=hide_btn command="hide-overscroll" commandfor="menu"></button>
<button id=toggle_btn command="toggle-overscroll" commandfor="menu"></button>

<script>
test(() => {
  // Initially the menu is offscreen to the left.
  assert_equals(menu.getBoundingClientRect().right, 0, "initial state: hidden");

  // 1. Hide when already hidden -> does nothing, remains hidden.
  hide_btn.click();
  assert_equals(menu.getBoundingClientRect().right, 0, "after hide on closed: still hidden");

  // 2. Show -> brings menu into view.
  show_btn.click();
  assert_equals(menu.getBoundingClientRect().left, 0, "after show: open (left edge aligned)");

  // 3. Show again -> does nothing, remains open.
  show_btn.click();
  assert_equals(menu.getBoundingClientRect().left, 0, "after show again: still open");

  // 4. Toggle -> closes menu.
  toggle_btn.click();
  assert_equals(menu.getBoundingClientRect().right, 0, "after toggle: closed");

  // 5. Toggle -> opens menu.
  toggle_btn.click();
  assert_equals(menu.getBoundingClientRect().left, 0, "after second toggle: open");

  // 6. Hide -> closes menu.
  hide_btn.click();
  assert_equals(menu.getBoundingClientRect().right, 0, "after hide: closed");

  // 7. Hide again -> remains closed.
  hide_btn.click();
  assert_equals(menu.getBoundingClientRect().right, 0, "after second hide: still closed");

  // 8. Toggle -> opens menu.
  toggle_btn.click();
  assert_equals(menu.getBoundingClientRect().left, 0, "after toggle: open");

  // 9. Hide -> closes menu.
  hide_btn.click();
  assert_equals(menu.getBoundingClientRect().right, 0, "after hide: closed");

  // 10. Show -> opens menu.
  show_btn.click();
  assert_equals(menu.getBoundingClientRect().left, 0, "after show: open");

  // 11. Toggle -> closes menu.
  toggle_btn.click();
  assert_equals(menu.getBoundingClientRect().right, 0, "after toggle: closed");

}, "Show, hide, and toggle overscroll commands work as expected when used together");
</script>
