<!DOCTYPE HTML>
<html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/testharness-adapter.js"></script>
</head>
<body>
<script type="module">
import {GeolocationMock, GeolocationPermissionStatus} from './resources/geolocation-mock.js';

const mock = new GeolocationMock();
const mockCoords = {accuracy: 100,
                    latitude: 51.478,
                    longitude: -0.166,
                    altitude: null,
                    altitudeAccuracy: null,
                    heading: null,
                    speed: null};

[
  {status: GeolocationPermissionStatus.GRANTED_PRECISE, label: 'precise'},
  {status: GeolocationPermissionStatus.GRANTED_APPROXIMATE, label: 'approximate'}
].forEach(({status, label}) => {
    promise_test(async () => {
    mock.setGeolocationPermission(status);
    mock.setGeolocationPosition(mockCoords.latitude,
                                mockCoords.longitude,
                                mockCoords.accuracy);

    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
          resolve,
          (e) => reject(new Error(`Error callback invoked unexpectedly: ${e.message}`)));
    });

    assert_object_equals(position.coords.toJSON(), mockCoords);

    const timestamp = position.timestamp;
    const expectedPosition = {timestamp, coords: mockCoords};
    assert_object_equals(position.toJSON(), expectedPosition);
  }, `Tests toJSON() on GeolocationPosition and GeolocationCoordinates with ${label} accuracy.`);
});
</script>
</body>
</html>
