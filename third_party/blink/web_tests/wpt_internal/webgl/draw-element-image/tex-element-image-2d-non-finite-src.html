<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ensure texElementSubImage2D with src rects given</title>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/wpt_internal/resources/canvas-draw-element/waitForCanvasPaint.js"></script>
    <style>
      #child {
        width: 16px;
        height: 16px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <canvas id="canvasHost" width="32" height="32" content=drawable>
      <div drawable id="child">
      </div>
    </canvas>
    <script>
      function runTest() {
        async_test(t => {
          const gl = canvasHost.getContext("webgl2");
          if (!gl) {
            assert_unreached("webgl2 context not available");
            t.done();
          }

          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          const internalformat = gl.RGBA8;

          // Allocate texture backing
          gl.texImage2D(gl.TEXTURE_2D, 0, internalformat, 32, 32, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

          // Try to draw the red-box element to texture 4 times, with various error values
          assert_throws_dom("DataError",
              () => gl.texElementSubImage2D(gl.TEXTURE_2D, /*level*/0, /*xoffset*/0, /*yoffset*/0,
                                            child, { sx:Number.POSITIVE_INFINITY, sy:0, swidth:16,
                                            sheight:16, width:16, height:16}),
              "Can't get element transform for non-finite src rect.");
          assert_throws_dom("DataError",
              () => gl.texElementSubImage2D(gl.TEXTURE_2D, /*level*/0, /*xoffset*/0, /*yoffset*/0,
                                            child, { sx:32, sy:0, swidth:Number.POSITIVE_INFINITY,
                                            sheight:16, width:16, height:16}),
              "Can't get element transform for non-finite src rect.");
          assert_throws_dom("DataError",
              () => gl.texElementSubImage2D(gl.TEXTURE_2D, /*level*/0, /*xoffset*/0, /*yoffset*/0,
                                            child, { sx:0, sy:Number.NaN, swidth:16, sheight:-16,
                                            width:16, height:16}),
              "Can't get element transform for non-finite src rect.");
          assert_throws_dom("DataError",
              () => gl.texElementSubImage2D(gl.TEXTURE_2D, /*level*/0, /*xoffset*/0, /*yoffset*/0,
                                            child, { sx:32, sy:32, swidth:-16, sheight:Number.NaN,
                                            width:16, height:16}),
              "Can't get element transform for non-finite src rect.");
          assert_throws_dom("DataError",
              () => gl.texElementSubImage2D(gl.TEXTURE_2D, /*level*/0, /*xoffset*/0, /*yoffset*/0,
                                            child, { sx:32, sy:32, swidth:0, sheight:0,
                                            width:16, height:16}),
              "Can't get element transform for zero width src rect.");

          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

          let complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) == gl.FRAMEBUFFER_COMPLETE;
          assert_true(complete);

          const pixels = new Uint8Array(32* 32 * 4);
          gl.readPixels(0, 0, 32, 32, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

          // Helper to check pixel RGBA at (x, y)
          function checkPixel(x, y, r, g, b, a, msg) {
            const idx = (y * 32 + x) * 4;
            assert_equals(pixels[idx], r, `${msg} red`);
            assert_equals(pixels[idx+1], g, `${msg} green`);
            assert_equals(pixels[idx+2], b, `${msg} blue`);
            assert_equals(pixels[idx+3], a, `${msg} alpha`);
          }

          // Check that the 4 corners of each quadrant are red (255, 0, 0, 255)
          checkPixel(0, 0, 0, 0, 0, 0, "pixel at (0, 0)");
          checkPixel(0, 15, 0, 0, 0, 0, "pixel at (0, 15)");
          checkPixel(15, 15, 0, 0, 0, 0, "pixel at (15, 15)");
          checkPixel(15, 0, 0, 0, 0, 0, "pixel at (15, 0)");
          checkPixel(16, 0, 0, 0, 0, 0, "pixel at (16, 0)");
          checkPixel(16, 15, 0, 0, 0, 0, "pixel at (16, 16)");
          checkPixel(31, 15, 0, 0, 0, 0, "pixel at (31, 15)");
          checkPixel(31, 0, 0, 0, 0, 0, "pixel at (31, 0)");
          checkPixel(0, 16, 0, 0, 0, 0, "pixel at (0, 16)");
          checkPixel(0, 31, 0, 0, 0, 0, "pixel at (0, 31)");
          checkPixel(15, 31, 0, 0, 0, 0, "pixel at (15, 31)");
          checkPixel(15, 16, 0, 0, 0, 0, "pixel at (15, 16)");
          checkPixel(16, 16, 0, 0, 0, 0, "pixel at (16, 16)");
          checkPixel(16, 31, 0, 0, 0, 0, "pixel at (16, 31)");
          checkPixel(31, 31, 0, 0, 0, 0, "pixel at (31, 31)");
          checkPixel(31, 16, 0, 0, 0, 0, "pixel at (31, 16)");

          t.done();
        }, "verify texElementSubImage2D with non-finiste src rect parameters");
      }

      onload = async () => {
        await waitForCanvasPaint(canvasHost);
        runTest();
      };
    </script>
  </body>
</html>
