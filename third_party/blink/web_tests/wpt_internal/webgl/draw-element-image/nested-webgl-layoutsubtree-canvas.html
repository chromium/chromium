<!DOCTYPE html>
<title>texElementSubImage2D should not throw if the canvas is nested inside another canvas</title>
<link rel="help" href="https://github.com/WICG/html-in-canvas">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/wpt_internal/resources/canvas-draw-element/waitForCanvasPaint.js"></script>

<canvas id="webgl_canvas" layoutsubtree="true" width="100" height="100">
  <canvas id="nested_webgl_canvas" layoutsubtree="true" width="100" height="100">
    <div id="inner_div" style="width: 100px; height: 100px; background: green;"></div>
  </canvas>
</canvas>
<script>
promise_test(async (t) => {
  await waitForCanvasPaint(webgl_canvas);
  const gl = nested_webgl_canvas.getContext('webgl2', {preserveDrawingBuffer:true});
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  // Allocate texture backing
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 100, 100, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texElementSubImage2D(gl.TEXTURE_2D, /*level*/0, /*xoffset*/0, /*yoffset*/0, inner_div);
}, "texElementSubImage2D should not throw if called on a nested webgl canvas");
</script>
