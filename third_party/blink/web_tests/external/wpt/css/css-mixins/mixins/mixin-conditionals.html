<!DOCTYPE html>
<html>
  <head>
    <title>CSS Mixins: Conditionals within mixins</title>
    <link rel="help" href="https://drafts.csswg.org/css-mixins-1/#defining-mixins">
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
  </head>
  <body>

    <style>
      @mixin --m1() {
        color: red;
        --custom-property: wrong;
        @media (width < 1000px) {
          color: green;
        }
        @supports (color: green) {
          --custom-property: exists;
        }
        @media (width > 1000px) {
          color: red;
        }
      }
      #e1 {
        @apply --m1;
      }
    </style>
    <div id="e1">This text should be green.</div>
    <script>
      test(() => {
        let e1 = document.getElementById('e1');
        assert_equals(getComputedStyle(e1).color, 'rgb(0, 128, 0)');
        assert_equals(getComputedStyle(e1).getPropertyValue('--custom-property'), 'exists');
      }, '@media and @supports wrapping mixin declarations');
    </script>


    <style>
      #container2 {
        container-type: size;
        width: 100px;
        height: 50px;
      }
      @mixin --m2() {
        @container (width = 50px) {
          color: red;
        }
        @container (width = 100px) {
          color: green;
        }
        @container (width = 200px) {
          color: red;
        }
      }
      #e2 {
        @apply --m2;
      }
    </style>
    <div id="container2"><div id="e2">This text should be green.</div></div>
    <script>
      test(() => {
        let e2 = document.getElementById('e2');
        assert_equals(getComputedStyle(e2).color, 'rgb(0, 128, 0)');
      }, '@container wrapping mixin declarations');
    </script>


    <style>
      @mixin --m3() {
        @private { --some-color: red; }
        @media (width < 3000px) {
          @private { --some-color: green; }
        }
        @supports (color: green) {
          @private { --some-other-color: blue; }
        }
        @media (width > 3000px) {
          @private { --some-color: red; }
        }
        color: var(--some-color);
        --custom-property: var(--some-other-color);
      }
      #e3 {
        @apply --m3;
      }
    </style>
    <div id="e3">This text should be green.</div>
    <script>
      test(() => {
        let e3 = document.getElementById('e3');
        assert_equals(getComputedStyle(e3).color, 'rgb(0, 128, 0)');
        assert_equals(getComputedStyle(e3).getPropertyValue('--custom-property'), 'blue');
      }, '@media and @supports wrapping @private variables');
    </script>


    <style>
      #container4 {
        container-type: size;
        width: 100px;
        height: 50px;
      }
      @mixin --m4() {
        @private { --some-color: red; }
        @container (width = 50px) {
          @private { --some-color: pink; }
        }
        @container (width = 100px) {
          @private { --some-color: pink; }
        }
        @container (width = 100px) {
          @private { --some-color: green; }
        }
        @container (width = 400px) {
          @private { --some-color: blue; }
        }
        color: var(--some-color);
      }
      #e4 {
        @apply --m4;
      }
    </style>
    <div id="container4"><div id="e4">This text should be green.</div></div>
    <script>
      test(() => {
        let e4 = document.getElementById('e4');
        assert_equals(getComputedStyle(e4).color, 'rgb(0, 128, 0)');
      }, '@container wrapping @private variables');
    </script>


    <style>
      #container4b {
        container-type: size;
        width: 400px;
        height: 50px;
      }
      #e4b {
        @apply --m4;
      }
    </style>
    <div id="container4b"><div id="e4b">This text should be blue (not green).</div></div>
    <script>
      test(() => {
        let e4b = document.getElementById('e4b');
        assert_equals(getComputedStyle(e4b).color, 'rgb(0, 0, 255)');
      }, '@private variables with different containers are not incorrectly cached');
    </script>


    <style>
      @mixin --m5() {
        @media (screen) {
          @private { --some-color: pink; }
        }
        @supports (color: green) {
          @private { --some-color: fuchsia; }
        }
        @private { --some-color: green; }
        color: var(--some-color);
      }
      #e5 {
        @apply --m5;
      }
    </style>
    <div id="container5"><div id="e5">This text should be green.</div></div>
    <script>
      test(() => {
        let e5 = document.getElementById('e5');
        assert_equals(getComputedStyle(e5).color, 'rgb(0, 128, 0)');
      }, 'Unconditional @private declarations override earlier conditional ones');
    </script>


    <style>
      #container6 {
        container-type: size;
        width: 100px;
        height: 50px;
      }
      @mixin --m6() {
        @private { --some-color: red; }
        @media (width < 3000px) {
          @container (width = 50px) {
            @private { --some-color: pink; }
          }
        }
        @container (width = 100px) {
          @media (width > 3000px) {
            @private { --some-color: violet; }
          }
        }
        @container (width = 100px) {
          @media (width < 4000px) {
            @private { --some-color: green; }
          }
        }
        @media (width < 2000px) {
          @container (width = 100px) {
            color: var(--some-color);
          }
        }
      }
      #e6 {
        @apply --m6;
      }
    </style>
    <div id="container6"><div id="e6">This text should be green.</div></div>
    <script>
      test(() => {
        let e6 = document.getElementById('e6');
        assert_equals(getComputedStyle(e6).color, 'rgb(0, 128, 0)');
      }, '@private variables in nested @media and @container rules');
    </script>

  </body>
</html>
