<!DOCTYPE html>
<title>Request URL Modifiers: integrity() negative test for a cross-origin @font-face src without cross-origin()</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/css-values-5/#typedef-request-url-modifier-integrity-modifier">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-fetching-requirements">
<link rel="help" href="https://w3c.github.io/webappsec-subresource-integrity/#does-response-match-metadatalist">
<link rel="match" href="../support/font-integrity-fallback-ref.html">
<meta name="assert" content="A cross-origin @font-face src url with a matching integrity() modifier but no cross-origin() modifier should not load the font.">
<style>
@font-face {
  font-family: "TestFont";
  src: url("http://{{hosts[][]}}:{{ports[http][1]}}/fonts/Ahem.ttf" integrity("sha384-w4xf1vlV5+NPiDF/7K8XA+JCeRlbDvxUHAu37KJUCXLG4A7uii/uYUSslO877bNW"));
}
body {
  margin: 0;
}
div {
  font: 20px/1 "TestFont", serif;
}
</style>
<div>Fallback text</div>
