<!DOCTYPE html>
<html class="reftest-wait">
<title>CSS Overflow Test: An absolutely positioned ::backdrop of a fullscreen element doesn't cover the root scrollbar-gutter</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">
<link rel="help" href="https://drafts.csswg.org/css-overflow-3/#scrollbar-gutter-property">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/9904">
<link rel="match" href="scrollbar-gutter-fullscreen-004-ref.html">
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>

<style>
:root {
  scrollbar-gutter: stable both-edges;
  background: blue;
}
#target {
  background: transparent;
}
#target::backdrop {
  position: absolute;
  background: green;
}
</style>

<div id="target"></div>

<script>
document.addEventListener("fullscreenchange", () => {
  document.documentElement.classList.remove("reftest-wait");
});
test_driver.bless("fullscreen", () => target.requestFullscreen());
</script>
</html>
