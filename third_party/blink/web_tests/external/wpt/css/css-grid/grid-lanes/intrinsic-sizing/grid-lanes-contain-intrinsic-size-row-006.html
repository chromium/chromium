<!doctype html>
<meta charset="utf8">
<title>CSS contain-intrinsic-size: grid lanes inline-size containment</title>
<link rel="help" href="https://drafts.csswg.org/css-contain-3/#containment-inline-size">
<link rel="help" href="https://drafts.csswg.org/css-grid-3">
<link rel="match" href="grid-lanes-contain-intrinsic-size-row-006-ref.html">
<meta name="assert" content="A row grid lanes container with inline-size containment takes its max-content inline size from contain-intrinsic-inline-size, or zero without it, and keeps the block size of its rows.">

<style>
.grid {
  border: 3px solid black;
  display: grid-lanes;
  grid-template-rows: 55px 66px;
  contain: inline-size;
  width: max-content;
  background: lightblue;
  grid-gap: 5px;
  margin-bottom: 10px;
}
.intrinsic-size {
  contain-intrinsic-inline-size: 70px;
}
.item {
  background: lightgreen;
  opacity: 0.5;
  height: 50px;
  width: 50px;
}
</style>

<div class="grid intrinsic-size">
  <div class=item></div>
  <div class=item></div>
  <div class=item></div>
  <div class=item></div>
</div>
<div class=grid>
  <div class=item></div>
  <div class=item></div>
  <div class=item></div>
  <div class=item></div>
</div>
