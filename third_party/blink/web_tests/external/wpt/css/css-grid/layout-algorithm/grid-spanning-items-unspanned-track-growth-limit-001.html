<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: A track that no item of a span group spans keeps an infinite growth limit</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#algo-spanning-items">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#extra-space">
<meta name="assert" content="This test checks that distributing extra space for the items of a given span only updates the tracks those items span, so that a track spanned only by an item of a larger span still has an infinite growth limit when that item is accommodated.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
#columns {
  display: grid;
  grid-template-columns: auto auto auto auto;
  width: 350px;
}
#columns > div { height: 10px; }
#columns > :nth-child(1) { grid-column: 1 / 3; grid-row: 1; width: 100px; }
#columns > :nth-child(2) { grid-column: 2 / 5; grid-row: 2; width: 300px; }

#rows {
  display: grid;
  grid-template-columns: 10px 10px;
  grid-template-rows: auto auto auto auto;
  width: 100px;
}
#rows > div { width: 10px; }
#rows > :nth-child(1) { grid-row: 1 / 3; grid-column: 1; height: 100px; }
#rows > :nth-child(2) { grid-row: 2 / 5; grid-column: 2; height: 300px; }
</style>
<div id="columns">
  <div></div>
  <div></div>
</div>
<div id="rows">
  <div></div>
  <div></div>
</div>
<script>
// The span 2 item puts tracks 1 and 2 at 50px. Tracks 3 and 4 have infinite growth limits, so the
// span 3 item's remaining 250px goes to them rather than being shared with the frozen track 2.
test(() => {
  assert_equals(getComputedStyle(document.getElementById("columns")).gridTemplateColumns, "50px 50px 125px 125px");
}, "Columns");

test(() => {
  assert_equals(getComputedStyle(document.getElementById("rows")).gridTemplateRows, "50px 50px 125px 125px");
}, "Rows");
</script>
