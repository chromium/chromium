<!DOCTYPE html>
<meta charset="utf-8">
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#algo-spanning-flex-items">
<meta name="assert" content="A grid under a min-content constraint can distribute the size contribution of a 10px item spanning three 0.2fr columns, whose flex factors sum to less than one, without crashing.">
<style>
  #container { width: min-content; }
  #grid {
    display: grid;
    grid-template-columns: 0.2fr 0.2fr 0.2fr;
  }
  #item {
    grid-column: span 3;
    width: 10px;
    height: 10px;
  }
</style>
<div id="container">
  <div id="grid"><div id="item"></div></div>
</div>
