<!DOCTYPE html>
<title>CSS Gap Decorations: coincident aligned item and spanning item edges do not crash</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segment-endpoints">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#stacking-self-alignment">
<style>
  #lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 60px);
    column-gap: 20px;
    row-gap: 0;
    column-rule: 2px solid blue;
    width: 140px;
    height: 120px;
  }
  #aligned {
    grid-column: 1;
    height: 20px;
    align-self: end;
  }
  #tall {
    grid-column: 2;
    height: 100px;
  }
  #spanner {
    grid-column: 1 / -1;
    height: 20px;
  }
</style>
<div id="lanes">
  <div id="aligned"></div>
  <div id="tall"></div>
  <div id="spanner"></div>
</div>
