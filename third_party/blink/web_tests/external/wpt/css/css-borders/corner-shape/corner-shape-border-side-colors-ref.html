<!DOCTYPE html>
<head>
<title>CSS Borders and Box Decorations 4: 'corner-shape' with different border colors — reference</title>
<style>
    body { margin: 0; }
    .container {
        width: 200px;
        height: 100px;
        margin-bottom: 10px;
    }
    .target {
        margin-left: 40px;
        width: 120px;
        height: 100px;
        box-sizing: border-box;
        border-style: solid;
        border-width: 10px 0;
        border-color: green blue blue blue;
    }
</style>
</head>
<div class="container"><div class="target"></div></div>
<div class="container"><div class="target"></div></div>
<div class="container"><div class="target"></div></div>
<div class="container"><div class="target" style="border-width: 1px 0"></div></div>
