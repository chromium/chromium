<!DOCTYPE html>
<title>Negative margins do not move grid-lanes items into an earlier row fragment</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-breaks-017-ref.html">
<style>
  .case { padding-top: 50px; margin-bottom: 20px; }
  .multicol {
    columns: 2;
    column-gap: 0;
    column-fill: auto;
    width: 160px;
    height: 100px;
    background: lightgray;
  }
  .lanes { display: grid-lanes; grid-template-rows: 150px 20px; width: 80px; }
  .lanes > div { width: 80px; }
  .negative { grid-row: 2; height: 20px; margin-top: -100px; align-self: start; background: orange; }
</style>
<div class="case">
  <div class="multicol">
    <div class="lanes">
      <div style="grid-row: 1"></div>
      <div class="negative"></div>
    </div>
  </div>
</div>
<div class="case">
  <div class="multicol">
    <div class="lanes">
      <div class="negative"></div>
    </div>
  </div>
</div>
