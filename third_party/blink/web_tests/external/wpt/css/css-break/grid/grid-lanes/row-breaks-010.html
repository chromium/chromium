<!DOCTYPE html>
<title>Column balancing accounts for avoided breaks in row grid-lanes</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-breaks-010-ref.html">
<style>
  .multicol { columns: 2; column-gap: 0; width: 160px; background: lightgray; }
  .lanes { display: grid-lanes; grid-template-rows: repeat(3, 40px); width: 80px; }
  .lanes > div { width: 80px; break-inside: avoid; }
</style>
<div class="multicol">
  <div class="lanes">
    <div style="grid-row: 1; background: orange;"></div>
    <div style="grid-row: 2; background: teal;"></div>
    <div style="grid-row: 3; background: purple;"></div>
  </div>
</div>
