<!DOCTYPE html>
<title>Reference for a spanning row item across a forced row break</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<style>
  .reference { position: relative; width: 160px; height: 100px; background: lightgray; }
  .reference > div { position: absolute; width: 40px; }
</style>
<div class="reference">
  <div style="height: 100px; background: orange;"></div>
  <div style="left: 40px; height: 60px; background: teal;"></div>
  <div style="left: 80px; height: 60px; background: orange;"></div>
  <div style="left: 120px; height: 60px; background: purple;"></div>
</div>
