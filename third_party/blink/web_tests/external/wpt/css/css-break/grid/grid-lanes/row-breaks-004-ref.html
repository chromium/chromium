<!DOCTYPE html>
<title>Reference for overflow outside a fixed row</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<style>
  .reference { position: relative; width: 240px; height: 100px; background: lightgray; }
  .reference > div { position: absolute; }
</style>
<div class="reference">
  <div style="width: 40px; height: 60px; background: orange;"></div>
  <div style="left: 40px; width: 40px; height: 60px; background: teal;"></div>
  <div style="top: 60px; width: 40px; height: 20px; background: purple;"></div>
  <div style="left: 40px; top: 60px; width: 40px; height: 20px; background: yellow;"></div>
  <div style="left: 80px; width: 40px; height: 30px; background: blue;"></div>
  <div style="left: 80px; width: 80px; height: 20px; background: green;"></div>
</div>
