<!DOCTYPE html>
<title>Reference for row overflow across a forced break</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<style>
  .reference { position: relative; width: 240px; height: 100px; background: lightgray; }
  .reference > div { position: absolute; }
</style>
<div class="reference">
  <div style="width: 40px; height: 100px; background: blue;"></div>
  <div style="left: 40px; width: 40px; height: 20px; background: teal;"></div>
  <div style="left: 80px; width: 80px; height: 40px; background: orange;"></div>
  <div style="left: 80px; top: 40px; width: 40px; height: 60px; background: blue;"></div>
  <div style="left: 160px; width: 40px; height: 50px; background: blue;"></div>
</div>
