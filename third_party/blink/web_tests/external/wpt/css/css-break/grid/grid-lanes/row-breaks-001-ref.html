<!DOCTYPE html>
<title>Reference for a row moved to the next column</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<style>
  .reference { position: relative; width: 240px; height: 100px; background: lightgray; }
  .reference > div { position: absolute; width: 40px; height: 60px; }
</style>
<div class="reference">
  <div style="background: orange;"></div>
  <div style="left: 40px; background: blue;"></div>
  <div style="left: 80px; background: teal;"></div>
  <div style="left: 120px; background: purple;"></div>
  <div style="left: 80px; top: 60px; width: 80px; height: 20px; background: yellow;"></div>
</div>
