<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS Motion Path test: moving an absolutely positioned box with a ray() offset-path</title>
<link rel="help" href="https://drafts.csswg.org/motion/#offset-path-property">
<link rel="match" href="offset-path-ray-out-of-flow-ref.html">
<meta name="assert" content="The offset starting position of a ray() offset-path does not depend on the box position, so changing left does not move the box.">
<style>
#container {
  position: relative;
  width: 200px;
  height: 200px;
  background: red;
}
#target {
  position: absolute;
  left: 0;
  top: 0;
  width: 200px;
  height: 200px;
  background: green;
  offset-path: ray(90deg closest-side);
  offset-position: 50% 50%;
  offset-distance: 0;
}
</style>
<p>Test passes if there is a green square and no red.</p>
<div id="container"><div id="target"></div></div>
<script>
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    document.getElementById("target").style.left = "100px";
    document.documentElement.removeAttribute("class");
  });
});
</script>
</html>
