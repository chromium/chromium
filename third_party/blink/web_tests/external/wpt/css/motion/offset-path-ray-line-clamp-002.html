<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS Motion Path test: resizing the only child of a -webkit-line-clamp container with a ray() offset-path</title>
<link rel="help" href="https://drafts.csswg.org/motion/#offset-path-property">
<link rel="match" href="offset-path-ray-line-clamp-ref.html">
<meta name="assert" content="Resizing the child of a -webkit-line-clamp container updates its offset-path transform.">
<style>
#container {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  width: 200px;
  background: red;
  font: 50px/50px monospace;
}
#target {
  width: 100px;
  color: transparent;
  background: green;
  offset-path: ray(90deg closest-side);
  offset-position: 50% 50%;
  offset-distance: 0;
}
</style>
<p>Test passes if there is a green rectangle and no red.</p>
<div id="container"><div id="target">X</div></div>
<script>
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    document.getElementById("target").style.width = "200px";
    document.documentElement.removeAttribute("class");
  });
});
</script>
</html>
