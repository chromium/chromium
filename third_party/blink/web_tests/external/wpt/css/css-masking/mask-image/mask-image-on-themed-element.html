<title>Mask layers apply to natively-themed form controls</title>
<!-- A mixed SVG + image mask intersected with a fully transparent image layer
     should mask out the whole element, including its native appearance. -->
<style>
  button, input {
    display: block;
    width: 200px;
    height: 50px;
    margin: 10px;
    mask: url(#m), linear-gradient(transparent, transparent);
    mask-composite: intersect;
  }
</style>
<svg width="0" height="0" style="position: absolute">
  <mask id="m" maskContentUnits="objectBoundingBox">
    <rect width="1" height="1" fill="white"/>
  </mask>
</svg>
<button>button</button>
<input type="checkbox">
<input type="text" value="text">
