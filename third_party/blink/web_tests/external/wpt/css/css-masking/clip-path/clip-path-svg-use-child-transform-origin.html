<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Masking: clipPath use child with a CSS transform and transform-origin</title>
<link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#ClipPathElement">
<link rel="help" href="https://drafts.csswg.org/css-transforms-1/#transform-origin-property">
<link rel="match" href="clip-path-svg-use-child-transform-origin-ref.html">
<meta name="assert" content="A CSS transform on a use element inside a clipPath is applied about its transform-origin, before the translation by the x and y attributes, exactly like the equivalent transform attribute.">
<style>#u { transform: rotate(30deg); transform-origin: 100px 100px; }</style>
<svg width="300" height="300">
  <defs><rect id="r" x="50" y="50" width="100" height="100"/></defs>
  <clipPath id="c"><use id="u" href="#r" x="20" y="10"/></clipPath>
  <rect width="300" height="300" fill="green" clip-path="url(#c)"/>
</svg>
