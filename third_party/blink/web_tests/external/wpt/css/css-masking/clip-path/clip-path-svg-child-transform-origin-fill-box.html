<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Masking: clipPath child with a CSS transform and transform-box: fill-box</title>
<link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#ClipPathElement">
<link rel="help" href="https://drafts.csswg.org/css-transforms-1/#transform-origin-property">
<link rel="help" href="https://drafts.csswg.org/css-transforms-1/#transform-box">
<link rel="match" href="clip-path-svg-child-transform-origin-fill-box-ref.html">
<meta name="assert" content="A CSS transform on a clipPath child with transform-box: fill-box is applied about the center of its bounding box, exactly like the equivalent transform attribute.">
<style>#r { transform: rotate(30deg); transform-box: fill-box; transform-origin: center; }</style>
<svg width="300" height="300">
  <clipPath id="c"><rect id="r" x="50" y="50" width="100" height="100"/></clipPath>
  <rect width="300" height="300" fill="green" clip-path="url(#c)"/>
</svg>
