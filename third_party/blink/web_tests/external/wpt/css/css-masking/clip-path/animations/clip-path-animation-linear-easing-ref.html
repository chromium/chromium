<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference for clip-path animations with linear() easing</title>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
  }

  .grid > div {
    width: 100px;
    height: 100px;
    background: green;
  }
</style>
<div class="grid">
  <!-- Interpolating inset(30%) to inset(10%) at eased progress values
       0.25, 0.75, 1.5, -0.5, 0.25, and 0.75, respectively. -->
  <div style="clip-path: inset(25%)"></div>
  <div style="clip-path: inset(15%)"></div>
  <div style="clip-path: inset(0%)"></div>
  <div style="clip-path: inset(40%)"></div>
  <div style="clip-path: inset(25%)"></div>
  <div style="clip-path: inset(15%)"></div>
</div>
