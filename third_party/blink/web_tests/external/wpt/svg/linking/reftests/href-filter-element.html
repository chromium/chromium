<!DOCTYPE html>
<meta charset="utf-8">
<title>href - filter element is ignored</title>
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#FilterElement">
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#FilterPrimitiveTree">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/13949">
<meta name="assert" content="The filter element has no href attribute. A filter element with no children does not take the primitives of the filter its href or xlink:href points at, so it has no filter primitive tree and the element it applies to is not rendered.">
<link rel="match" href="href-filter-element-ref.html">
<body>
  <svg width="300" height="300" viewBox="0 0 300 300"
       xmlns:xlink="http://www.w3.org/1999/xlink">
    <filter id="blurMe">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="withHref" href="#blurMe"></filter>
    <filter id="withXlinkHref" xlink:href="#dropShadow"></filter>
    <rect x="10" y="10" width="100" height="100" fill="green"/>
    <rect x="10" y="10" width="100" height="100" fill="red" filter="url(#withHref)"/>
    <rect x="150" y="10" width="100" height="100" fill="green"/>
    <rect x="150" y="10" width="100" height="100" fill="red" filter="url(#withXlinkHref)"/>
  </svg>
</body>
