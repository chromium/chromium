<!DOCTYPE html>
<meta charset="utf-8">
<title>Reference for non-scaling-stroke with a transform on the outermost svg element</title>
<link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
<style>
  body { margin: 0; }
  svg { display: block; width: 200px; height: 200px; }
  rect { fill: none; stroke: green; stroke-width: 10px; }
</style>
<svg transform="scale(0.5)"><rect x="50" y="50" width="100" height="100"/></svg>
<svg style="transform: scale(0.5)"><rect x="50" y="50" width="100" height="100"/></svg>
