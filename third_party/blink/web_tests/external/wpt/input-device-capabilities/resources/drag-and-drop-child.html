<!DOCTYPE html>
<meta charset="utf-8">
<style>
html, body, #child_target {
  margin: 0;
  width: 100%;
  height: 100%;
}
</style>
<div id="child_target" draggable="true">child</div>
<script>
function describe(event) {
  const capabilities = event.sourceCapabilities;
  return {
    eventType: event.type,
    isNull: capabilities === null,
    ownRealm: capabilities !== null &&
        Object.getPrototypeOf(capabilities) ===
            InputDeviceCapabilities.prototype,
    firesTouchEvents: capabilities ? capabilities.firesTouchEvents : null,
    ownView: event.view === window,
  };
}

const childTarget = document.getElementById('child_target');
let dragEvents = [];

// Keep a reference to this window's InputDeviceCapabilities wrapper so it
// stays in this realm before the parent inspects its drag/dragend events
// (cross-origin drags do not dispatch dragover/drop in the target frame).
let childCapabilities = null;
childTarget.addEventListener('mousemove', e => {
  childCapabilities = e.sourceCapabilities;
  parent.postMessage({type: 'mousemove'}, '*');
}, {once: true});

childTarget.addEventListener('dragstart', e => {
  dragEvents = [e];
});
childTarget.addEventListener('drag', e => {
  dragEvents.push(e);
});
childTarget.addEventListener('dragend', e => {
  dragEvents.push(e);
  parent.postMessage({
    type: 'child-dragend',
    events: dragEvents.map(describe),
  }, '*');
});

childTarget.addEventListener('dragover', e => e.preventDefault());
childTarget.addEventListener('drop', e => e.preventDefault());

window.addEventListener('load', () => {
  parent.postMessage({type: 'ready'}, '*');
});
</script>
