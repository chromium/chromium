<!doctype html>
<meta charset="utf-8">
<title>Pointer boundary events across same-origin documents (tentative)</title>
<!--

pointerevent_boundary_events_cross_origin.html tests that the cross-origin
cases do not expose the true relatedTarget node (which is required for
security).  This test tests that the same-origin but cross-document cases also
do not expose the true relatedTarget node.

It seems like there is general agreement in
https://github.com/w3c/pointerevents/issues/656 that this is correct but I'm
not sure if it's required by any spec.

-->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    touch-action: none;
  }
  .target {
    width: 100px;
    height: 100px;
    background: blue;
    touch-action: none;
  }
  iframe {
    width: 100px;
    height: 100px;
    border: none;
    display: block;
  }
  #done {
    display: block;
    margin-top: 10px;
    touch-action: none;
  }
</style>
<body>
<button id="done">Done</button>
<script>
'use strict';

function loadIframe(iframe) {
  return new Promise(resolve => {
    iframe.srcdoc = `<!doctype html>
      <style>
        html, body { margin: 0; padding: 0; touch-action: none; }
        #child-target { width: 100px; height: 100px; background: green; touch-action: none; }
      </style>
      <div id="child-target"></div>`;
    iframe.onload = resolve;
  });
}

async function tapDoneButton() {
  const doneButton = document.getElementById('done');
  const donePromise = new Promise(resolve => {
    const onDone = () => {
      doneButton.removeEventListener('pointerup', onDone);
      doneButton.removeEventListener('click', onDone);
      resolve();
    };
    doneButton.addEventListener('pointerup', onDone);
    doneButton.addEventListener('click', onDone);
  });
  await new test_driver.Actions()
    .addPointer('touchPointerDone', 'touch')
    .pointerMove(0, 0, {origin: doneButton})
    .pointerDown()
    .pointerUp()
    .send();
  await donePromise;
}

promise_test(async t => {
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const parentTarget = document.createElement('div');
  parentTarget.id = 'parent-target';
  parentTarget.className = 'target';
  container.appendChild(parentTarget);

  const iframe = document.createElement('iframe');
  iframe.id = 'iframe';
  container.appendChild(iframe);

  await loadIframe(iframe);
  const childDoc = iframe.contentDocument;
  const childTarget = childDoc.getElementById('child-target');

  let parentEvents = [];
  let childEvents = [];

  parentTarget.addEventListener('pointerdown', e => {
    e.target.releasePointerCapture(e.pointerId);
  });
  parentTarget.addEventListener('pointerout', e => {
    parentEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });
  parentTarget.addEventListener('pointerleave', e => {
    parentEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });

  childTarget.addEventListener('pointerover', e => {
    childEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });
  childTarget.addEventListener('pointerenter', e => {
    childEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });

  await new test_driver.Actions()
    .addPointer('touchPointer', 'touch')
    .pointerMove(0, 0, {origin: parentTarget})
    .pointerDown()
    .pointerMove(0, 0, {origin: iframe})
    .pointerUp()
    .send();

  await tapDoneButton();

  assert_equals(
    parentEvents.map(e => `${e.type} from ${e.relatedTarget ? e.relatedTarget.id : "null"}`).join(),
    "pointerout from iframe,pointerleave from iframe"
  );

  assert_equals(
    childEvents.map(e => `${e.type} from ${e.relatedTarget ? e.relatedTarget.id : "null"}`).join(),
    "pointerover from null,pointerenter from null"
  );
}, 'Parent to same-origin iframe: relatedTarget is not exposed across documents');

promise_test(async t => {
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const parentTarget = document.createElement('div');
  parentTarget.id = 'parent-target';
  parentTarget.className = 'target';
  container.appendChild(parentTarget);

  const iframe = document.createElement('iframe');
  iframe.id = 'iframe';
  container.appendChild(iframe);

  await loadIframe(iframe);
  const childDoc = iframe.contentDocument;
  const childTarget = childDoc.getElementById('child-target');

  let parentEvents = [];
  childTarget.addEventListener('pointerdown', e => {
    e.target.releasePointerCapture(e.pointerId);
    iframe.remove();
  });

  parentTarget.addEventListener('pointerover', e => {
    parentEvents.push({ type: e.type, relatedTargetIsNull: e.relatedTarget === null });
  });
  parentTarget.addEventListener('pointerenter', e => {
    parentEvents.push({ type: e.type, relatedTargetIsNull: e.relatedTarget === null });
  });

  await new test_driver.Actions()
    .addPointer('touchPointer', 'touch')
    .pointerMove(0, 0, {origin: iframe})
    .pointerDown()
    .pointerMove(0, 0, {origin: parentTarget})
    .pointerUp()
    .send();

  await tapDoneButton();

  assert_equals(
    parentEvents.map(e => `${e.type} (null: ${e.relatedTargetIsNull})`).join(),
    "pointerover (null: true),pointerenter (null: true)"
  );
}, 'Same-origin iframe to parent with iframe removed: relatedTarget is null');

promise_test(async t => {
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const sib1 = document.createElement('iframe');
  container.appendChild(sib1);

  const sib2 = document.createElement('iframe');
  container.appendChild(sib2);

  await Promise.all([
    new Promise(resolve => {
      sib1.srcdoc = `<!doctype html>
        <style>html, body { margin: 0; padding: 0; touch-action: none; }
        #s1 { width: 100px; height: 100px; background: green; touch-action: none; }</style>
        <div id="s1"></div>`;
      sib1.onload = resolve;
    }),
    new Promise(resolve => {
      sib2.srcdoc = `<!doctype html>
        <style>html, body { margin: 0; padding: 0; touch-action: none; }
        #s2 { width: 100px; height: 100px; background: red; touch-action: none; }</style>
        <div id="s2"></div>`;
      sib2.onload = resolve;
    })
  ]);

  const s1 = sib1.contentDocument.getElementById('s1');
  const s2 = sib2.contentDocument.getElementById('s2');

  let s1Events = [];
  let s2Events = [];

  s1.addEventListener('pointerdown', e => {
    e.target.releasePointerCapture(e.pointerId);
  });
  s1.addEventListener('pointerout', e => {
    s1Events.push({ type: e.type, relatedTarget: e.relatedTarget });
  });
  s1.addEventListener('pointerleave', e => {
    s1Events.push({ type: e.type, relatedTarget: e.relatedTarget });
  });

  s2.addEventListener('pointerover', e => {
    s2Events.push({ type: e.type, relatedTarget: e.relatedTarget });
  });
  s2.addEventListener('pointerenter', e => {
    s2Events.push({ type: e.type, relatedTarget: e.relatedTarget });
  });

  await new test_driver.Actions()
    .addPointer('touchPointer', 'touch')
    .pointerMove(0, 0, {origin: sib1})
    .pointerDown()
    .pointerMove(0, 0, {origin: sib2})
    .pointerUp()
    .send();

  await tapDoneButton();

  assert_equals(
    s1Events.map(e => `${e.type} from ${e.relatedTarget ? e.relatedTarget.id : "null"}`).join(),
    "pointerout from null,pointerleave from null"
  );

  assert_equals(
    s2Events.map(e => `${e.type} from ${e.relatedTarget ? e.relatedTarget.id : "null"}`).join(),
    "pointerover from null,pointerenter from null"
  );
}, 'Sibling same-origin iframes: relatedTarget is not exposed across documents');

promise_test(async t => {
  const container = document.createElement('div');
  document.body.appendChild(container);
  t.add_cleanup(() => container.remove());

  const topTarget = document.createElement('div');
  topTarget.id = 'top-target-nested';
  topTarget.className = 'target';
  topTarget.style.background = 'cyan';
  container.appendChild(topTarget);

  const outerIframe = document.createElement('iframe');
  outerIframe.id = 'outer-iframe';
  container.appendChild(outerIframe);

  await new Promise(resolve => {
    outerIframe.srcdoc = `<!doctype html>
      <style>html, body { margin: 0; padding: 0; touch-action: none; }
      iframe { width: 100px; height: 100px; border: none; display: block; }</style>
      <iframe id="inner-iframe" srcdoc="<!doctype html>
        <style>html, body { margin: 0; padding: 0; touch-action: none; }
        #deep { width: 100px; height: 100px; background: orange; touch-action: none; }</style>
        <div id='deep'></div>"></iframe>`;
    outerIframe.onload = () => {
      const inner = outerIframe.contentDocument.getElementById('inner-iframe');
      if (inner.contentDocument && inner.contentDocument.getElementById('deep')) {
        resolve();
      } else {
        inner.onload = resolve;
      }
    };
  });

  const innerIframe = outerIframe.contentDocument.getElementById('inner-iframe');
  const deepTarget = innerIframe.contentDocument.getElementById('deep');

  let topEvents = [];
  let deepEvents = [];

  topTarget.addEventListener('pointerdown', e => {
    e.target.releasePointerCapture(e.pointerId);
  });
  topTarget.addEventListener('pointerout', e => {
    topEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });
  topTarget.addEventListener('pointerleave', e => {
    topEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });

  deepTarget.addEventListener('pointerover', e => {
    deepEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });
  deepTarget.addEventListener('pointerenter', e => {
    deepEvents.push({ type: e.type, relatedTarget: e.relatedTarget });
  });

  await new test_driver.Actions()
    .addPointer('touchPointer', 'touch')
    .pointerMove(0, 0, {origin: topTarget})
    .pointerDown()
    .pointerMove(0, 0, {origin: outerIframe})
    .pointerUp()
    .send();

  await tapDoneButton();

  assert_equals(
    topEvents.map(e => `${e.type} from ${e.relatedTarget ? e.relatedTarget.id : "null"}`).join(),
    "pointerout from outer-iframe,pointerleave from outer-iframe"
  );

  assert_equals(
    deepEvents.map(e => `${e.type} from ${e.relatedTarget ? e.relatedTarget.id : "null"}`).join(),
    "pointerover from null,pointerenter from null"
  );
}, 'Nested same-origin iframes: relatedTarget is not exposed across documents');
</script>
</body>
