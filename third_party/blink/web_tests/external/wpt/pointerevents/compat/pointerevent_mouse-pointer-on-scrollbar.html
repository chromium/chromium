<!DOCTYPE HTML>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script type="text/javascript" src="../pointerevent_support.js"></script>
<style>
#target {
  height: 100px;
  width: 100px;
  overflow-y: scroll;
}
#spacer {
  background: green;
  height: 200px;
}
</style>
<h1>Verifies that pointerup/down are fired correctly for corresponding mouse events on the scollbar.</h1>
<div id="target">
  <div id="spacer"></div>
</div>

<script>
"use strict";

var receivedEvents = [];
var targetDiv = document.getElementById('target');

function init() {
  var eventList = ["mousedown", "mouseup", "pointerdown", "pointerup"];
  eventList.forEach(function(eventName) {
    targetDiv.addEventListener(eventName, function(event) {
      receivedEvents.push(event.type + "@target");
    });
  });
}

function performActions(x, y){
  return new test_driver.Actions()
        .pointerMove(x, y)
        .pointerDown(0)
        .pointerUp(0)
        .send()
        .then(()=>resolveWhen(()=>receivedEvents.length == 4));
}

function runTests() {
  var scrollbarWidth = getElementScrollbarWidth(targetDiv);
  var rect = targetDiv.getBoundingClientRect();
  var x1 = rect.right - scrollbarWidth / 2;
  var y1 = rect.top + 20;

  promise_test(async () => {
    // Skip the test on platforms with overlay scrollbars.
    if (scrollbarWidth <= 0) {
      return;
    }
    // With a classic scrollbar, (x1, y1) hits #target's scrollbar instead of
    // #spacer beneath the scrollbar.
    assert_equals(document.elementFromPoint(x1, y1), targetDiv,
      "Didn't hit the scrollbar as expected");
    await performActions(Math.ceil(x1), Math.ceil(y1));
    assert_array_equals(receivedEvents, ["pointerdown@target", "mousedown@target",
      "pointerup@target", "mouseup@target"]);
  }, "Verifies that pointerup/down are fired correctly for corresponding mouse events on the scollbar.");
}

init();
runTests();
</script>
