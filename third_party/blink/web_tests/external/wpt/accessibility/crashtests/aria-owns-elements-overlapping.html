<!DOCTYPE html>
<!-- Multiple overlapping aria-owns relations set via ariaOwnsElements do not
     crash. Element reference version of aria-owns-overlapping.html. -->
<html class="test-wait">
<main id='great-grandparent'>
  <fieldset id="grandparent">
    <p id='parent'>
      <i id='child'></i>
    </p>
  </fieldset>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById('child').ariaOwnsElements =
      [document.getElementById('grandparent')];
  document.getElementById('great-grandparent').ariaOwnsElements =
      [document.getElementById('parent')];
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.style.display = "none";
      document.documentElement.className = '';
    });
  });
});
</script>
</html>
