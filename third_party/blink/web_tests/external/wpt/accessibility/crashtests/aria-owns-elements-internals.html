<!DOCTYPE html>
<!-- An owner whose aria-owns relation is set via
     ElementInternals.ariaOwnsElements, including cycles and removal, doesn't
     crash. -->
<html class="test-wait">
<body>
  <x-owner id="owner"></x-owner>
  <div id="container">
    <button id="owned-1">1</button>
    <div id="owned-2"><span id="nested">2</span></div>
  </div>
<script>
class XOwner extends HTMLElement {
  constructor() {
    super();
    this.i = this.attachInternals();
  }
}
customElements.define('x-owner', XOwner);

function nextFrame() {
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

(async () => {
  const owner = document.getElementById('owner');
  const owned1 = document.getElementById('owned-1');
  const owned2 = document.getElementById('owned-2');
  const nested = document.getElementById('nested');

  // Duplicate references, and a reference to an ancestor of the owner.
  owner.i.ariaOwnsElements = [owned1, owned1, owned2, document.body];
  await nextFrame();

  // Try to create a cycle: an owned descendant owns the owner.
  nested.ariaOwnsElements = [owner];
  await nextFrame();

  // A competing owner for the same element, via the content attribute.
  document.getElementById('container').setAttribute('aria-owns', 'owned-1');
  await nextFrame();

  // Move an owned element into a shadow root and back.
  const shadow = owner.attachShadow({mode: 'open'});
  shadow.appendChild(owned1);
  await nextFrame();
  document.body.appendChild(owned1);
  await nextFrame();

  // An empty aria-owns content attribute on the owner takes precedence over
  // the references set via ElementInternals, and removing it restores them.
  owner.setAttribute('aria-owns', '');
  await nextFrame();
  owner.removeAttribute('aria-owns');
  await nextFrame();

  // Clear via internals, then remove the owner.
  owner.i.ariaOwnsElements = null;
  await nextFrame();
  owner.i.ariaOwnsElements = [owned2];
  owner.remove();
  await nextFrame();
  owned2.remove();
  await nextFrame();

  document.documentElement.className = '';
})();
</script>
</body>
</html>
