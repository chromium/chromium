<!DOCTYPE html>
<!-- Removing a subtree that contains an aria-owns cycle set via
     ariaOwnsElements doesn't crash. Element reference version of
     aria-owns-remove-subtree-cycle.html. -->
<html class="test-wait">
<script>
document.addEventListener("DOMContentLoaded", () => {
  fifth.appendChild(third);

  document.documentElement.ariaOwnsElements = [third];
  third.ariaOwnsElements = [fourth];
  fourth.ariaOwnsElements = [fifth];

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.style.display = "none";
      document.documentElement.offsetHeight;
      document.documentElement.className = "";
    });
  });
});
</script>
<div id="third"></div>
<div id="fourth"></div>
<div id="fifth"></div>
</html>
