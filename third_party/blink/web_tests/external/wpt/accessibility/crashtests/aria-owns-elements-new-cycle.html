<!DOCTYPE html>
<!-- Creating an aria-owns cycle via ariaOwnsElements doesn't crash.
     Element reference version of aria-owns-new-cycle.html. -->
<html class="test-wait">
<script>
document.addEventListener("DOMContentLoaded", () => {
  const owner = document.querySelector('div');
  const child = document.getElementById('will-be-div-child');
  owner.ariaOwnsElements = [child];
  child.ariaOwnsElements = [document.getElementById('cycle-owns')];
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.className = '';
    });
  });
});
</script>
<body>
  <option>
    <canvas id="cycle-owns">
      <dialog id="will-be-div-child"></dialog>
    </canvas>
  </option>
  <meter></meter>
  <div></div>
</body>
</html>
