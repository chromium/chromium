<!DOCTYPE html>
<html class="test-wait">
<meta charset="utf-8">
<title>Accessibility crashtest: multi-pass aria-owns cycle check after owner removal, using ariaOwnsElements</title>
<!-- Element reference version of aria-owns-deferred-parent-cycle.html. -->

<div id="keeper"></div>
<div id="group2" role="switch"></div>

<div id="panel" aria-hidden="true">
  <div id="group1" role="group" aria-disabled="true"></div>
  <div id="guard2"></div>
  <div id="relay2"></div>
  <div id="wrap">
    <div id="guard1"></div>
    <div id="relay1"></div>
    <div id="owner1"></div>
  </div>
</div>

<div id="box" aria-hidden="true">
  <div id="item">
    <div id="mid"></div>
  </div>
</div>

<div id="leaf">
  <div id="probe"></div>
</div>
<div id="extra"></div>

<script>
function nextFrame() {
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

(async () => {
  keeper.ariaOwnsElements = [wrap];
  group2.ariaOwnsElements = [relay1, panel];
  guard2.ariaOwnsElements = [relay2];
  guard1.ariaOwnsElements = [relay1];
  owner1.ariaOwnsElements = [item];
  mid.ariaOwnsElements = [leaf];
  leaf.ariaOwnsElements = [relay2, box];
  await nextFrame();

  panel.removeAttribute('aria-hidden');
  box.removeAttribute('aria-hidden');
  keeper.ariaOwnsElements = null;
  await nextFrame();

  group1.ariaOwnsElements = [wrap];
  await nextFrame();

  probe.ariaOwnsElements = [extra];
  await nextFrame();

  document.documentElement.classList.remove('test-wait');
})();
</script>
</html>
