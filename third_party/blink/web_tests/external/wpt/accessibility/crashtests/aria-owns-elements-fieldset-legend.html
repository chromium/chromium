<!DOCTYPE html>
<!-- The body owning a fieldset's legend via ariaOwnsElements, set after the
     accessibility tree was built, doesn't crash. -->
<html class="test-wait">
<body>
  <fieldset>
    <legend>Legend</legend>
    <input type="checkbox">
  </fieldset>
<script>
document.addEventListener("DOMContentLoaded", () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.body.ariaOwnsElements = [document.querySelector('legend')];
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.ariaOwnsElements = null;
          document.documentElement.className = '';
        });
      });
    });
  });
});
</script>
</body>
</html>
