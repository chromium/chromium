<!DOCTYPE html>
<!-- Moving an element referenced via ariaOwnsElements into a shadow root,
     and back out again, doesn't crash. The reference stays set on the owner
     throughout. -->
<html class="test-wait">
<body>
  <div id="owner" role="group"></div>
  <div id="original-parent">
    <button id="owned">Owned</button>
  </div>
  <div id="host"></div>
  <div id="host-owner"></div>
<script>
function nextFrame() {
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

(async () => {
  const owner = document.getElementById('owner');
  const owned = document.getElementById('owned');
  const host = document.getElementById('host');
  const shadow = host.attachShadow({mode: 'open'});
  shadow.innerHTML = '<div id="inner" role="group"></div>';
  const hostOwner = document.getElementById('host-owner');
  const hostShadow = hostOwner.attachShadow({mode: 'open'});
  hostShadow.innerHTML = '<p id="inner-owner" role="group"></p>';

  owner.ariaOwnsElements = [owned];
  await nextFrame();

  // Move the owned element into a shadow root while it is owned.
  shadow.appendChild(owned);
  await nextFrame();

  // An owner inside the shadow root now references it from the same scope,
  // while the light DOM owner still holds a reference.
  shadow.getElementById('inner').ariaOwnsElements = [owned];
  await nextFrame();

  // Reference from a shadow root into the light DOM.
  hostShadow.getElementById('inner-owner').ariaOwnsElements =
      [document.getElementById('original-parent')];
  await nextFrame();

  // Move the element back out to the light DOM.
  document.getElementById('original-parent').appendChild(owned);
  await nextFrame();

  // Remove the owner, then the owned element, then re-add the owned element.
  owner.remove();
  owned.remove();
  await nextFrame();
  document.body.appendChild(owned);
  shadow.getElementById('inner').remove();
  await nextFrame();

  document.documentElement.className = '';
})();
</script>
</body>
</html>
