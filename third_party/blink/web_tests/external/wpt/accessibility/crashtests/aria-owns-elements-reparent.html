<!DOCTYPE html>
<!-- Reparenting via ariaOwnsElements while the owner's ancestor becomes
     aria-hidden doesn't crash. Element reference version of
     aria-owns-reparent.html. -->
<html class="test-wait">
<script>
document.addEventListener("DOMContentLoaded", () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.getElementById('owner').ariaOwnsElements =
          [document.getElementById('x')];
      document.body.setAttribute('aria-hidden', 'true');
      document.documentElement.className = '';
    });
  });
});
</script>
<body>
<p id='owner'></p>

<div>
  <fieldset id='x'></fieldset>
</div>
</body>
</html>
