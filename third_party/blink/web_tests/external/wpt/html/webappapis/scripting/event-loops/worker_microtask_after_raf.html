<!DOCTYPE html>
<head>
<meta charset="utf-8">
<title>Microtask checkpoint between animation frame callbacks in a dedicated worker</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/imagebitmap-and-animations.html#run-the-animation-frame-callbacks">
<link rel="author" href="mailto:januschka@gmail.com">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// Mirrors microtask_after_raf.html for dedicated workers: invoking each
// animation frame callback empties the JavaScript execution context stack, so
// a microtask checkpoint must run before the next callback in the same frame.
promise_test(t => {
  const worker = new Worker('resources/worker_microtask_after_raf.js');
  t.add_cleanup(() => worker.terminate());
  return new Promise((resolve, reject) => {
    worker.onmessage = event => resolve(event.data);
    worker.onerror = event => {
      event.preventDefault();
      reject(new Error('worker error: ' + event.message));
    };
    worker.postMessage('');
  }).then(microtask_ran => {
    assert_true(
        microtask_ran,
        'microtask queued in the first rAF callback must run before the ' +
        'second rAF callback');
  });
}, 'Microtask checkpoint runs between animation frame callbacks in a dedicated worker');
</script>
</body>
