<!doctype html>
<html>
  <head>
    <title>requestAnimationFrame in queue get the same timestamp</title>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <link rel="help" href="http://w3c.github.io/animation-timing/#dfn-invoke-callbacks-algorithm"/>
  </head>
  <body>
    <div id="log"></div>
    <script>
      async_test(function (t) {
        requestAnimationFrame(t.step_func(function (outerTimestamp) {
          assert_greater_than_equal(outerTimestamp, 0);
          let a, b;

          /* REASONING:
          * These two methods will be called with a timestamp. Because
          * they execute right after each other, they're added to the same
          * queue and SHOULD be timestamped with the same value.
          */
          requestAnimationFrame(t.step_func(function (timestamp) {
            a = timestamp;
          }));
          requestAnimationFrame(t.step_func(function (timestamp) {
            b = timestamp;
            assert_greater_than(a, outerTimestamp);
            assert_equals(a, b);
            t.done();
          }));
        }));
      }, "requestAnimationFrame will timestamp events in the same queue with the same time");
    </script>
  </body>
</html>
