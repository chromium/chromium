<!DOCTYPE html>
<meta charset="utf-8">
<title>Declarative Fragment: nested sanitization combinations with template src</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
function waitForElement(container, selector) {
  return new Promise(resolve => {
    const existing = container.querySelector(selector);
    if (existing) {
      resolve(existing);
      return;
    }
    const observer = new MutationObserver(() => {
      const found = container.querySelector(selector);
      if (found) {
        observer.disconnect();
        resolve(found);
      }
    });
    observer.observe(container, { childList: true, subtree: true });
  });
}

promise_test(async () => {
  const container = document.createElement('div');
  document.body.appendChild(container);

  const chunk = encodeURIComponent('<script>window.nestedSetHTMLScript = true;<\/script><span class="loaded">Loaded</span>');
  const bespoke = new Sanitizer({
    elements: ['div', 'span', 'template'],
    attributes: ['for', 'src', 'sanitize', 'class'],
    processingInstructions: ['start', 'end', 'marker']
  });

  const writer = container.streamHTML({ sanitizer: bespoke }).getWriter();
  await writer.write(`
    <div class="target"><?start name="m1">Original<?end></div>
    <template for="m1" sanitize="unsafe" src="../resources/chunked-html.py?delay=0&chunk1=${chunk}"></template>
  `);
  await writer.close();

  const target = container.querySelector('.target');
  const span = await waitForElement(target, '.loaded');
  assert_equals(span.textContent, 'Loaded');
  assert_false(!!window.nestedSetHTMLScript, "sanitize=\"unsafe\" inside streamHTML must not relax the enclosing safe sanitizer");
  assert_equals(target.querySelector('script'), null);
}, "template src with sanitize=\"unsafe\" inside streamHTML inherits the safe sanitizer");

promise_test(async () => {
  const container = document.createElement('div');
  document.body.appendChild(container);

  const chunk = encodeURIComponent('<div>Disallowed Div</div><span class="allowed">Allowed Span</span><script>window.bespokeScript = true;<\/script>');
  const bespoke = new Sanitizer({
    elements: ['span', 'template', 'script'],
    attributes: ['for', 'src', 'class'],
    processingInstructions: ['start', 'end', 'marker']
  });

  const writer = container.streamHTMLUnsafe({ sanitizer: bespoke }).getWriter();
  await writer.write(`
    <span class="target"><?start name="m2">Original<?end></span>
    <template for="m2" src="../resources/chunked-html.py?delay=0&chunk1=${chunk}"></template>
  `);
  await writer.close();

  const target = container.querySelector('.target');
  const span = await waitForElement(target, '.allowed');
  assert_equals(span.textContent, 'Allowed Span');
  assert_equals(target.querySelector('div'), null, "Div disallowed by enclosing sanitizer must be stripped");
  assert_equals(target.querySelector('script'), null, "Script must be stripped by default removeUnsafe() on template src");
  assert_false(!!window.bespokeScript);
}, "Default template src inside streamHTMLUnsafe with bespoke sanitizer clones sanitizer and calls removeUnsafe()");

promise_test(async () => {
  const container = document.createElement('div');
  document.body.appendChild(container);

  const innerChunk = encodeURIComponent('<script>window.innerUnsafeScript = true;<\/script><span id="inner-ok">Inner OK</span>');
  const outerChunk = encodeURIComponent(
    `<div id="inner-target"><?start name="inner-m">Inner Original<?end></div>` +
    `<template for="inner-m" sanitize="unsafe" src="../resources/chunked-html.py?delay=0&chunk1=${innerChunk}"></template>`
  );

  container.innerHTML = `<div id="outer-target"><?start name="outer-m">Outer Original<?end></div>`;
  const writer = document.body.streamAppendHTMLUnsafe().getWriter();
  await writer.write(`<template for="outer-m" src="../resources/chunked-html.py?delay=0&chunk1=${outerChunk}"></template>`);
  await writer.close();

  const outerTarget = container.querySelector('#outer-target');
  const innerSpan = await waitForElement(outerTarget, '#inner-ok');
  assert_equals(innerSpan.textContent, 'Inner OK');
  assert_false(!!window.innerUnsafeScript, "Nested sanitize=\"unsafe\" inside a default-safe outer template src must remain sanitized");
  assert_equals(outerTarget.querySelector('script'), null);
}, "Nested template src with sanitize=\"unsafe\" inside a safe outer template src remains sanitized");
</script>
</body>
