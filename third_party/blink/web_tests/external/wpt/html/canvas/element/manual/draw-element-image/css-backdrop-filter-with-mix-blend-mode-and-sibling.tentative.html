<!DOCTYPE html>
<title>drawElementImage preserves sibling content after CSS backdrop-filter with mix-blend-mode</title>
<link rel="help" href="https://github.com/WICG/html-in-canvas">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>

<canvas id="canvas" width="100" height="100" content="drawable">
  <div drawable id="target" style="width: 100px; height: 100px;">
    <div style="height: 50px; backdrop-filter: invert(1); mix-blend-mode: multiply; opacity: 0.5;"></div>
    <div style="position: relative; height: 50px; background: rgb(0, 255, 0);"></div>
  </div>
</canvas>

<script>
promise_test(async () => {
  await waitForCanvasPaint(canvas);
  const ctx = canvas.getContext("2d");
  ctx.drawElementImage(target, 0, 0);
  assert_array_equals(ctx.getImageData(50, 75, 1, 1).data, [0, 255, 0, 255]);
});
</script>
