- name: 2d.color.space.getImageData.convert
  desc: Test getImageData color conversions from a {{ canvas_cs }} canvas
  attributes: '{colorSpace: "{{ canvas_cs }}"}'
  variants_layout: [single_file]
  code: |
    const color_style_1 = '{{ color_style_1 }}';
    const color_style_2 = '{{ color_style_2 }}';
    const color_spaces = ['srgb', 'srgb-linear', 'display-p3', 'display-p3-linear'];
    const expected_pixels_1 = {{ expected_pixels_1 }};
    const expected_pixels_2 = {{ expected_pixels_2 }};
    const epsilon = 2;

    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = color_style_1;
    ctx.fillRect(1, 0, 1, 1);
    ctx.fillStyle = color_style_2;
    ctx.fillRect(0, 1, 1, 1);
    ctx.fillStyle = 'white';
    ctx.fillRect(1, 1, 1, 1);

    for (const img_cs of color_spaces) {
      const image_data = ctx.getImageData(0, 0, 2, 2, {colorSpace: img_cs});
      @assert image_data.colorSpace === img_cs;
      const pixels = image_data.data;
      const expected = [
        [0, 0, 0, 255],
        expected_pixels_1[img_cs],
        expected_pixels_2[img_cs],
        [255, 255, 255, 255]
      ];
      for (let i = 0; i < 4; ++i) {
        for (let c = 0; c < 4; ++c) {
          assert_approx_equals(pixels[4 * i + c], expected[i][c], epsilon,
              `Pixel ${i} component ${c} mismatch for img: ${img_cs}`);
        }
      }
    }

  variants: &color-space-convert-variants
    - srgb:
        canvas_cs: "srgb"
        color_style_1: &srgb-color-1 "color(srgb 0 1 1)"
        color_style_2: &srgb-color-2 "color(srgb 0.8 0.2 0.8)"
        expected_pixels_1: &srgb-expected-1 {
          'srgb': [0, 255, 255, 255],
          'srgb-linear': [0, 255, 255, 255],
          'display-p3': [117, 251, 253, 255],
          'display-p3-linear': [45, 247, 251, 255]
        }
        expected_pixels_2: &srgb-expected-2 {
          'srgb': [204, 51, 204, 255],
          'srgb-linear': [154, 8, 154, 255],
          'display-p3': [188, 64, 198, 255],
          'display-p3-linear': [128, 13, 143, 255]
        }
      srgb-linear:
        canvas_cs: "srgb-linear"
        color_style_1: *srgb-color-1
        color_style_2: *srgb-color-2
        expected_pixels_1: *srgb-expected-1
        expected_pixels_2: *srgb-expected-2
      display-p3:
        canvas_cs: "display-p3"
        color_style_1: &p3-color-1 "color(display-p3 1 0 0)"
        color_style_2: &p3-color-2 "color(display-p3 0.2 0.8 0.2)"
        expected_pixels_1: &p3-expected-1 {
          'srgb': [255, 0, 0, 255],
          'srgb-linear': [255, 0, 0, 255],
          'display-p3': [255, 0, 0, 255],
          'display-p3-linear': [255, 0, 0, 255]
        }
        expected_pixels_2: &p3-expected-2 {
          'srgb': [0, 208, 0, 255],
          'srgb-linear': [0, 160, 0, 255],
          'display-p3': [51, 204, 51, 255],
          'display-p3-linear': [8, 154, 8, 255]
        }
      display-p3-linear:
        canvas_cs: "display-p3-linear"
        color_style_1: *p3-color-1
        color_style_2: *p3-color-2
        expected_pixels_1: *p3-expected-1
        expected_pixels_2: *p3-expected-2

- name: 2d.color.space.toBlob.convert
  desc: Test toBlob color space preservation and conversion from a {{ canvas_cs }} canvas
  attributes: '{colorSpace: "{{ canvas_cs }}"}'
  canvas_types: ['HtmlCanvas']
  test_type: promise
  variants_layout: [single_file]
  code: |
    const color_style_1 = '{{ color_style_1 }}';
    const color_style_2 = '{{ color_style_2 }}';
    const color_spaces = ['srgb', 'srgb-linear', 'display-p3', 'display-p3-linear'];
    const expected_pixels_1 = {{ expected_pixels_1 }};
    const expected_pixels_2 = {{ expected_pixels_2 }};
    const epsilon = 2;

    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = color_style_1;
    ctx.fillRect(1, 0, 1, 1);
    ctx.fillStyle = color_style_2;
    ctx.fillRect(0, 1, 1, 1);
    ctx.fillStyle = 'white';
    ctx.fillRect(1, 1, 1, 1);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1));
    const img = await createImageBitmap(blob);

    for (const dst_cs of color_spaces) {
      const dst_canvas = document.createElement('canvas');
      dst_canvas.width = 2;
      dst_canvas.height = 2;
      const dst_ctx = dst_canvas.getContext('2d', {colorSpace: dst_cs});
      dst_ctx.drawImage(img, 0, 0);

      const image_data = dst_ctx.getImageData(0, 0, 2, 2, {colorSpace: dst_cs});
      @assert image_data.colorSpace === dst_cs;
      const pixels = image_data.data;
      const expected = [
        [0, 0, 0, 255],
        expected_pixels_1[dst_cs],
        expected_pixels_2[dst_cs],
        [255, 255, 255, 255]
      ];
      for (let i = 0; i < 4; ++i) {
        for (let c = 0; c < 4; ++c) {
          assert_approx_equals(pixels[4 * i + c], expected[i][c], epsilon,
              `Pixel ${i} component ${c} mismatch for dst: ${dst_cs}`);
        }
      }
    }

  variants: *color-space-convert-variants

- name: 2d.color.space.p3.toDataURL.p3.canvas
  desc: test if toDataURL returns p3 data from canvas with p3 color space
  attributes: '{colorSpace: "display-p3"}'
  canvas_types: ['HtmlCanvas']
  code: |
    ctx.fillStyle = "rgba(155, 27, 27, 1)";
    ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = "rgba(27, 155, 27, 0)";
    ctx.fillRect(1, 0, 1, 1);
    ctx.fillStyle = "rgba(27, 27, 155, 0.5)";
    ctx.fillRect(0, 1, 1, 1);
    ctx.fillStyle = "rgba(27, 27, 27, 0.5)";
    ctx.fillRect(1, 1, 1, 1);
    expectedPixels = ctx.getImageData(0, 0, 2, 2, {colorSpace: "display-p3"}).data;

    var image = new Image();
    image.onload = t.step_func_done(function() {
        var dstCanvas = document.createElement("canvas");
        dstCanvas.width = 2;
        dstCanvas.height = 2;
        var ctx = dstCanvas.getContext('2d', {colorSpace: "display-p3"});
        ctx.drawImage(image, 0, 0);
        var actualPixels = ctx.getImageData(0, 0, 2, 2, {colorSpace: "display-p3"}).data;
        assert_array_approx_equals(actualPixels, expectedPixels, 2);
    });
    image.src = canvas.toDataURL();

