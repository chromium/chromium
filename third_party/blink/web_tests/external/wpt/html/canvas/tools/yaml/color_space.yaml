            ctx.fillText("A", 50, 0);

            let pixels = ctx.getImageData(0, 0, canvas.width, canvas.height, { colorSpace: "display-p3" }).data;
            let pixelAt = function(x, y) {
                let offset = (y * canvas.width + x) * 4;
