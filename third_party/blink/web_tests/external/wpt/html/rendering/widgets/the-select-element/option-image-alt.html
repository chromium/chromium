<!doctype html>
<meta charset="utf-8" />
<title>
  OPTION in SELECT - image alternative text is included when rendering the
  label
</title>
<link rel="author" href="mailto:wpt@keithcirkel.co.uk" />
<link
  rel="help"
  href="https://html.spec.whatwg.org/multipage/rendering.html#the-select-element-2"
/>
<link
  rel="help"
  href="https://html.spec.whatwg.org/multipage/form-elements.html#get-html-aware-text-content"
/>
<link rel="match" href="option-image-alt-ref.html" />
<meta
  name="assert"
  content="The alt attribute of an img element in an option contributes to the option's rendered label, and the img element's descendants do not."
/>

<body>
  <script>
    const option = document.createElement("option");
    const image = document.createElement("img");
    image.alt = "a much longer image description";
    image.append("image text");
    option.append("FR", image);
    document.body
      .appendChild(document.createElement("select"))
      .appendChild(option);
  </script>
</body>
