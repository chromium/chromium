<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Container Timing: untrusted events do not stop recording</title>
<body>
<style>
body {
  margin: 0;
}
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/container-timing/resources/container-timing-helpers.js"></script>
<div id="root" containertiming="div_ct">
  <img src="/container-timing/resources/square100.png">
</div>
<script>
  promise_test(async t => {
    assert_implements(window.PerformanceContainerTiming, "PerformanceContainerTiming is not implemented");
    const entries = await getContainerEntries(t);
    assert_equals(entries.length, 1, 'entries before events');

    window.dispatchEvent(new Event('scroll'));
    document.body.dispatchEvent(new KeyboardEvent('keydown'));
    document.body.dispatchEvent(new PointerEvent('pointerdown'));
    document.body.dispatchEvent(new MouseEvent('mousedown'));
    document.body.dispatchEvent(new MouseEvent('click'));

    addSquare100Image(document.getElementById('root'));
    const allEntries = await getContainerEntries(t, 2);

    assert_equals(allEntries.length, 2, 'entries after events');
  }, 'Container timing keeps recording after untrusted input and scroll events.');
</script>
</body>
