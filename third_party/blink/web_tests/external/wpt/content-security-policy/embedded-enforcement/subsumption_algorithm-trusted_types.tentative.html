<!DOCTYPE html>
<html>
<head>
<title>Embedded Enforcement: Subsumption Algorithm - Trusted Types directives.</title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="support/testharness-helper.sub.js"></script>
</head>
<body>
  <script>
    // Note that the returned csp should always allow execution of an
    // inline script with nonce "abc" (as returned by
    // support/echo-policy-multiple.py), otherwise the test might
    // return false negatives. Test cases below therefore only add a
    // script-src restriction when it is nonce-abc-compatible.
    var tests = [
      // 'require-trusted-types-for' is absent from the required csp: it
      // imposes no restriction, whatever the returned csp does.
      { "name": "require-trusted-types-for absent in required is not checked.",
        "required_csp": "img-src 'none'",
        "returned_csp_1": "img-src 'none'; require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      // 'require-trusted-types-for' is present in required but absent from
      // returned. A required csp with only Trusted Types directives must not
      // be trivially subsumed.
      { "name": "require-trusted-types-for present in required, absent in returned.",
        "required_csp": "require-trusted-types-for 'script'",
        "returned_csp_1": "img-src 'none'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "require-trusted-types-for present in required and returned.",
        "required_csp": "require-trusted-types-for 'script'",
        "returned_csp_1": "require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "require-trusted-types-for satisfied by only one of several returned policies.",
        "required_csp": "require-trusted-types-for 'script'",
        "returned_csp_1": "img-src 'none'",
        "returned_csp_2": "require-trusted-types-for 'script'",
        "expected": IframeLoad.EXPECT_LOAD },
      // 'trusted-types' is absent from the required csp: it imposes no
      // restriction, whatever the returned csp does.
      { "name": "trusted-types absent in required is not checked.",
        "required_csp": "img-src 'none'",
        "returned_csp_1": "img-src 'none'; trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      // The conservative MVP uses normalized exact equality for
      // 'trusted-types'; policy names are a set (order independent).
      { "name": "trusted-types exact match with policy names in different order.",
        "required_csp": "trusted-types foo bar",
        "returned_csp_1": "trusted-types bar foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types ignores duplicate policy names.",
        "required_csp": "trusted-types foo foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      // The conservative MVP intentionally rejects a stricter returned subset
      // (see crbug.com/40912894).
      { "name": "trusted-types stricter returned subset is not an exact match.",
        "required_csp": "trusted-types foo bar",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types looser returned superset is not an exact match.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo bar",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types policy names are case-sensitive.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types Foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      // '*' must match on both sides.
      { "name": "trusted-types '*' matches '*'.",
        "required_csp": "trusted-types *",
        "returned_csp_1": "trusted-types *",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types '*' required but returned has an explicit list only.",
        "required_csp": "trusted-types *",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types explicit list required but returned has '*'.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types *",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      // 'none' (empty list) must match 'none'.
      { "name": "trusted-types 'none' matches 'none'.",
        "required_csp": "trusted-types 'none'",
        "returned_csp_1": "trusted-types 'none'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types empty list matches 'none'.",
        "required_csp": "trusted-types",
        "returned_csp_1": "trusted-types 'none'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      // Duplicate permission must match for a non-empty policy-name domain.
      { "name": "trusted-types 'allow-duplicates' present on both sides.",
        "required_csp": "trusted-types foo 'allow-duplicates'",
        "returned_csp_1": "trusted-types foo 'allow-duplicates'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types 'allow-duplicates' required but missing in returned.",
        "required_csp": "trusted-types foo 'allow-duplicates'",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types 'allow-duplicates' absent in required but present in returned.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo 'allow-duplicates'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types duplicate permission is ignored for an empty policy-name domain.",
        "required_csp": "trusted-types 'allow-duplicates'",
        "returned_csp_1": "trusted-types 'none'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      // Multiple returned policies are intersected, mirroring source-list
      // combination semantics.
      { "name": "trusted-types intersection of several returned policies matches required.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo bar",
        "returned_csp_2": "trusted-types foo",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersection of several returned policies differs from required.",
        "required_csp": "trusted-types foo bar",
        "returned_csp_1": "trusted-types foo bar",
        "returned_csp_2": "trusted-types foo",
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types absent from one returned policy does not affect intersection.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": "img-src 'none'",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types absent from one returned policy does not affect intersection (other ordering).",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "img-src 'none'",
        "returned_csp_2": "trusted-types foo",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersection of '*' and an explicit list matches required.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types *",
        "returned_csp_2": "trusted-types foo",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersection of '*' and an explicit list matches required (other ordering).",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": "trusted-types *",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersected duplicate permission requires all returned policies to allow duplicates.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo 'allow-duplicates'",
        "returned_csp_2": "trusted-types foo",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersected duplicate permission requires all returned policies to allow duplicates (other ordering).",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": "trusted-types foo 'allow-duplicates'",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersected duplicate permission is true when all returned policies allow duplicates.",
        "required_csp": "trusted-types foo 'allow-duplicates'",
        "returned_csp_1": "trusted-types foo bar 'allow-duplicates'",
        "returned_csp_2": "trusted-types foo baz 'allow-duplicates'",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersection includes the third returned policy.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "trusted-types foo bar baz",
        "returned_csp_2": "trusted-types foo bar qux",
        "returned_csp_3": "trusted-types foo baz qux",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "trusted-types intersected duplicate permission is false for an empty policy-name domain.",
        "required_csp": "trusted-types 'none'",
        "returned_csp_1": "trusted-types foo 'allow-duplicates'",
        "returned_csp_2": "trusted-types bar 'allow-duplicates'",
        "expected": IframeLoad.EXPECT_LOAD },
      // 'trusted-types' present in required but absent from every returned
      // policy: no exact match.
      { "name": "trusted-types present in required, absent from all returned policies.",
        "required_csp": "trusted-types foo",
        "returned_csp_1": "img-src 'none'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "trusted-types 'none' required but trusted-types is absent from returned.",
        "required_csp": "trusted-types 'none'",
        "returned_csp_1": "img-src 'none'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      // Both Trusted Types directives must be satisfied.
      { "name": "Combined require-trusted-types-for and trusted-types both match.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "Combined requirement: trusted-types is missing even though require-trusted-types-for matches.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "Combined requirement: require-trusted-types-for is missing even though trusted-types matches.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "Combined Trusted Types requirement is satisfied by separate returned policies.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "require-trusted-types-for 'script'",
        "returned_csp_2": "trusted-types foo",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "Combined Trusted Types requirement is satisfied by separate returned policies (other ordering).",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": "require-trusted-types-for 'script'",
        "expected": IframeLoad.EXPECT_LOAD },
      // Report-only policies do not participate in subsumption.
      { "name": "Combined Trusted Types requirement is not satisfied by a report-only policy.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": null,
        "returned_csp_2": null,
        "returned_csp_report_only": "require-trusted-types-for 'script'; trusted-types foo",
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "Combined requirement: report-only require-trusted-types-for does not fill a missing enforced directive.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "trusted-types foo",
        "returned_csp_2": null,
        "returned_csp_report_only": "require-trusted-types-for 'script'",
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "Combined requirement: report-only trusted-types does not fill a missing enforced directive.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "returned_csp_report_only": "trusted-types foo",
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "require-trusted-types-for matching enforced policy is not affected by report-only trusted-types.",
        "required_csp": "require-trusted-types-for 'script'",
        "returned_csp_1": "require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "returned_csp_report_only": "trusted-types 'none'",
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "Combined Trusted Types requirement is not affected by stricter report-only trusted-types.",
        "required_csp": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_1": "require-trusted-types-for 'script'; trusted-types foo",
        "returned_csp_2": null,
        "returned_csp_report_only": "trusted-types 'none'",
        "expected": IframeLoad.EXPECT_LOAD },
      // Combined source-list and Trusted Types requirements: both must hold.
      { "name": "Combined script-src and require-trusted-types-for both match.",
        "required_csp": "script-src 'nonce-abc'; require-trusted-types-for 'script'",
        "returned_csp_1": "script-src 'nonce-abc'; require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_LOAD },
      { "name": "Combined requirement: script-src mismatches even though require-trusted-types-for matches.",
        "required_csp": "script-src 'nonce-abc'; require-trusted-types-for 'script'",
        "returned_csp_1": "script-src * 'nonce-abc'; require-trusted-types-for 'script'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "Combined requirement: require-trusted-types-for mismatches even though script-src matches.",
        "required_csp": "script-src 'nonce-abc'; require-trusted-types-for 'script'",
        "returned_csp_1": "script-src 'nonce-abc'",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
      { "name": "Combined requirement: trusted-types mismatches even though script-src matches.",
        "required_csp": "script-src 'nonce-abc'; trusted-types foo",
        "returned_csp_1": "script-src 'nonce-abc'; trusted-types foo bar",
        "returned_csp_2": null,
        "expected": IframeLoad.EXPECT_BLOCK },
    ];

    tests.forEach(test => {
      async_test(t =>  {
        let url = generateUrlWithPolicies(Host.CROSS_ORIGIN, test.returned_csp_1);
        if (test.returned_csp_2)
          url.searchParams.append("policy2", test.returned_csp_2);
        if (test.returned_csp_3)
          url.searchParams.append("policy3", test.returned_csp_3);
        if (test.returned_csp_report_only)
          url.searchParams.append("pipe", `header(Content-Security-Policy-Report-Only,${test.returned_csp_report_only})`);
        assert_iframe_with_csp(t, url, test.required_csp, test.expected, test.name, null);
      }, test.name);
    });
  </script>
</body>
</html>
