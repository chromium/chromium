<!DOCTYPE html>
<html>
  <head>
    <title>
      Test MediaStreamAudioSourceNode with renderSizeHint
    </title>
    <script src="../../resources/testharness.js"></script>
    <script src="../../resources/testharnessreport.js"></script>
    <script src="../resources/rendersizehint-probe.js"></script>
  </head>
  <body>
    <script>
      const processorPath = '../resources/rendersizehint-processor.js';

      const TEST_CASES = [
        {hint: 256, label: 'power-of-two (256)'},
        {hint: 480, label: '10ms @ 48kHz (480)'},
        {hint: 441, label: '10ms @ 44.1kHz (441)'},
        {hint: 500, label: 'non-power-of-two (500)'}
      ];

      let mediaStream = null;

      promise_setup(async () => {
        mediaStream =
            await navigator.mediaDevices.getUserMedia({audio: true});
      });

      for (const {hint, label} of TEST_CASES) {
        // Verify MediaStreamAudioSourceNode with custom renderSizeHint.
        // This ensures that WebAudioMediaStreamAudioSink correctly accommodates
        // custom render quantum sizes when pulling data from a live stream,
        // preventing hardcoded buffer size mismatches (Bug 502311300).
        promise_test(async (t) => {
          const context = new AudioContext({renderSizeHint: hint});
          t.add_cleanup(() => context.close());

          const source =
              new MediaStreamAudioSourceNode(context, {mediaStream});
          const result =
              await probeRenderSizeHint(context, source, processorPath);

          assert_equals(
              result.probedRenderQuantumSize,
              hint,
              'Render quantum size in GlobalScope should match hint');

          assert_equals(
              result.processBlockSize,
              hint,
              'Process block size should match negotiated size');
        }, `MediaStreamAudioSourceNode block size matches custom ` +
           `renderSizeHint: ${label}`);
      }

      promise_test(async (t) => {
        // 1,000,000 is within [1, 6 * 384000 = 2304000] so AudioContext
        // creation succeeds, but exceeds media::limits::kMaxSamplesPerPacket
        // (768000).
        const context = new AudioContext({
          sampleRate: 384000,
          renderSizeHint: 1000000,
        });
        t.add_cleanup(() => context.close());

        assert_throws_dom('NotSupportedError', () => {
          new MediaStreamAudioSourceNode(context, {mediaStream});
        }, 'new MediaStreamAudioSourceNode should throw NotSupportedError');

        assert_throws_dom('NotSupportedError', () => {
          context.createMediaStreamSource(mediaStream);
        }, 'createMediaStreamSource should throw NotSupportedError');
      }, 'MediaStreamAudioSourceNode throws NotSupportedError when quantum ' +
         'exceeds kMaxSamplesPerPacket');
    </script>
  </body>
</html>
