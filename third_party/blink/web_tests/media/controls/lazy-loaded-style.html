<!DOCTYPE html>
<html>
<script src="../media-controls.js"></script>
<title>Test that media controls are styled correctly if lazy loaded.</title>
<video width="400"></video>
<script>
  var video = document.querySelector('video');
  enableTestMode(video);

  if (window.testRunner)
    testRunner.waitUntilDone();

  // The reference paints the video's first frame, so the test must not end
  // before that frame reaches the compositor. The callback only fires for
  // frames that arrive after it is registered, so register it before src.
  const firstFrame =
      new Promise(resolve => video.requestVideoFrameCallback(resolve));

  video.addEventListener('loadeddata', async () => {
    video.controls = true;

    await firstFrame;
    if (window.testRunner)
      testRunner.notifyDone();
  }, { once: true });

  video.src = "../content/test.ogv";
  video.load();
</script>
</html>
