<!DOCTYPE html>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<title>Test that data: URLs fail registerProtocolHandler checks</title>
<body>
<iframe id='frame'></iframe>

<script>
setup({single_test: true});

// The data: URL iframe below is a secure context (its parent is one), so
// registerProtocolHandler() is exposed. Registration must still fail, since
// the handler URL's scheme is not HTTP(S).
// https://html.spec.whatwg.org/multipage/system-state.html#normalize-protocol-handler-parameters
const frameSrc =
`<html>
<head>
<script>
try {
  navigator.registerProtocolHandler('web+test',
                                    location.href + '?%s',
                                    'Test handler');
  window.parent.postMessage('rph succeeded', '*');
} catch (e) {
  window.parent.postMessage('rph failed: ' + e.name, '*');
}
<\/script>
<\/head>
<body>
Test page
<\/body>
<\/html>
`

window.addEventListener('message', (msg) => {
  assert_equals(msg.data, 'rph failed: SecurityError');
  done();
});

document.getElementById('frame').src = 'data:text/html,' + frameSrc;
</script>
</body>
