<!DOCTYPE HTML>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<!--
Covers aria-owns relations set via ariaOwnsElements (on the element and on
ElementInternals) in and across shadow roots. An owner can only own elements
from its own TreeScope, which matches how aria-owns IDs are resolved. See
crbug.com/406816521.
-->

<div class="container">
  <div id="host1"></div>
  <p id="light1">Light DOM paragraph</p>
</div>

<script>
test(function(t) {
  const host = document.getElementById("host1");
  const shadow = host.attachShadow({mode: "open"});
  shadow.innerHTML = '<div id="inner_owner1" role="group"></div>' +
                     '<button id="inner_target1">Inner</button>';
  const owner = shadow.getElementById("inner_owner1");
  const target = shadow.getElementById("inner_target1");
  const axOwner = accessibilityController.accessibleElementById("inner_owner1");
  const axTarget = accessibilityController.accessibleElementById("inner_target1");
  assert_equals(axOwner.childrenCount, 0, "before setting ariaOwnsElements");

  owner.ariaOwnsElements = [target];
  assert_array_equals(owner.ariaOwnsElements, [target]);
  assert_equals(axOwner.childrenCount, 1, "same-scope reference is owned");
  assert_true(axOwner.childAtIndex(0).isEqual(axTarget));

  owner.ariaOwnsElements = null;
  assert_equals(axOwner.childrenCount, 0, "after clearing ariaOwnsElements");
  assert_false(accessibilityController.accessibleElementById("inner_target1")
                   .parentElement().isEqual(axOwner),
               "the natural parent is restored");
}, "ariaOwnsElements within a shadow root is reflected in the AXTree.");

test(function(t) {
  const host = document.getElementById("host1");
  const owner = host.shadowRoot.getElementById("inner_owner1");
  const light = document.getElementById("light1");
  const axOwner = accessibilityController.accessibleElementById("inner_owner1");
  const axLight = accessibilityController.accessibleElementById("light1");
  const axLightParent = axLight.parentElement();

  owner.ariaOwnsElements = [light];
  assert_array_equals(owner.ariaOwnsElements, [light],
                      "the DOM reflects the reference");
  assert_equals(owner.getAttribute("aria-owns"), "");
  assert_equals(axOwner.childrenCount, 0,
                "an owner in a shadow root cannot own light DOM content");
  assert_true(axLight.parentElement().isEqual(axLightParent),
              "the referenced element keeps its natural parent");
  owner.ariaOwnsElements = null;
}, "ariaOwnsElements from a shadow root into the light DOM is not honored.");

test(function(t) {
  const host = document.getElementById("host1");
  const target = host.shadowRoot.getElementById("inner_target1");
  const owner = document.getElementById("light1");
  const axOwner = accessibilityController.accessibleElementById("light1");
  const childrenCount = axOwner.childrenCount;

  owner.ariaOwnsElements = [target];
  assert_array_equals(owner.ariaOwnsElements, [],
                      "the DOM does not reflect references into a shadow root");
  assert_equals(axOwner.childrenCount, childrenCount,
                "light DOM owner cannot own shadow DOM content");
  owner.ariaOwnsElements = null;
}, "ariaOwnsElements from the light DOM into a shadow root is not honored.");
</script>

<div class="container">
  <x-owner id="internals_host" role="group"></x-owner>
  <button id="internals_target1">Target 1</button>
  <button id="internals_target2">Target 2</button>
</div>

<script>
class XOwner extends HTMLElement {
  constructor() {
    super();
    this.i = this.attachInternals();
  }
}
customElements.define("x-owner", XOwner);

test(function(t) {
  const host = document.getElementById("internals_host");
  const target1 = document.getElementById("internals_target1");
  const target2 = document.getElementById("internals_target2");
  const axHost = accessibilityController.accessibleElementById("internals_host");
  const axTarget1 = accessibilityController.accessibleElementById("internals_target1");
  const axTarget2 = accessibilityController.accessibleElementById("internals_target2");
  assert_equals(axHost.childrenCount, 0, "before setting ariaOwnsElements");

  host.i.ariaOwnsElements = [target2, target1];
  assert_array_equals(host.i.ariaOwnsElements, [target2, target1]);
  assert_equals(axHost.childrenCount, 2, "owned via ElementInternals");
  assert_true(axHost.childAtIndex(0).isEqual(axTarget2), "order is preserved");
  assert_true(axHost.childAtIndex(1).isEqual(axTarget1), "order is preserved");

  // Duplicate references are only owned once.
  host.i.ariaOwnsElements = [target1, target1];
  assert_equals(axHost.childrenCount, 1, "duplicates are collapsed");
  assert_true(axHost.childAtIndex(0).isEqual(axTarget1));
  assert_false(accessibilityController.accessibleElementById("internals_target2")
                   .parentElement().isEqual(axHost),
               "the no longer owned element is restored");

  host.i.ariaOwnsElements = null;
  assert_equals(axHost.childrenCount, 0, "after clearing via ElementInternals");
}, "ariaOwnsElements set via ElementInternals is reflected in the AXTree.");

test(function(t) {
  const host = document.getElementById("internals_host");
  const shadow = host.attachShadow({mode: "open"});
  shadow.innerHTML = '<button id="shadow_a">A</button>' +
                     '<button id="shadow_b">B</button>';
  const axHost = accessibilityController.accessibleElementById("internals_host");
  const axA = accessibilityController.accessibleElementById("shadow_a");
  const axB = accessibilityController.accessibleElementById("shadow_b");
  assert_equals(axHost.childrenCount, 2);
  assert_true(axHost.childAtIndex(0).isEqual(axA));
  assert_true(axHost.childAtIndex(1).isEqual(axB));

  // ElementInternals references are not scope-checked by the DOM, but the
  // accessibility tree rejects the cross-scope reference: A is not appended
  // as an owned child after B.
  host.i.ariaOwnsElements = [shadow.getElementById("shadow_a")];
  assert_equals(host.i.ariaOwnsElements.length, 1,
                "the DOM reflects the reference");
  assert_equals(axHost.childrenCount, 2);
  assert_true(axHost.childAtIndex(0).isEqual(axA), "A keeps its position");
  assert_true(axHost.childAtIndex(1).isEqual(axB));
  host.i.ariaOwnsElements = null;
}, "ariaOwnsElements via ElementInternals into the host's shadow root is not honored.");
</script>

<div class="container">
  <div id="move_owner" role="group"></div>
  <div id="move_original_parent">
    <button id="move_target">Moving target</button>
  </div>
  <div id="move_host"></div>
</div>

<script>
test(function(t) {
  const owner = document.getElementById("move_owner");
  const target = document.getElementById("move_target");
  const originalParent = document.getElementById("move_original_parent");
  const shadow = document.getElementById("move_host").attachShadow({mode: "open"});
  const axOwner = accessibilityController.accessibleElementById("move_owner");

  owner.ariaOwnsElements = [target];
  assert_equals(axOwner.childrenCount, 1, "owned while in the same scope");

  shadow.appendChild(target);
  assert_array_equals(owner.ariaOwnsElements, [],
                      "the DOM no longer reflects the reference");
  assert_equals(axOwner.childrenCount, 0,
                "no longer owned after moving into a shadow root");

  originalParent.appendChild(target);
  assert_array_equals(owner.ariaOwnsElements, [target],
                      "the DOM reflects the reference again");
  assert_equals(axOwner.childrenCount, 1,
                "owned again after moving back to the light DOM");
  const axTarget = accessibilityController.accessibleElementById("move_target");
  assert_true(axOwner.childAtIndex(0).isEqual(axTarget));
}, "An owned element moved into and out of a shadow root is released and re-owned.");
</script>

<div class="container">
  <div id="competing_id_owner" role="group" aria-owns="competing_target"></div>
  <div id="competing_ref_owner" role="group"></div>
  <button id="competing_target">Competing target</button>
</div>

<script>
test(function(t) {
  const idOwner = document.getElementById("competing_id_owner");
  const refOwner = document.getElementById("competing_ref_owner");
  const target = document.getElementById("competing_target");
  const axIdOwner = accessibilityController.accessibleElementById("competing_id_owner");
  const axRefOwner = accessibilityController.accessibleElementById("competing_ref_owner");
  assert_equals(axIdOwner.childrenCount, 1, "the ID owner owns the target");

  // The target cannot be taken over while the first relation is valid.
  refOwner.ariaOwnsElements = [target];
  assert_equals(axIdOwner.childrenCount, 1);
  assert_equals(axRefOwner.childrenCount, 0);

  // Once the first relation is removed, the element reference owner takes
  // over without being touched again.
  idOwner.removeAttribute("aria-owns");
  assert_equals(axIdOwner.childrenCount, 0);
  assert_equals(axRefOwner.childrenCount, 1,
                "the element reference owner is re-evaluated");
  const axTarget = accessibilityController.accessibleElementById("competing_target");
  assert_true(axRefOwner.childAtIndex(0).isEqual(axTarget));
}, "A competing ariaOwnsElements owner takes over when the first owner releases the element.");
</script>
