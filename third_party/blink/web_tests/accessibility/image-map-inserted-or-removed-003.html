<!DOCTYPE html>
<meta charset="utf-8">
<title>Inserting an earlier map with the same name moves the image to it</title>
<link rel="help" href="https://crbug.com/500774800">
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>

<img id="img" usemap="#map">
<map name="map">
  <area id="area" href="#" alt="Old area">
</map>

<script>
test(() => {
  accessibilityController.rootElement;
  assert_equals(accessibilityController.accessibleElementById('img').childrenCount, 1);

  area.alt = 'Updated';
  const earlierMap = document.createElement('map');
  earlierMap.name = 'map';
  earlierMap.innerHTML = '<area href="#" alt="New area">';
  document.body.insertBefore(earlierMap, img);

  const axImg = accessibilityController.accessibleElementById('img');
  assert_equals(axImg.childrenCount, 1);
  assert_equals(axImg.childAtIndex(0).name, 'New area');
}, 'Inserting an earlier map with the same name moves the image to it');
</script>
