<!DOCTYPE html>
<meta charset="utf-8">
<title>Reparenting an ancestor of an aria-owns owner preserves ancestor cycle detection</title>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>

<div id="outer" role="group" aria-disabled="true"></div>
<div id="grand" role="group" aria-owns="holder">
  <div id="wrapper">
    <div id="owner1" role="group" aria-owns="bridge"></div>
  </div>
</div>
<div id="holder">
  <div id="bridge">
    <div id="sub_owner" role="group" aria-owns="bridge grand"></div>
  </div>
</div>

<script>
test(() => {
  assert_own_property(window, 'accessibilityController',
                      'This test requires accessibilityController');
  accessibilityController.rootElement;
  outer.setAttribute('aria-owns', 'wrapper');
  const axOuter = accessibilityController.accessibleElementById('outer');
  assert_true(Boolean(axOuter));
}, 'Reparenting an ancestor of an aria-owns owner preserves ancestor cycle detection');
</script>
