<!DOCTYPE html>
<meta charset="utf-8">
<title>Hiding a customizable select option while replacing its element with text does not crash</title>
<link rel="help" href="https://crbug.com/500774799">
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>

<style>
select, select::picker(select) {
  appearance: base-select;
}
</style>

<select>
  <option id="opt"><span>Item</span></option>
</select>

<script>
test(() => {
  assert_own_property(window, 'accessibilityController',
                      'This test requires accessibilityController');

  // Builds the tree. Under base-select <option>'s child is its <slot>.
  accessibilityController.rootElement;

  // Queues an accessibility update for <option>.
  opt.className = 'dirty';

  // Queues an accessibility update for <slot>. This is the step under test.
  // With only text left <option> can't have children, so it must remove its
  // <slot> from the tree.
  opt.textContent = 'Changed';

  // Makes <slot>'s update look up its parent.
  opt.style.display = 'none';

  // Runs the queued updates. If <slot> wasn't removed, <option>'s update
  // leaves it without a parent and <slot>'s update crashes.
  const accessibleOpt = accessibilityController.accessibleElementById('opt');
  assert_true(!!accessibleOpt, 'The option should still be in the tree');
  assert_equals(accessibleOpt.role, 'AXRole: AXMenuListOption');
  assert_equals(accessibleOpt.childrenCount, 0,
                'The option should have no children');
}, 'Hiding a customizable select option while replacing its element with text does not crash');
</script>
