<!DOCTYPE html>
<div id="scroller" style="
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 1.5em;
    row-gap: 1em;
    column-rule: 4px solid red;
    row-rule: 4px solid blue;
    height: 210px;
    overflow: auto;
    scrollbar-width: none;
    width: 400px">
</div>
<script src="../../../resources/run-after-layout-and-paint.js"></script>
<script>
  let html = "";
  for (let i = 1; i <= 40; i++)
    html += "<div>" + i + ". Lorem ipsum dolor sit amet, consectetur adipiscing elit.</div>";
  document.getElementById("scroller").innerHTML = html;

  runAfterLayoutAndPaint(function() {
    document.getElementById("scroller").style.width = '600px';
  }, true);
</script>
