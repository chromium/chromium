<!DOCTYPE html>
<div id="scroller" style="
    column-width: 7em;
    column-height: 150px;
    column-wrap: wrap;
    column-fill: auto;
    column-gap: 1.5em;
    row-gap: 1em;
    column-rule: 4px solid red;
    height: 210px;
    overflow: auto;
    scrollbar-width: none;
    width: 400px">
</div>
<script src="../../../resources/run-after-layout-and-paint.js"></script>
<script>
  let html = "";
  for (let i = 1; i <= 60; i++)
    html += "<p style='margin:0'>" + i + ". Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>";
  document.getElementById("scroller").innerHTML = html;

  runAfterLayoutAndPaint(function() {
    document.getElementById("scroller").style.width = '600px';
  }, true);
</script>
