<!DOCTYPE html>
<html>
<head>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script>
        if (document.location.hostname == "127.0.0.1") {
            document.location.hostname = "subdomain.example.test";
        } else {
            async_test(function (t) {
                document.domain = 'example.test';

                try {
                    new Worker("resources/non-existent.js");
                } catch (e) {
                    assert_unreached("Same-origin worker shouldn't throw.");
                }

                try {
                    var worker = new Worker("http://example.test/worker.js");
                    worker.onmessage = t.unreached_func("Worker shouldn't load.");
                    worker.onerror = t.step_func_done();
                } catch (e) {
                    assert_unreached("Another domain's worker shouldn't throw.");
                }
            }, "Another domain's worker fails to load.");
        }
    </script>
</head>
<body>
</body>
</html>
