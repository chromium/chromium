<!DOCTYPE html>
<!--
  This test lives in http/tests/serviceworker/ rather than external/wpt/
  because WPT's test_driver does not support simulating a web notification
  click (testRunner.simulateWebNotificationClick), and because
  testharnessreport.js disables popup blocking by default
  (testRunner.setPopupBlockingEnabled(false)), requiring
  testRunner.setPopupBlockingEnabled(true) to test that popups are blocked
  after capability consumption or expiration.
-->
<title>Service Worker: Capability Delegation of Popups (using testRunner)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/test-helpers.js"></script>
<script>
if (window.testRunner) {
    testRunner.setPermission('notifications', 'granted', location.origin, location.origin);
    testRunner.setPopupBlockingEnabled(true);
}

var t = async_test('SW popup capability delegation behaved as expected');
t.step(function() {
    var scope = 'resources/blank.html'
    var w;
    service_worker_unregister_and_register(
        t, 'resources/clients-capability-delegation.js', scope)
      .then(function(registration) {
          return wait_for_state(t, registration.installing, 'activated');
        })
      .then(function() { return with_iframe(scope); })
      .then(function(frame) {
          w = frame.contentWindow;
          // Spawn a dedicated worker inside the controlled frame using a Blob URL so it inherits the controller.
          var blob = new Blob(['/* worker */'], {type: 'text/javascript'});
          w.worker = new w.Worker(URL.createObjectURL(blob));
          w.navigator.serviceWorker.onmessage = t.step_func(onMessage);
          w.navigator.serviceWorker.controller.postMessage('start');
        })
      .catch(unreached_rejection(t));

    var result = [];
    var expected = [
        'popup delegation result: success',
        'postMessage threw: NotAllowedError',
        'second postMessage threw: NotAllowedError',
        'unsupported capability postMessage threw: NotSupportedError',
        'popup delegation double open result: success',
        'popup delegation expired result: success',
        'focus and popup delegation result: success',
        'worker postMessage threw: NotSupportedError'
    ];

    function onMessage(e) {
      var message = e.data;

      if (typeof(message) === 'object') {
        if (message.type === 'click') {
          if (window.testRunner)
            testRunner.simulateWebNotificationClick(message.title);
          return;
        }

        if (message.type === 'delegate-popup') {
          if (message.test === 'double-open') {
            var popup_window1 = w.open('blank.html', '_blank');
            var success1 = popup_window1 !== null;
            if (popup_window1) popup_window1.close();

            var popup_window2 = w.open('blank.html', '_blank');
            var success2 = popup_window2 !== null;
            if (popup_window2) popup_window2.close();

            e.source.postMessage({
                type: 'popup-result',
                result: (success1 && !success2) ? 'success' : 'failure'
            });
            return;
          }

          if (message.test === 'expired') {
            setTimeout(() => {
              var popup_window = w.open('blank.html', '_blank');
              var success = popup_window !== null;
              if (popup_window) popup_window.close();
              e.source.postMessage({type: 'popup-result', result: !success ? 'success' : 'failure'});
            }, 1500);
            return;
          }

          // Default test (success case)
          var popup_window = w.open('blank.html', '_blank');
          var success = popup_window !== null;
          if (popup_window) {
              popup_window.close();
          }
          e.source.postMessage({type: 'popup-result', result: success ? 'success' : 'failure'});
          return;
        }
        return;
      }

      if (message === 'quit') {
        assert_array_equals(result, expected,
                            'Worker should post back expected messages.');
        service_worker_unregister_and_done(t, scope);
      } else {
        result.push(message);
      }
    }
  });
</script>
