<meta charset="utf-8">
<title>Full garbage collection in ShadowRealms</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  const collect = 'gc({ type: "major", execution: "sync", flavor: "last-resort" })';
  gc({ type: 'major', execution: 'sync', flavor: 'last-resort' });
  const realm = new ShadowRealm();
  realm.evaluate(collect);
  realm.evaluate('new ShadowRealm().evaluate(' + JSON.stringify(collect) + ')');
}, 'Full garbage collection in ordinary and nested ShadowRealms does not crash');
</script>
