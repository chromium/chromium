<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Digital Credentials Virtual Wallet Test Page</title>
</head>
<body>
  <script>
    async function getDigitalCredential(requestOptions, signal = null) {
      let error = null;
      let response = null;

      try {
        const options = {
          digital: {
            requests: [requestOptions],
          },
        };

        if (signal) {
          options.signal = signal;
        }

        const credentials = await navigator.credentials.get(options);
        response = credentials ? credentials.toJSON() : null;
      } catch (exception) {
        error = exception && exception.name ? exception.name : String(exception);
      }

      return {
        response,
        error
      };
    }
  </script>
</body>
</html>
