<!DOCTYPE html>
<html>
  <body>
    <h1>Scaled OOPIF containing a non-root opacity render surface.</h1>
    <div style="transform: scale(4); transform-origin: 0 0">
      <!-- Same-process iframe so the layout matches the OOPIF test exactly. -->
      <iframe style="border: none; width: 150px; height: 50px;"
              srcdoc="<!doctype html><body style='margin:0'><div style='opacity:0.99'><div style='will-change:transform'>This is some text</div><div style='will-change:transform'>This is some text</div></div>"></iframe>
    </div>
  </body>
</html>
