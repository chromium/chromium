<!DOCTYPE html>
<html>
  <!-- A non-root opacity render surface inside an OOPIF magnified by its
       embedder must be rasterized at the embedder's scale so that its text
       stays crisp. -->
  <body>
    <h1>Scaled OOPIF containing a non-root opacity render surface.</h1>
    <div style="transform: scale(4); transform-origin: 0 0">
      <!-- Loading the iframe from localhost, a cross-origin URL, makes it an
           OOPIF. -->
      <iframe src="http://localhost:8080/html/resources/opacity-surface-oopif-text.html"
              style="border: none; width: 150px; height: 50px;"></iframe>
    </div>
  </body>
  <script>
    if (window.testRunner) {
      testRunner.waitUntilDone();
    }
    onload = () => {
      if (window.testRunner) {
        // Wait for the OOPIF to paint before capturing.
        requestAnimationFrame(()=> {
          requestAnimationFrame(()=> {
            testRunner.notifyDone();
          });
        });
      }
    }
  </script>
</html>
