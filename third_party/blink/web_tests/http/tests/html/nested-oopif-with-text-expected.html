<!DOCTYPE html>
<head>
  <style>
  * {
      margin: 0;
    }
  </style>
</head>
<html>
  <body>
    <div style="transform: scale(1.8); transform-origin: 0 0;
                width: 200px; height: 80px;
                overflow: hidden; background-color: pink">
      <div style="height: 80px; width: 200px; opacity: 0.99;">
        <div style="border: none; height: 80px; width: 200px; overflow-y: scroll;
                    opacity: 0.99;
                    font-family: Arial; font-size: 13px">
          <div style="height: 3px"></div>
          This is some text that should stay crisp.<br>
          Line two of text inside the OOP iframe.<br>
          Line three so the iframe inner-scrolls.<br>
          Line four pushes content past the clip.<br>
          Line five extends the scrollable area.<br>
          Line six is below the visible region.<br>
          Line seven is the last line of text.<br>
        </div>
      </div>
    </div>
  </body>
</html>
