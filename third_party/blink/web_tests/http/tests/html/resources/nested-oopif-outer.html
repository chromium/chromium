<!DOCTYPE html>
<!-- Outer OOPIF document. Embeds a further nested OOPIF holding the text. -->
<head>
  <style>
  * {
      margin: 0;
    }
  html, body {
      background: transparent;
    }
  </style>
</head>
<body>
  <iframe src="http://127.0.0.1:8000/html/resources/oopif-scrolling-text.html"
          scrolling="yes"
          style="border: none; height: 80px; width: 200px; opacity: 0.99;
                 display: block;"></iframe>
</body>
