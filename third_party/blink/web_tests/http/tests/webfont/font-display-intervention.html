<!DOCTYPE html>
<title>Test for font-display @font-face descriptor with User-Agent Intervention</title>
<style>
.hidden { display: none; }
</style>
<link rel="preload" href="/resources/Ahem.ttf" as="font" crossorigin>
<p>Tests how text with a font that takes <i>delay</i> seconds to load look like after <i>T</i> seconds from load start.</p>
<table id="container">
 <tr>
  <th>T[sec]</th>
  <th>delay[sec]</th>
  <th>auto</th>
  <th>block</th>
  <th>swap</th>
  <th>fallback</th>
  <th>optional</th>
 </tr>
</table>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

// Slow network that allows effectively 3G cellular network speed will cause an
// User-Agent Intervention. Under the situation, 'auto' should behave as 'swap'.
if (window.internals) {
    internals.setNetworkConnectionInfoOverride(true, 'cellular3g', '3g', 2000, 0.1);

    // Reset the state of the singleton network state notifier.
    window.addEventListener('beforeunload', function() {
        internals.clearNetworkConnectionInfoOverride();
    }, false);
}

var fontDisplayValues = ['auto', 'block', 'swap', 'fallback', 'optional'];
var configs = [{time: 0, delay: 1000},
               {time: 1000, delay: 0},
               {time: 1000, delay: 500},
               {time: 1000, delay: 3000},
               {time: 5000, delay: 2000},
               {time: 5000, delay: 4000},
               {time: 5000, delay: 8000}];

function makeFontFaceDeclaration(family, config, display) {
    var url = '/resources/Ahem.ttf';
    // Include `&t=` so each (delay, time) row has a distinct URL and requests
    // are not coalesced across rows started at different times.
    if (config.delay > 0)
        url = 'resources/slow-ahem-loading.php?delay=' + config.delay + '&t=' + config.time;
    return '@font-face { font-family: ' + family + '; src: url(' + url + '); font-display: ' + display + '; }';
}


var maxTime = Math.max.apply(null, configs.map(function(config) { return config.time; }));
var table = document.getElementById('container');

window.onload = function() {
    var mustLoadFamilies = {};
    var zeroTimeRows = [];
    for (var config, i = 0; config = configs[i]; i++) {
        var tr = document.createElement('tr');
        tr.classList.add('hidden');
        var td1 = document.createElement('td');
        td1.textContent = config.time / 1000;
        tr.appendChild(td1);
        var td2 = document.createElement('td');
        td2.textContent = config.delay / 1000;
        tr.appendChild(td2);

        for (var display, j = 0; display = fontDisplayValues[j]; j++) {
            var family = [display, config.time, config.delay].join('-');
            if (config.delay < config.time &&
                !(display == 'optional' && config.delay > 0)) {
                mustLoadFamilies[family] = true;
            }
            var rule = makeFontFaceDeclaration(family, config, display);
            document.styleSheets[0].insertRule(rule, 0);
            var td = document.createElement('td');
            td.textContent = 'a';
            td.style.fontFamily = family + ', Arial';
            tr.appendChild(td);
        }
        table.appendChild(tr);
        if (config.time == 0) {
            zeroTimeRows.push(tr);
        } else {
            setTimeout((function(tr) { tr.classList.remove('hidden'); }).bind(null, tr), maxTime - config.time);
        }
    }

    setTimeout(function() {
        var pending = [];
        document.fonts.forEach(function(face) {
            var family = face.family.replace(/['"]/g, '');
            if (mustLoadFamilies[family])
                pending.push(face.loaded);
        });
        // Cap the extra wait well below the 2000ms margin before rows with
        // delay >= time (e.g. {time: 1000, delay: 3000}) finish their
        // block/load periods, and use allSettled so a rejected load still
        // finishes the test instead of timing out.
        var capTimer;
        var capPromise = new Promise(function(resolve) {
            capTimer = setTimeout(resolve, 1000);
        });
        Promise.race([Promise.allSettled(pending), capPromise]).then(function() {
            clearTimeout(capTimer);
            zeroTimeRows.forEach(function(tr) { tr.classList.remove('hidden'); });
            if (window.testRunner)
                testRunner.notifyDone();
        });
    }, maxTime);
};

</script>
