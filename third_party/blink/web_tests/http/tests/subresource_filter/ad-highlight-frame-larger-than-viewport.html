<!DOCTYPE html>
<html>
<meta name=fuzzy content="maxDifference=0-3; totalPixels=0-2000">
<head>
<style type="text/css">
body {
    overflow:hidden;
    margin: 0;
}
</style>
<script src="resources/ad-testharness.js"></script>
</head>
<body>
<div style="position:fixed; top:0; left:0; color:white; z-index:-1;">FCP</div>
<script type="text/javascript">
if (window.testRunner) {
  testRunner.setHighlightAds();
}

ad_frame = appendAdFrameTo(document.body);
ad_frame.style.borderWidth = 0;
ad_frame.width = 100;
ad_frame.height = 1000;
// Scroll down to verify that the overlay is drawn correctly for the portion of the
// frame that is larger than the viewport.
window.scrollTo(0, 400);

ad_frame.onload = async function () {
  await waitForFirstContentfulPaint();

  // Finish the test after the ad highlight is drawn.
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      if (window.testRunner)
        testRunner.notifyDone();
    });
  });
}
ad_frame.src = "about:blank";

if (window.testRunner)
  testRunner.waitUntilDone();
</script>
</body>
</html>
