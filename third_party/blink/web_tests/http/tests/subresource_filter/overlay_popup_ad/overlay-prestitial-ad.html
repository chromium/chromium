<!DOCTYPE html>
<html>
<head>
<style>
iframe {
  position: fixed;
  margin-left: 25vw;
  width: 50vw;
  height: 100vh;
  border: 0px;
}
p {
  position: fixed;
}
</style>

<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<script src="../resources/ad-testharness.js"></script>
</head>
<body marginwidth="0" marginheight="0">

<!-- To trigger the first contentful paint at the very start -->
<p>some content</p>

<script>
promise_test(async function(t) {
  // Create the overlay ad before any content has been painted.
  let ad_frame = appendAdFrameTo(document.body);

  // Force a layout update after the first contentful paint, so that the
  // interstitial detector is aware of the overlay ad. The page isn't
  // scrollable, so the overlay is decided on at appearance.
  await waitForFirstContentfulPaint();
  await forceLayoutUpdate();

  // Hide the overlay.
  document.getElementsByTagName('iframe')[0].style.display = 'none';

  // Force a layout update, so that the interstitial detector is aware of
  // the overlay ad candidate's dismissal.
  await forceLayoutUpdate();

  // Expect the kOverlayPopupAd UseCounter: a prestitial is a pop-up ad that
  // appears while the page is loading, before any user interaction.
  assert_true(internals.isUseCounted(document, kOverlayPopupAd));

  // Expect the kOverlayPrestitialAd UseCounter as well.
  assert_true(internals.isUseCounted(document, kOverlayPrestitialAd));
}, "Test overlay-prestitial-ad when the frame itself has a fixed position. In this case we expect use counters for both kOverlayPopupAd and kOverlayPrestitialAd.");

</script>
</body>
</html>
