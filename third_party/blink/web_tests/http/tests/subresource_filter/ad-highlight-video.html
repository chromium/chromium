<!DOCTYPE html>
<html>
<meta name=fuzzy content="maxDifference=0-3; totalPixels=0-15000">
<head>
<script src="resources/ad-testharness.js"></script>
</head>
<body>
<div style="position:fixed; top:0; left:0; color:white; z-index:-1;">FCP</div>
<script type="text/javascript">
if (window.testRunner) {
  testRunner.setHighlightAds();

  // Mark 'create-ad-video-script.js' as an ad.
  testRunner.setDisallowedSubresourcePathSuffixes(["create-ad-video-script.js"], /*block_subresources=*/false);
}

// Dynamically append the ad script. The <video> element created by this script
// will be ad-tagged.
var script = document.createElement('script');
script.src = "resources/create-ad-video-script.js";
script.onload = async function () {
  await waitForFirstContentfulPaint();

  // Finish the test after the ad highlight is drawn.
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      if (window.testRunner)
        testRunner.notifyDone();
    });
  });
};
document.body.appendChild(script);

if (window.testRunner)
  testRunner.waitUntilDone();
</script>
</body>
</html>
