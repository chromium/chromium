<script src="../../../resources/testharness.js"></script>
<script>

const url_base = 'http://127.0.0.1:8000/wasm/resources/load-wasm.php?name=';

(async function loadModules() {
  try {
    // This should load without any code cache.
    let initial_module =
      await WebAssembly.compileStreaming(fetch(url_base + 'large.wasm&cors'));

    // Retain `initial_module` here. Otherwise, GC could remove
    // the cache entry.

    // This should load with code cache.
    await WebAssembly.compileStreaming(fetch(url_base + 'large.wasm&cors'));
  } finally {
    window.top.postMessage('done', '*');
  }
})();

</script>
