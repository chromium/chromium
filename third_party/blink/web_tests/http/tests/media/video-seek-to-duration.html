<!DOCTYPE html>
<title>Test event dispatches and attribute changes for seek to duration.</title>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<video></video>
<script>
async_test(function(t) {
    var video = document.querySelector("video");

    var watcher = new EventWatcher(t, video, ["durationchange", "loadedmetadata",
        "loadeddata", "seeking", "seeked", "pause", "ended"]);

    var timeupdate_count = 0;
    video.addEventListener("timeupdate", function() {
        timeupdate_count++;
    });

    watcher.wait_for(["durationchange", "loadedmetadata", "loadeddata"]).then(t.step_func(function() {
        // Seek to the duration of the media.
        assert_less_than(video.currentTime, video.duration);
        assert_false(video.ended)
        assert_false(video.paused);
        //Starting seek to duration by setting video.currentTime to video.duration.
        timeupdate_count = 0;
        video.currentTime = video.duration;
        testCommonAttributes({'seeking': true, 'ended': false}, "start seek");
        return watcher.wait_for("seeking");
    })).then(t.step_func(function() {
        testCommonAttributes({'seeking': true, 'ended': false}, "during seeking");
        assert_false(video.paused);
        return watcher.wait_for("seeked");
    })).then(t.step_func(function() {
        testCommonAttributes({'seeking': false}, "after seeked");
        assert_greater_than(timeupdate_count, 0, "timeupdate should fire upon seek");
        return watcher.wait_for("pause");
    })).then(t.step_func(function() {
        assert_true(video.paused, "should be paused after seeking");
        testCommonAttributes({'seeking': false, 'ended': true}, "after pause");
        return watcher.wait_for("ended");
    })).then(t.step_func_done(function() {
        testCommonAttributes({'seeking': false, 'ended': true}, "after ended");
        assert_true(video.paused, "should be paused upon ended");
    }));

    function testCommonAttributes(testExpectations, label) {
        label = label ? label + " " : "";
        assert_equals(video.seeking, testExpectations.seeking, label + "video.seeking");
        if ('ended' in testExpectations)
            assert_equals(video.ended, testExpectations.ended, label + "video.ended");
        assert_equals(video.currentTime, video.duration, label + "video.currentTime");
    }

    video.src = "resources/test.webm";
    video.play();
});
</script>
