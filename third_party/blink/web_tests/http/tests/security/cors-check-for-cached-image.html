<!doctype html>
<html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async () => {
  const result = new Promise((resolve) => {
    window.addEventListener('message', (e) => resolve(e.data), {once: true});
  });

  const img = new Image();
  img.crossOrigin = 'anonymous';
  const loaded = new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => reject(new Error('Initial CORS image load failed'));
  });
  img.src = 'http://localhost:8080/security/resources/cors-image.php?max-age=60';
  document.body.appendChild(img);
  await loaded;

  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts';
  iframe.src = 'resources/cors-check-for-cached-image-iframe.html';
  document.body.appendChild(iframe);

  assert_equals(await result, 'PASS');
}, 'We should not reuse CORS check result when requested from another origin');
</script>
</body>
</html>
