<!DOCTYPE html>
<head>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
</head>
<body>
<iframe></iframe>

<script>
  let iframe = document.querySelector("iframe");
  function navigate_iframe(url) {
    return new Promise(resolve => {
      iframe.onload = resolve;
      iframe.src = url;
    });
  };

  // Navigate the iframe to URLs whose host aren't canonical. They need to be
  // percent encoded. Several navigation are made to ensure potential assertions
  // can be reached before the end of the test. See https://crbug.com/41424172.
  //
  // These hosts are not valid DNS names, so the network stack fails these
  // navigations, and they commit error pages instead. Error pages still get an
  // opaque origin whose precursor is derived from the failed URL, so this still
  // exercises creating origins from hosts like these.
  //
  // Note: '*' is used because it is still percent-escaped ("%2A") by the URL
  // canonicalizer. ',' used to be escaped too, but has been kept as-is since
  // https://crrev.com/c/4875754, which made the host "canonical" and defeated
  // the purpose of this test. See also https://crbug.com/40256677.
  promise_test(async function(t) {
    await navigate_iframe("http://foo*.example.test:8000/resources/dummy.html");
    await navigate_iframe("http://bar*.example.test:8000/resources/dummy.html");
    await navigate_iframe("http://baz*.example.test:8000/resources/dummy.html");
  }, "Navigate iframe to URL with non-canonicalized hostname");
</script>
</body>
