<!DOCTYPE html>
<meta charset=utf-8>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<iframe id="cross-origin-iframe" src="http://localhost:8000/security/resources/blank.html"></iframe>
<iframe id="cross-origin-iframe-with-child-named-then" src="http://localhost:8000/security/resources/frame-with-child-named-then.html"></iframe>
<!--
  HTML 7.2.3.2 CrossOriginPropertyFallback ( P )
  https://html.spec.whatwg.org/multipage/nav-history-apis.html#crossoriginpropertyfallback-(-p-)
  step 1. If P is "then", @@toStringTag, @@hasInstance, or @@isConcatSpreadable, then return PropertyDescriptor{ [[Value]]: undefined, [[Writable]]: false, [[Enumerable]]: false, [[Configurable]]: true }.

  WindowProxy [[GetOwnProperty]] ( P )
  https://html.spec.whatwg.org/multipage/nav-history-apis.html#windowproxy-getownproperty
  consults W's document-tree child navigable target name property set before
  falling back to CrossOriginPropertyFallback, so a child navigable named "then"
  must not be shadowed by the fallback.

  Test that window.then and location.then return undefined in case of cross origin.
-->
<script>
onload = function() {

  test(function() {
    let iframe = document.getElementById('cross-origin-iframe');
    let w = iframe.contentWindow;  // cross origin window
    assert_throws_dom('SecurityError', function() { w.document; }, "The window 'w' must be cross origin.");
    assert_equals(w.then, undefined, "The value of 'then' must be undefined.");
    assert_equals(w.location.then, undefined, "The value of 'location.then' must be undefined.");

  }, "Test that 'then' on cross origin window and location returns undefined.");

  test(function() {
    // This cross origin window has a child browsing context named 'then',
    // which shouldn't be shadowed by the CrossOriginPropertyFallback.
    let iframe = document.getElementById('cross-origin-iframe-with-child-named-then');
    let w = iframe.contentWindow;  // cross origin window
    assert_throws_dom('SecurityError', function() { w.document; }, "The window 'w' must be cross origin.");

    assert_equals(typeof w.then, 'object', "The value of 'then' must be a WindowProxy.");
    assert_equals(w.then, w[0], "The value of 'then' must be the child browsing context named 'then'.");
    assert_equals(w.location.then, undefined, "The value of 'location.then' must be undefined.");
  }, "Test that a child browsing context named 'then' is not shadowed.");

};
</script>
