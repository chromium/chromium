<!DOCTYPE html>
<meta http-equiv="Content-Security-Policy" content="block-all-mixed-content">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// The module graph of a worker or a worklet is fetched with the outside
// settings object, so the block-all-mixed-content violation of an insecure
// import is reported on the creator.
const kInsecureOrigin = 'http://example.test:8000';

promise_test(async t => {
  const worker_src = 'resources/import-insecure-module.js';
  await Promise.all([
    new EventWatcher(t, window, 'securitypolicyviolation')
        .wait_for('securitypolicyviolation')
        .then(e => {
          assert_true(e.blockedURI.startsWith(kInsecureOrigin), e.blockedURI);
          assert_equals(e.effectiveDirective, 'block-all-mixed-content');
          assert_equals(e.violatedDirective, 'block-all-mixed-content');
        }),
    new EventWatcher(t, new Worker(worker_src, {type: 'module'}), 'error')
        .wait_for('error'),
  ]);
}, 'DedicatedWorker: an insecure import is reported on the creator.');

promise_test(async t => {
  const worker_src = `resources/import-insecure-module.js?${Math.random()}`;
  await Promise.all([
    new EventWatcher(t, document, 'securitypolicyviolation')
        .wait_for('securitypolicyviolation')
        .then(e => {
          assert_true(e.blockedURI.startsWith(kInsecureOrigin), e.blockedURI);
          assert_equals(e.effectiveDirective, 'block-all-mixed-content');
          assert_equals(e.violatedDirective, 'block-all-mixed-content');
        }),
    new EventWatcher(t, new SharedWorker(worker_src, {type: 'module'}), 'error')
        .wait_for('error'),
  ]);
}, 'SharedWorker: an insecure import is reported on the creator.');

promise_test(async t => {
  const worklet_src = 'resources/import-insecure-module.js?worklet';
  await Promise.all([
    new EventWatcher(t, document, 'securitypolicyviolation')
        .wait_for('securitypolicyviolation')
        .then(e => {
          assert_true(e.blockedURI.startsWith(kInsecureOrigin), e.blockedURI);
          assert_equals(e.effectiveDirective, 'block-all-mixed-content');
          assert_equals(e.violatedDirective, 'block-all-mixed-content');
        }),
    promise_rejects_dom(
        t, 'AbortError', new AudioContext().audioWorklet.addModule(worklet_src)),
  ]);
}, 'AudioWorklet: an insecure import is reported on the creator.');
</script>
