<!DOCTYPE html>
<title>Tests for color-gamut media query</title>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<script>
test(function() {
  assert_true(window.matchMedia("(color-gamut)").matches);
}, "Test that color-gamut can be feature detected");

test(function() {
  assert_false(window.matchMedia("(color-gamut: foobar)").matches);
}, "Test that unknown values are rejected");

function setColorProfile(name) {
  return new Promise(resolve => testRunner.setColorProfile(name, resolve));
}

const testCases = [
  { profile: 'sRGB', expected: { srgb: true, p3: false, rec2020: false } },
  { profile: 'colorSpin', expected: { srgb: true, p3: false, rec2020: false } },
  { profile: 'adobeRGB', expected: { srgb: true, p3: false, rec2020: false } },
  { profile: 'almostP3', expected: { srgb: true, p3: true, rec2020: false } },
  { profile: 'almostRec2020', expected: { srgb: true, p3: true, rec2020: true } },
];

for (const { profile, expected } of testCases) {
  promise_test(async () => {
    assert_implements('testRunner' in window, 'testRunner is required');
    await setColorProfile(profile);
    assert_equals(window.matchMedia("(color-gamut: srgb)").matches, expected.srgb, "srgb matches");
    assert_equals(window.matchMedia("(color-gamut: p3)").matches, expected.p3, "p3 matches");
    assert_equals(window.matchMedia("(color-gamut: rec2020)").matches, expected.rec2020, "rec2020 matches");
  }, `Test color-gamut with ${profile} profile`);
}
</script>
