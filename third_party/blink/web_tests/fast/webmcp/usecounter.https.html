<!DOCTYPE html>
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>
<script src="resources/webmcp-helpers.js"></script>
<form id=f1>
    <input type="text" name="dummy">
    <input type="submit" id=s1>
</form>
<form id=f2 toolautosubmit>
    <input type="text" name="dummy">
    <input type="submit" id=s2>
</form>
<script>
// Use counter IDs from web_feature.mojom
const kModelContextRegisterToolIDL = 5791;
const kModelContextRegisterDeclarativeTool = 5792;
const kModelContextExecuteToolAllExecutions = 5799;
const kModelContextExecuteDeclarativeTool = 5800;
const kModelContextExecuteDeclarativeAutosubmit = 5801;
const kModelContextGetToolsIDL = 5904;
const kModelContextExecuteToolIDL = 5943;

promise_test(async () => {
    assert_false(internals.isUseCounted(document, kModelContextGetToolsIDL));
    await document.modelContext.getTools();
    assert_true(internals.isUseCounted(document, kModelContextGetToolsIDL));
}, "getTools use counter");

promise_test(async () => {
    assert_false(internals.isUseCounted(document, kModelContextRegisterToolIDL));
    assert_false(internals.isUseCounted(document, kModelContextRegisterDeclarativeTool));

    document.modelContext.registerTool({
        execute: () => {},
        name: "imperative",
        description: "dummy",
        inputSchema: { type: "object", properties: {} },
    });
    assert_true(internals.isUseCounted(document, kModelContextRegisterToolIDL));
    assert_false(internals.isUseCounted(document, kModelContextRegisterDeclarativeTool));

    internals.clearUseCounter(document, kModelContextRegisterToolIDL);
    internals.clearUseCounter(document, kModelContextRegisterDeclarativeTool);

    const f1 = document.getElementById("f1");
    f1.setAttribute("toolname", "declarative1");
    f1.setAttribute("tooldescription", "dummy");

    await waitForTool("declarative1");

    assert_true(internals.isUseCounted(document, kModelContextRegisterDeclarativeTool));
    assert_false(internals.isUseCounted(document, kModelContextRegisterToolIDL));
}, "Registration use counters");

promise_test(async () => {
    internals.clearUseCounter(document, kModelContextExecuteToolAllExecutions);
    internals.clearUseCounter(document, kModelContextExecuteDeclarativeTool);
    internals.clearUseCounter(document, kModelContextExecuteDeclarativeAutosubmit);

    // We use invalid JSON to trigger an early return and avoid PauseExecution()
    // which might crash in content_shell if ScriptToolHost is not available.
    const tools = await document.modelContext.getTools();
    const tool = tools.find(t => t.name === "imperative");
    try {
        await document.modelContext.executeTool(tool, "invalid json");
    } catch (e) {}
    assert_true(internals.isUseCounted(document, kModelContextExecuteToolAllExecutions),'imperative execution');
    assert_false(internals.isUseCounted(document, kModelContextExecuteDeclarativeTool),'declarative execution');
    assert_false(internals.isUseCounted(document, kModelContextExecuteDeclarativeAutosubmit),'declarative autosubmit execution');
}, "Imperative execution use counter");

promise_test(async () => {
    internals.clearUseCounter(document, kModelContextExecuteToolAllExecutions);
    internals.clearUseCounter(document, kModelContextExecuteToolIDL);
    const tools = await document.modelContext.getTools();
    const tool = tools.find(t => t.name === "imperative");
    assert_true(!!tool, "imperative tool should be found");

    const executePromise = document.modelContext.executeTool(tool, "{}");
    assert_true(internals.isUseCounted(document, kModelContextExecuteToolIDL), 'counted synchronously upon executeTool() IDL method invocation');
    assert_false(internals.isUseCounted(document, kModelContextExecuteToolAllExecutions), 'not counted synchronously upon executeTool() method invocation');

    try {
        await executePromise;
    } catch (e) {}
    assert_true(internals.isUseCounted(document, kModelContextExecuteToolAllExecutions), 'counted during tool callback execution');
}, "Imperative executeTool() timing and observability use counter");

promise_test(async () => {
    internals.clearUseCounter(document, kModelContextExecuteToolAllExecutions);
    internals.clearUseCounter(document, kModelContextExecuteDeclarativeTool);
    internals.clearUseCounter(document, kModelContextExecuteDeclarativeAutosubmit);

    const tools = await document.modelContext.getTools();
    const tool = tools.find(t => t.name === "declarative1");
    try {
        await document.modelContext.executeTool(tool, "invalid json");
    } catch (e) {}
    assert_false(internals.isUseCounted(document, kModelContextExecuteToolAllExecutions),'imperative execution');
    assert_true(internals.isUseCounted(document, kModelContextExecuteDeclarativeTool),'declarative execution');
    assert_false(internals.isUseCounted(document, kModelContextExecuteDeclarativeAutosubmit),'declarative autosubmit execution');
}, "Declarative execution use counter (no autosubmit)");

promise_test(async () => {
    internals.clearUseCounter(document, kModelContextExecuteToolAllExecutions);
    internals.clearUseCounter(document, kModelContextExecuteDeclarativeTool);
    internals.clearUseCounter(document, kModelContextExecuteDeclarativeAutosubmit);

    const f2 = document.getElementById("f2");
    f2.setAttribute("toolname", "declarative2");
    f2.setAttribute("tooldescription", "dummy");

    await waitForTool("declarative2");

    const tools = await document.modelContext.getTools();
    const tool = tools.find(t => t.name === "declarative2");
    try {
        await document.modelContext.executeTool(tool, "invalid json");
    } catch (e) {}
    assert_false(internals.isUseCounted(document, kModelContextExecuteToolAllExecutions),'imperative execution');
    assert_true(internals.isUseCounted(document, kModelContextExecuteDeclarativeTool),'declarative execution');
    assert_true(internals.isUseCounted(document, kModelContextExecuteDeclarativeAutosubmit),'declarative autosubmit execution');
}, "Declarative execution use counter (with autosubmit)");

</script>
