<!DOCTYPE html>
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
<script src="../../../resources/testdriver.js"></script>
<script src="../../../resources/testdriver-vendor.js"></script>
<script src="../resources/picker-common.js"></script>

<input type="time" id="time" value="14:15" step="900">
<script>

// Time columns are laid out as hour, minute and, on a 12-hour clock, AM/PM.
const MINUTE_COLUMN = 1;
const HOUR_COLUMN = 0;

function columnValues(columnIndex) {
  const columns = internals.pagePopupWindow.document.querySelectorAll(
      '.time-column');
  return Array.from(columns[columnIndex].children)
      .map((cell) => Number(cell.value));
}

promise_test(async () => {
  const input = document.getElementById('time');
  await openPicker(input);

  const minutes = columnValues(MINUTE_COLUMN);
  assert_greater_than(minutes.length, 0, 'the minute column has cells');
  for (const minute of minutes) {
    assert_equals(minute % 15, 0, `minute ${minute} is a multiple of the step`);
  }
  assert_array_equals(
      [...new Set(minutes)].sort((a, b) => a - b), [0, 15, 30, 45],
      'the minute column offers every minute that matches the step');

  // A coarser step must not change the granularity of the other columns.
  assert_equals(
      columnValues(HOUR_COLUMN).length, 12, 'the hour column is unchanged');

  // Opening the picker does not change the value of the control.
  assert_equals(input.value, '14:15');
}, 'The time picker offers only the minutes that the step attribute allows.');
</script>
