<script>
function createFrame(src) {
  return new Promise(resolve => {
    const iframe = document.createElement('iframe');
    iframe.onload = () => {
      // Give time for any XSLT commit navigation to settle.
      setTimeout(() => resolve(iframe), 50);
    };
    iframe.src = src;
    (document.body || document.documentElement).appendChild(iframe);
  });
}

promise_test(async () => {
  // This test is only for XSLT enabled, since the warning banner only shows up for XSLT transforms.
  if (!internals.runtimeFlags.xsltEnabled) {
    return;
  }

  const capFrame = await createFrame("resources/cap-alert-transform.xml");
  const nonCapFrame = await createFrame("resources/non-cap-transform.xml");

  const nonCapDoc = nonCapFrame.contentDocument;
  assert_not_equals(nonCapDoc, null, "Non-CAP frame contentDocument should exist");
  const nonCapTransformed = nonCapDoc.getElementById('transformed');
  assert_not_equals(nonCapTransformed, null, "Non-CAP XML document should be transformed when XSLT is enabled");
  const nonCapBanner = nonCapDoc.querySelector('xslt-warning-banner');
  assert_not_equals(nonCapBanner, null, "Banner element should exist");
  assert_not_equals(nonCapBanner.shadowRoot, null, "Banner should have an open shadow root");
  assert_true(nonCapBanner.shadowRoot.textContent.includes("This site uses XSLT"),
      "General XSLT transformed document should contain the general deprecation warning banner");
  assert_false(nonCapBanner.shadowRoot.textContent.includes("This CAP alert"),
      "General XSLT document should not contain the CAP alert deprecation message");

  const capDoc = capFrame.contentDocument;
  assert_not_equals(capDoc, null, "CAP frame contentDocument should exist");
  const capTransformed = capDoc.getElementById('transformed');
  assert_not_equals(capTransformed, null, "CAP alert XML document should be transformed via XSLT");
  const capBanner = capDoc.querySelector('xslt-warning-banner');
  assert_not_equals(capBanner, null, "CAP banner element should exist");
  assert_not_equals(capBanner.shadowRoot, null, "CAP banner should have an open shadow root");
  assert_true(capBanner.shadowRoot.textContent.includes("This CAP alert"),
      "CAP Alert transformed page should contain the CAP deprecation warning banner");
  assert_false(capBanner.shadowRoot.textContent.includes("This site uses XSLT"),
      "CAP Alert page should not contain the general deprecation warning message");
}, "XSLT deprecation warning banner on declarative XML stylesheets");

test(() => {
  // This test is only for XSLT enabled, since the warning banner only shows up for XSLT transforms.
  if (!internals.runtimeFlags.xsltEnabled) {
    return;
  }

  const xmlStr = `<?xml version="1.0" encoding="utf-8"?><data><item>Hello</item></data>`;
  const xslStr = `<?xml version="1.0" encoding="utf-8"?>
    <xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">
      <xsl:template match="/">
        <html>
          <body>
            <p id="result"><xsl:value-of select="data/item"/></p>
          </body>
        </html>
      </xsl:template>
    </xsl:stylesheet>`;

  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlStr, "application/xml");
  const xslDoc = parser.parseFromString(xslStr, "application/xml");

  const processor = new XSLTProcessor();
  processor.importStylesheet(xslDoc);
  const resultDoc = processor.transformToDocument(xmlDoc);

  assert_not_equals(resultDoc, null, "transformToDocument should succeed");
  assert_equals(resultDoc.getElementById('result').textContent, "Hello");
  const banner = resultDoc.querySelector('xslt-warning-banner');
  assert_not_equals(banner, null, "Banner element should exist");
  assert_not_equals(banner.shadowRoot, null, "Banner should have an open shadow root");
  assert_true(banner.shadowRoot.textContent.includes("This site uses XSLT"),
      "Document produced by transformToDocument should contain the deprecation warning banner");
}, "XSLT deprecation warning banner on XSLTProcessor.transformToDocument");

promise_test(async () => {
  // This test is only for XSLT enabled, since the warning banner only shows up for XSLT transforms.
  if (!internals.runtimeFlags.xsltEnabled) {
    return;
  }

  const frame = await createFrame("resources/non-cap-transform.xml");
  const doc = frame.contentDocument;
  const banner = doc.querySelector('xslt-warning-banner');
  assert_not_equals(banner, null, "The banner should exist");
  assert_equals(banner.localName, "xslt-warning-banner",
      "The banner should be an xslt-warning-banner custom element");
  assert_not_equals(banner.shadowRoot, null, "The banner should have an open shadow root");
  assert_true(banner.shadowRoot.textContent.includes("This site uses XSLT"),
      "The banner shadow root should contain the warning text");

  const checkbox = banner.shadowRoot.querySelector('input[type="checkbox"]');
  assert_not_equals(checkbox, null, "The banner should contain a checkbox");
  assert_false(checkbox.checked, "The checkbox should default to unchecked");

  const closeButton = banner.shadowRoot.querySelector('button');
  assert_not_equals(closeButton, null, "The banner should contain a close button");
  assert_equals(closeButton.getAttribute('aria-label'), "Close",
      "The close button should be labeled for assistive technology");

  closeButton.click();
  assert_equals(banner.parentNode, null, "Clicking close should remove the banner");
}, "XSLT deprecation warning banner can be closed");

promise_test(async () => {
  // This test is only for XSLT enabled, since the warning banner only shows up for XSLT transforms.
  if (!internals.runtimeFlags.xsltEnabled) {
    return;
  }

  // Checking "Never show this warning" asks the browser to persist the
  // suppression. Web tests can't observe the browser-side preference, so this
  // just checks that the banner still closes. See
  // chrome/browser/xslt_deprecation_banner_browsertest.cc for the persistence
  // coverage.
  const frame = await createFrame("resources/cap-alert-transform.xml");
  const doc = frame.contentDocument;
  const banner = doc.querySelector('xslt-warning-banner');
  assert_not_equals(banner, null, "The banner should exist");
  assert_not_equals(banner.shadowRoot, null, "The banner should have an open shadow root");
  assert_true(banner.shadowRoot.textContent.includes("This CAP alert"),
      "The CAP alert banner should also have dismiss controls");

  banner.shadowRoot.querySelector('input[type="checkbox"]').checked = true;
  banner.shadowRoot.querySelector('button').click();
  assert_equals(banner.parentNode, null, "Clicking close should remove the banner");
}, "XSLT deprecation warning banner 'Never show this warning' checkbox");
</script>
