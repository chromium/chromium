<link rel="help" href="https://crbug.com/545571571">
<script src="../../resources/testharness.js"></script>
<script src="../../resources/testharnessreport.js"></script>

<script>
const kXmlCAPAlert = 5973;
const kXmlCAPAlertWithXSLT = 5974;

function createFrame(src) {
  return new Promise(resolve => {
    const iframe = document.createElement('iframe');
    iframe.onload = () => resolve(iframe);
    iframe.src = src;
    (document.body || document.documentElement).appendChild(iframe);
  });
}

promise_test(async () => {
  const iframe = await createFrame("resources/cap-alert-xslt.xml");
  const isXSLTEnabled = iframe.contentDocument && iframe.contentDocument.querySelector('p') !== null;
  assert_true(internals.isUseCounted(iframe.contentDocument, kXmlCAPAlert), "kXmlCAPAlert should trip for XML document");
  assert_equals(internals.isUseCounted(iframe.contentDocument, kXmlCAPAlertWithXSLT), isXSLTEnabled, "kXmlCAPAlertWithXSLT should match XSLT enabled status");
}, "XML parser trips kXmlCAPAlert and kXmlCAPAlertWithXSLT correctly");
</script>
