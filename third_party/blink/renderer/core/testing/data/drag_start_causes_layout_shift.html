<!doctype html>
<head>
  <title>Starting a drag causes a layout shift or removes the element</title>
</head>
<script>
  function onDragStart(event, action) {
    event.dataTransfer.effectAllowed = 'copy';
    if (action === 'remove') {
      document.getElementById('remove-target').remove();
    } else if (action === 'shift') {
      const div = document.createElement('div');
      div.id = 'red-square';
      div.draggable = true;
      div.style.width = '500px';
      div.style.height = '500px';
      div.style.background = 'red';
      document.body.prepend(div);
    }
  }
</script>
<body>
  <img id="remove-target" ondragstart="onDragStart(event, 'remove')"
    src="notifications/110x110.png" alt="PNG circle" />
  <img id="shift-target" ondragstart="onDragStart(event, 'shift')"
    src="notifications/110x110.png" alt="PNG circle" />
</body>
</html>
