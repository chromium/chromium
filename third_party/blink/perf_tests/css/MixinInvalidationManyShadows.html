<!doctype html>
<style id="mixin">
  @mixin --perf-mixin() {
    @result {
      color: red;
    }
  }
</style>
<script src="../resources/runner.js"></script>
<script src="resources/mixin-invalidation.js"></script>
<script>
  const mixinStyle = document.querySelector('#mixin');

  window.onload = () => {
    measureMixinInvalidation({
      description:
          'Measures changing a parent mixin used by every shadow tree.',
      mixinUserCount: SHADOW_COUNT,
      mutate: useGreen => {
        mixinStyle.textContent = `
          @mixin --perf-mixin() {
            @result {
              color: ${useGreen ? 'green' : 'red'};
            }
          }
        `;
      },
    });
  };
</script>
