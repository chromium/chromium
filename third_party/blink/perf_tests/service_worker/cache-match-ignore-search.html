<!DOCTYPE html>
<html>
<head>
<script src='../resources/runner.js'></script>
</head>
<body>
<script>

function runTest() {
  navigator.serviceWorker.addEventListener('message', (msg) => {
    PerfTestRunner.recordResultFromWorker(msg.data);
  });

  const script =
      '/service_worker/resources/cache-match-service-worker.js?ignoreSearch';
  const scope = '/service_worker/resources/';

  navigator.serviceWorker.register(script, { scope: scope }).catch((error) => {
    PerfTestRunner.logFatalError(
        'Failed to register service worker script:' + script + ': ' + error);
  });
}

PerfTestRunner.startMeasureValuesInWorker({
  description: 'Measure Cache.match() with ignoreSearch and body consumption ' +
      'over 1000 entries. See crbug.com/41295831 for context',
  unit: 'ms',
  run: runTest
});
</script>
</body>
</html>
