<!doctype html>
<title>Grid Lanes fill-reverse stacking-axis alignment after item resize</title>
<script src="../resources/runner.js"></script>
<style>
  body {
    margin: 0;
  }

  #grid-lanes {
    align-items: center;
    display: grid-lanes;
    flow-tolerance: 0;
    gap: 2px;
    grid-lanes-direction: column fill-reverse;
    grid-template-columns: repeat(32, 24px);
    height: 2600px;
  }

  .item {
    background: lightblue;
    box-sizing: border-box;
    overflow: clip;
    white-space: nowrap;
  }

  .short {
    height: 20px;
    width: 8px;
  }

  .medium {
    height: 36px;
    padding: 2px;
    width: 16px;
  }

  .tall {
    height: 52px;
    width: 24px;
  }
</style>

<div id="grid-lanes"></div>

<script>
  'use strict';

  const kItemClasses = ['short', 'medium', 'tall'];
  const kItemContents = ['', 'x', 'grid lanes'];
  const kItemCount = 2000;

  function populateContainer(container) {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < kItemCount; ++i) {
      const shapeIndex = i % kItemClasses.length;
      const item = document.createElement('div');
      item.className = `item ${kItemClasses[shapeIndex]}`;
      item.textContent = kItemContents[shapeIndex];
      fragment.appendChild(item);
    }
    container.appendChild(fragment);
  }

  function startTest() {
    const container = document.getElementById('grid-lanes');
    populateContainer(container);

    PerfTestRunner.forceLayout();

    const target = container.firstElementChild;
    let isTall = true;
    PerfTestRunner.measureRunsPerSecond({
      description:
          'Measures Grid Lanes fill-reverse placement and stacking-axis ' +
          'alignment of 2,000 varied items after resizing the first item.',
      run() {
        target.style.height = isTall ? '68px' : '20px';
        isTall = !isTall;
        PerfTestRunner.forceLayout();
      },
    });
  }

  window.addEventListener('load', startTest);
</script>
