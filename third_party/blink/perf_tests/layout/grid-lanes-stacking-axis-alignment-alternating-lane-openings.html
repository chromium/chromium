<!doctype html>
<title>Grid Lanes stacking-axis alignment with openings alternating between lanes</title>
<script src="../resources/runner.js"></script>
<style>
  body {
    margin: 0;
  }

  #grid-lanes {
    align-items: start;
    display: grid-lanes;
    gap: 0;
    grid-template-columns: 120px 120px;
  }

  .lane-1-short {
    grid-column: 1;
    height: 20px;
  }

  .lane-1-tall {
    grid-column: 1;
    height: 50px;
  }

  .lane-2-short {
    grid-column: 2;
    height: 20px;
  }

  .lane-2-tall {
    grid-column: 2;
    height: 50px;
  }

  .spanner {
    grid-column: span 2;
    height: 20px;
  }
</style>

<div id="grid-lanes"></div>

<script>
  'use strict';

  const kRowCount = 10000;

  function populateContainer(container) {
    const fragment = document.createDocumentFragment();
    // Each row adds an opening above `.spanner`, under the shorter item.
    // The opening alternates between the first and the second lane.
    for (let i = 0; i < kRowCount; ++i) {
      const classNames = i % 2
          ? ['lane-1-tall', 'lane-2-short', 'spanner']
          : ['lane-1-short', 'lane-2-tall', 'spanner'];
      for (const className of classNames) {
        const item = document.createElement('div');
        item.className = className;
        fragment.appendChild(item);
      }
    }
    container.appendChild(fragment);
  }

  function startTest() {
    const container = document.getElementById('grid-lanes');
    populateContainer(container);

    PerfTestRunner.forceLayout();

    const target = container.firstElementChild;
    let isTall = true;
    PerfTestRunner.measureTime({
      description:
          'Measures Grid Lanes stacking-axis alignment of 30,000 items, ' +
          'where 10,000 openings alternate between two lanes, after ' +
          'resizing the first item.',
      run() {
        target.style.height = isTall ? '40px' : '20px';
        isTall = !isTall;
        PerfTestRunner.forceLayout();
      },
    });
  }

  window.addEventListener('load', startTest);
</script>
