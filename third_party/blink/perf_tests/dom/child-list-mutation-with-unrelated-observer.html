<!DOCTYPE html>
<html>
<body>
<script src="../resources/runner.js"></script>
<div id="observed"></div>
<script>
// Once any MutationObserver observes childList somewhere in the document,
// every child list mutation in the document has to find out whether an
// observer is interested. Measure appendChild/removeChild on nodes that
// nobody observes while such an observer exists.
var observer = new MutationObserver(function() {});
observer.observe(document.getElementById("observed"), {childList: true, subtree: true});

var childCount = 64;
// Detached, like a framework building a subtree before inserting it.
var parent = document.createElement("div");
var children = [];
var tags = ["div", "span", "p", "a"];
for (var i = 0; i < childCount; i++)
    children.push(document.createElement(tags[i % tags.length]));

PerfTestRunner.measureRunsPerSecond({
    description: "appendChild/removeChild on a detached, unobserved node with an unrelated childList observer in the document.",
    run: function() {
        for (var i = 0; i < 20000; i++) {
            var child = children[i % childCount];
            parent.appendChild(child);
            parent.removeChild(child);
        }
}});
</script>
</body>
</html>
