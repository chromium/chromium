<!DOCTYPE html>
<script src="../resources/runner.js"></script>
<script src="resources/paint.js"></script>
<!-- Companion to gap-decorations-flex.html, with an integer-repeat width list. -->
<style>
  html, body {
    margin: 0;
    padding: 0;
  }

  #flex-container {
    display: flex;
    flex-wrap: wrap;
    width: 9000px;

    gap: 6px;

    column-rule: 2px solid blue;
    column-rule-width: 6px, 1px, repeat(3, 1px, 2px, 3px);
    row-rule: 2px solid red;

    column-rule-break: intersection;
    row-rule-break: intersection;

    column-rule-inset: 0;
    row-rule-inset: 2px;
  }

  .item {
    height: 10px;
    margin: 0;

    background-color: green;
  }
</style>

<div id="flex-container"></div>

<script>
  (function() {
    const container = document.getElementById('flex-container');

    function populateContainer() {
      const itemCount = 60000;
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < itemCount; ++i) {
        const div = document.createElement('div');
        div.className = 'item';

        // Vary width between ~10px and ~50px.
        const base = 10;
        const span = 50;
        const width = base + (i * 3) % span;
        div.style.width = width + 'px';

        fragment.appendChild(div);
      }

      container.appendChild(fragment);
    }

    populateContainer();

    var wide = false;

    measurePaint({
      run: function() {
        container.style.width = wide ? "10000px" : "9000px";
        wide = !wide;
      }
    });
  })();
</script>
