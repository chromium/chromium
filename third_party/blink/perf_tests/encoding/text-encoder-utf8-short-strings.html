<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
<!--
  Benchmark: TextEncoder.encode performance on short non-ASCII (UTF-8) strings.
  To test with the fast path enabled:
    --enable-features=TextEncoderFastPath
-->
  <title>TextEncoder Performance on Short UTF-8 Strings</title>
</head>
<body>
<script src="../resources/runner.js"></script>
<script>
const encoder = new TextEncoder();

const SHORT_UTF8_1 = "✓";
const SHORT_UTF8_4 = "🚀✨🔥✓";
const SHORT_UTF8_16 = "日本語テスト文字列です";
const SHORT_UTF8_64 = "这是一个用于基准测试的较长中文字符串，用于测试多字节编码性能。";

// Reduced iteration count to 50 to minimize GC noise during measurement.
const INNER_LOOP_COUNT = 50;

PerfTestRunner.measureRunsPerSecond({
  description: "Measures TextEncoder.encode performance on short non-ASCII strings (UTF-8). Run with --enable-features=TextEncoderFastPath to test the optimization.",
  run: function() {
    // Return values are intentionally not consumed to keep the benchmark focused purely
    // on encoding performance without adding JS property access overhead.
    // (V8 does not dead-code eliminate Web IDL API calls).
    for (let i = 0; i < INNER_LOOP_COUNT; ++i) {
      encoder.encode(SHORT_UTF8_1);
      encoder.encode(SHORT_UTF8_4);
      encoder.encode(SHORT_UTF8_16);
      encoder.encode(SHORT_UTF8_64);
    }
  }
});
</script>
</body>
</html>
