<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
<!--
  Benchmark: TextEncoder.encode performance on long strings.
  To test with direct encoding enabled:
    --enable-features=TextEncoderDirectEncode
-->
  <title>TextEncoder Performance on Long Strings</title>
</head>
<body>
<script src="../resources/runner.js"></script>
<script>
const encoder = new TextEncoder();

// 16-bit mostly-ASCII string (trailing U+2713 forces 16-bit storage in V8/Blink).
const LONG_16BIT_MOSTLY_ASCII = "a".repeat(100000) + "\u2713";
// 8-bit non-ASCII Latin-1 string (trailing U+00E9 stays 8-bit but is non-ASCII).
const LONG_8BIT_LATIN1 = "a".repeat(100000) + "\u00e9";
// 16-bit dense non-ASCII string (3-byte UTF-8 per code unit).
const LONG_16BIT_UTF8 = "あ".repeat(50000);

const INNER_LOOP_COUNT = 5;

PerfTestRunner.measureRunsPerSecond({
  description: "Measures TextEncoder.encode performance on long strings (50K-100K chars across 16-bit mostly-ASCII, 8-bit Latin-1, and 16-bit UTF-8). Run with --enable-features=TextEncoderDirectEncode to test the optimization.",
  run: function() {
    for (let i = 0; i < INNER_LOOP_COUNT; ++i) {
      encoder.encode(LONG_16BIT_MOSTLY_ASCII);
      encoder.encode(LONG_8BIT_LATIN1);
      encoder.encode(LONG_16BIT_UTF8);
    }
  }
});
</script>
</body>
</html>
