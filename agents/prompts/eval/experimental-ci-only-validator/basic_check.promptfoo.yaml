description: Verify the experimental-ci-only-validator skill correctly identifies ci_only tests.
owner: aadarshb@
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      extensions: []
      skills:
        - experimental-ci-only-validator
tests:
  - vars:
      query: "Use the experimental-ci-only-validator skill to find all CI-only code coverage LUCI builders that run the 'chrome_junit_tests' suite."
    assert:
      - type: contains
        value: "android-code-coverage"
      - type: contains
        value: "android-x86-code-coverage"
    metadata:
      pass_k_threshold: 1
      runs_per_test: 3
