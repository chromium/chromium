description: >-
  Verify the crossbench-runner skill correctly assists in running benchmarks and
  locating results.
owner: elkurin@chromium.org
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      extensions: []
      skills:
        - crossbench-runner
tests:
  - vars:
      query: "How do I run the browser_startup benchmark in Crossbench?"
    assert:
      - type: contains
        value: "cb.py"
  - vars:
      query: "How do I run the heavy-meet-note benchmark in Crossbench?"
    assert:
      - type: contains
        value: "run.py"
      - type: contains
        value: "--tests"
  - vars:
      query: >-
        Where can I find unmerged metrics per story from a Crossbench run?
    assert:
      - type: contains
        value: "results/latest"
      - type: contains
        value: "trace_processor"
  - vars:
      query: >-
        My Crossbench run crashed on a headless Linux VM with WebDriver session
        not created. How do I fix it?
    assert:
      - type: contains
        value: "xvfb-run"
  - vars:
      query: >-
        I updated bot_platforms.py for a Crossbench benchmark. How do I update
        the shard maps?
    assert:
      - type: contains
        value: "generate_perf_sharding.py"
  - vars:
      query: >-
        browser_window_first_paint_ms regressed by 30ms on mac-m1-pro-perf in
        browser_startup.crossbench, but first_web_contents_non_empty_paint_ms did
        not change. How do I verify whether actual window screen presentation
        regressed?
    assert:
      - type: contains
        value: "InitialWebUI.Startup.BrowserWindow.FirstPaint"
