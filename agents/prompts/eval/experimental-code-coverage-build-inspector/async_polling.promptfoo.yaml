description: >-
  Verify experimental-code-coverage-build-inspector skill triggers schedule
  tool async polling when build is non-terminal.
owner: pasthana@
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      extensions: []
      skills:
        - experimental-code-coverage-build-inspector
      changes:
        - apply: >-
            agents/prompts/eval/experimental-code-coverage-build-inspector/setup_triage_state.patch
      mocks:
        - command: python3
          rules:
            - args: ["tools/code_coverage/inspect_coverage_build.py", "*"]
              stdout: >-
                === Build Inspection ===
                Build ID: 875812345679
                Terminal Status: STARTED (Terminal: False)
                Build status is non-terminal (STARTED).
              exit_code: 0

tests:
  - description: >-
      Functional: Non-Terminal Build Async Polling Gate
    vars:
      query: >-
        Inspect active LUCI tryjob build https://ci.chromium.org/b/875812345679
        for C++ code coverage.
    assert:
      - type: contains
        value: "schedule"
