description: >-
  Verify experimental-code-coverage-build-inspector skill extracts target file
  line coverage metrics via inspect_coverage_build.py.
owner: pasthana@
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      extensions: []
      skills:
        - experimental-code-coverage-build-inspector
      changes:
        - apply: >-
            agents/prompts/eval/experimental-code-coverage-build-inspector/setup_triage_state.patch
      mocks:
        - command: python3
          rules:
            - args: ["tools/code_coverage/inspect_coverage_build.py", "*"]
              stdout: >-
                === Build Inspection ===
                Build ID: 875812345680
                Terminal Status: SUCCESS (Terminal: True)
                [Target File Coverage Extraction]
                  * File: chrome/browser/ui/color/color_mixer.cc
                    * Line Coverage: 30/40 (75.00%)
                    * Uncovered Lines (10): 12-15, 20-25
              exit_code: 0

tests:
  - description: >-
      Functional: Target Source File Line Coverage Extraction
    vars:
      query: >-
        Inspect build https://ci.chromium.org/b/875812345680 and extract line
        coverage metrics for file chrome/browser/ui/color/color_mixer.cc.
    assert:
      - type: contains
        value: "inspect_coverage_build.py"
      - type: contains
        value: "color_mixer.cc"
      - type: icontains-any
        value:
          - "75.00%"
          - "Line Coverage"
          - "75%"
      - type: icontains-any
        value:
          - "Uncovered Lines"
          - "12-15"
          - "20-25"
