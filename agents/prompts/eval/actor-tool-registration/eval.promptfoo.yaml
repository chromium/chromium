description: Verify registration of an existing Actor ToolRequest in actor::ToolRegistry.
owner: nandrosz@chromium.org
prompts:
  - 'file://prompt.md'
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - actor-tool-registration
tests:
  - assert:
    - type: python
      value: file://../../../testing/asserts/check_changes.py:check_files_changed
      config:
        files:
          - chrome/browser/actor/tools/registry/tool_definition.h
          - chrome/browser/actor/tools/perform_search_tool_request.h
          - chrome/browser/actor/tools/perform_search_tool_request.cc
          - chrome/browser/actor/tools/registry/tool_registry_unittest.cc
    - type: python
      value: file://../../../testing/asserts/check_changes.py:check_file_content
      config:
        files:
          - path: chrome/browser/actor/tools/registry/tool_definition.h
            present:
              - 'kPerformSearch'
              - 'kMaxValue = kPerformSearch'
          - path: chrome/browser/actor/tools/perform_search_tool_request.h
            present:
              - 'static constexpr std::string_view kModelFacingName = "perform_search";'
              - 'static constexpr std::string_view kQueryParam = "query";'
              - 'static std::optional<ToolDefinition> GetToolDefinition();'
              - '#include <optional>'
              - '#include <string_view>'
            absent:
              - '#include "chrome/browser/actor/tools/registry/tool_definition.h"'
              - 'struct ToolDefinition;'
              - '#include <functional>'
              - 'std::reference_wrapper'
              - 'new_tab'
          - path: chrome/browser/actor/tools/perform_search_tool_request.cc
            present:
              - '#include "chrome/browser/actor/tools/registry/tool_definition.h"'
              - '#include "chrome/browser/actor/tools/registry/tool_definition_builder.h"'
              - 'ToolDefinitionBuilder(ToolId::kPerformSearch'
              - '.SetToolParameterSchema(ToolSchemaBuilder().AddStringProperty('
              - 'kQueryParam'
              - 'Search using the default search engine.'
              - 'The terms to search for.'
              - '.Build()'
            absent:
              - 'base::NoDestructor'
              - '#include <functional>'
              - 'std::reference_wrapper'
              - 'new_tab'
              - 'Behavior'
              - 'Verbalization'
          - path: chrome/browser/actor/tools/registry/tool_registry_unittest.cc
            present:
              - '#include "chrome/browser/actor/tools/perform_search_tool_request.h"'
              - 'TEST(ToolRegistryTest, PerformSearchToolDefinition)'
              - 'TEST(ToolRegistryTest, GetAllToolsContainsPerformSearchTool)'
              - 'PerformSearchToolRequest::GetToolDefinition()'
              - 'ToolId::kPerformSearch'
              - 'PerformSearchToolRequest::kModelFacingName'
              - 'HasParamOfType(PerformSearchToolRequest::kQueryParam, "string")'
              - 'RequiresParam(PerformSearchToolRequest::kQueryParam)'
              - 'GetAllTools()'
    - type: llm-rubric
      value: |
        You are an expert code reviewer evaluating changes that register an existing
        Actor tool (`PerformSearchToolRequest`) in `actor::ToolRegistry`.

        Evaluate whether the code changes satisfy the following criteria:

        1. **Strict 4-File Scope**:
           - Only the following 4 files are modified:
             `chrome/browser/actor/tools/registry/tool_definition.h`,
             `chrome/browser/actor/tools/perform_search_tool_request.h`,
             `chrome/browser/actor/tools/perform_search_tool_request.cc`, and
             `chrome/browser/actor/tools/registry/tool_registry_unittest.cc`.
           - No changes to `BUILD.gn`, `tool_registry.h`, or `tool_registry.cc`.
           - No standalone `perform_search_tool_request_unittest.cc` was created.

        2. **Tool Definition Enum**:
           - `ToolId::kPerformSearch` is appended to `enum class ToolId` in `tool_definition.h`.
           - `kMaxValue` is updated to `kPerformSearch`.

        3. **Header Declaration**:
           - Declares `kModelFacingName = "perform_search"` and `kQueryParam = "query"`.
           - Declares `static std::optional<ToolDefinition> GetToolDefinition();` returning by value.
           - Does NOT re-include `tool_definition.h` or forward-declare `struct ToolDefinition`.
           - Does NOT include `<functional>` or use `reference_wrapper`.
           - Does NOT expose the legacy `new_tab` parameter.

        4. **Implementation & Schema Building**:
           - Includes `tool_definition.h` and `tool_definition_builder.h`.
           - Defines `GetToolDefinition()` returning `ToolDefinitionBuilder(ToolId::kPerformSearch, kModelFacingName, ...)`
             with `.SetToolParameterSchema(ToolSchemaBuilder().AddStringProperty(kQueryParam, ...)).Build()` directly by value.
           - Uses verbatim descriptions matching `tool_controller.cc`:
             "Search using the default search engine." and "The terms to search for.".
           - Does NOT cache in `base::NoDestructor` or use `Behavior`/`Verbalization`.

        5. **Unit Tests**:
           - Adds `TEST(ToolRegistryTest, PerformSearchToolDefinition)` and
             `TEST(ToolRegistryTest, GetAllToolsContainsPerformSearchTool)` in `tool_registry_unittest.cc`.
           - Asserts `GetToolDefinition()` has value, checks `id` and `name`, asserts `HasParamOfType` and `RequiresParam` for `kQueryParam`.
           - Asserts `GetAllTools()` contains `ToolId::kPerformSearch`.

        ### Response
        Using the evaluation criteria above, grade the generated output on a
        scale of 0.0 to 1.0, where 1.0 is a perfect implementation and 0.0 is
        a completely broken implementation. Explain the reason for your score.
      provider: python:agents/testing/gemini_provider.py
      threshold: 0.7
    metadata:
      tags:
        - stable
