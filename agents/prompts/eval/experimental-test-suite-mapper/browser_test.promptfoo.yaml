description: Verify the experimental-test-suite-mapper skill correctly maps browser tests.
owner: pasthana@
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      extensions: []
      skills:
        - experimental-test-suite-mapper
tests:
  - vars:
      query: "Find the parent executable test suites for the C++ browser test file `chrome/browser/ui/webui_browser/webui_browser_browsertest.cc` using the experimental-test-suite-mapper skill."
    assert:
      - type: contains
        value: "browser_tests"
