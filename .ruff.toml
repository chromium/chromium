line-length = 80
extend-exclude = [
    "*_pb2.py",
    "third_party",
    # Legacy Python 2 scripts (also excluded in subdirectory .ruff.toml files).
    "chromecast/tools/trace.py",
    "chromecast/tools/tracinglib.py",
    "docs/enterprise/extension_query_py2.py",
    "infra/scripts/sizes.py",
]

[format]
indent-style = "space"
quote-style = "preserve"

[lint]
# Enable the legacy Ruff 0.15 default ruleset.
select = ["E4", "E7", "E9", "F"]
unfixable = ["F401"]
