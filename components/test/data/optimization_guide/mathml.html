<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <math display="block">
    <mfrac>
      <mrow>
        <mi>x</mi>
      </mrow>
      <mrow>
        <mi>y</mi>
        <mo>+</mo>
        <mn>1</mn>
      </mrow>
    </mfrac>
  </math>
  <math>
    <mtable>
      <mtr>
        <mtd><mn>1</mn></mtd>
      </mtr>
    </mtable>
  </math>
  <a href="https://example.com/equation">
    <math>
      <mrow>
        <mi>z</mi>
        <mo>=</mo>
        <mn>0</mn>
      </mrow>
    </math>
  </a>
  <!-- Invisible formulas are omitted and do not generate a content node. -->
  <math style="visibility: hidden">
    <mrow>
      <mi>q</mi>
      <mo>=</mo>
      <mn>9</mn>
    </mrow>
  </math>
</body>
</html>
