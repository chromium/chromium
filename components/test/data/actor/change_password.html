<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0">
    <title>Change Password Page</title>
  </head>
  <body>
    <!-- method=dialog prevents the form from navigating the page -->
    <form id="form" method="dialog">
      <input type="password" name="current_password" id="current_password"
             aria-label="current-password" autocomplete="current-password">
      <input type="password" name="new_password" id="new_password"
             aria-label="new-password" autocomplete="new-password">
      <input type="password" name="confirm_password" id="confirm_password"
             aria-label="confirm-password" autocomplete="new-password">
      <input type="submit" id="submit">
    </form>
    <script>
      let input_event_log = [];
      let log_handler = e => {
        input_event_log.push({ type: e.type, time: e.timeStamp });
      };

      document.getElementById('current_password')
          .addEventListener('change', log_handler);
      document.getElementById('current_password')
          .addEventListener('input', log_handler);
      document.getElementById('current_password')
          .addEventListener('keydown', log_handler);
      document.getElementById('current_password')
          .addEventListener('keyup', log_handler);
      document.getElementById('submit').addEventListener('click', log_handler);

      // Filtering out unexpected 'change' events. Change events depend on focus
      // which causes browser_tests to flake.
      function getStableEvents() {
        return input_event_log.filter((event) => {
          return event.type !== 'change';
        });
      }

      function getStableEventLog() {
        return getStableEvents().map(event => event.type).join(',');
      }
    </script>
  </body>
</html>
