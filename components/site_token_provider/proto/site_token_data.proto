syntax = "proto3";

package site_token_provider.proto;

option optimize_for = LITE_RUNTIME;

message SiteToken {
  string domain = 1;
  string token = 2;
}

message GeneratePlatformSiteTokensRequest {}

message GeneratePlatformSiteTokensResponse {
  repeated SiteToken site_tokens = 1;
}
