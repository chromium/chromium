syntax = "proto2";

option java_multiple_files = true;
option java_package = "org.chromium.components.sync.protocol";
option optimize_for = LITE_RUNTIME;

package sync_pb;

// LINT.IfChange(EntitySuppressionKey)
message EntitySuppressionKey {
  message Attribute {
    optional string name = 1;
    optional bytes value_hash = 2;
  }

  // The entity type (e.g. "passport").
  optional string entity_type_name = 1;

  // The set of attributes identifying the entity instance.
  repeated Attribute attributes = 2;
}
// LINT.ThenChange(//components/autofill/core/browser/webdata/personal_context/personal_context_entity_metadata_sync_util.cc:TrimEntitySuppressionKey)

// LINT.IfChange(AutofillEntitySuppressionSpecifics)
message AutofillEntitySuppressionSpecifics {
  // Random UUIDv4 identifying this record.
  optional string guid = 1;

  // Only set by older clients, which sync full hashes instead of
  // `entity_suppression_hash`.
  optional EntitySuppressionKey entity_suppression_key = 2 [deprecated = true];

  reserved 3;
  reserved "schema_version";

  // The time the metadata entry was created.
  optional int64 creation_time_windows_epoch_micros = 4;

  // The leading bits of a SHA-256 hash of the entity type and the merge
  // constraint values of the suppressed entity. Deprecated in M159; replaced by
  // `suppression`.
  optional uint32 entity_suppression_hash = 5 [deprecated = true];

  message Suppression {
    // The leading bits of a SHA-256 hash of the entity type and the merge
    // constraint values of the suppressed entity.
    optional uint32 hash = 1;
  }

  message Confirmation {
    // The leading bits of a SHA-256 hash of the entity type and the attribute
    // types and values of the user-confirmed entity.
    optional uint32 hash = 1;
  }

  oneof metadata_entry {
    // Metadata for an entity whose suggestions were suppressed by the user.
    // Replaces `entity_suppression_hash` in M159.
    Suppression suppression = 6;

    // Metadata for an entity whose extracted values were confirmed by the user.
    Confirmation confirmation = 7;
  }
}
// LINT.ThenChange(//components/autofill/core/browser/webdata/personal_context/personal_context_entity_metadata_sync_util.cc:TrimAutofillEntitySuppressionSpecificsDataForCaching)
