syntax = "proto2";

option java_multiple_files = true;
option java_package = "org.chromium.components.sync.protocol";

option optimize_for = LITE_RUNTIME;

package sync_pb;

import "components/sync/protocol/agile_encryption_keys.proto";

// Specifics for ENCRYPTED_TAB_CONTEXT_CONTAINER.
message EncryptedTabContextContainerSpecifics {
  optional string uuid = 1;
  optional AgileSymmetricKeySet encryption_key = 2;

  // Present only for ephemeral containers, where `encryption_key` is not
  // uploaded to the Sync server. Contains a serialized
  // `TabContextContainerAccessToken` proto wrapping the container's encryption
  // key using a short-lived server-minted ephemeral key.
  optional bytes container_access_token = 3;
}
