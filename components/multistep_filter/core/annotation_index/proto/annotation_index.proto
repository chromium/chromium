syntax = "proto3";

package multistep_filter;

option java_package = "org.chromium.components.multistep_filter.proto";
option java_outer_classname = "AnnotationIndexProto";

option optimize_for = LITE_RUNTIME;

// DO NOT EDIT THIS FILE DIRECTLY!
//
// This file is generated in g3 and then synced to Chrome. Instead, please refer
// to go/chrome_annotation_index_sync (Google-internal link), and then changes
// will be synced with Chrome automatically.

// Response containing attributes extracted from the provided source.
// Note: The domain field has been removed. The domain should now be derived
// from the source URL provided in the request.
message ExtractTaskAttributesResponse {
  reserved 1;
  reserved "domain";

  // The universal task task type derived from the source (e.g.,
  // "SEARCH_FLIGHTS").
  string task_type = 2;

  // A list of key-value attributes parsed from the source.
  repeated TaskAttribute task_attributes = 3;
}

// A domain-agnostic attribute extracted from a URL.
message TaskAttribute {
  // The normalized attribute key (e.g., "PRICE_MIN").
  string key = 1;

  // The normalized attribute value (e.g., "150").
  string value = 2;
}

// Response containing the tasks supported by a specific domain.
message GetSupportedTasksResponse {
  // The list of task data supported by the domain.
  repeated SupportedTask supported_tasks = 1;
}

// Defines a task that is supported by a domain.
message SupportedTask {
  // The universal task type derived from the source (e.g.,
  // "SEARCH_FLIGHTS").
  string task_type = 1;
}

// A potential target and data combination for the server to evaluate.
message ExecutionCandidate {
  // The candidate ID provided by the client.
  string candidate_id = 1;

  // The task type to apply (e.g., "SEARCH_FLIGHTS").
  string task_type = 2;

  // The list of task attributes to apply if this candidate is chosen.
  repeated TaskAttribute task_attributes = 3;
}

// Contains details for a single task execution strategy.
message TaskExecutionStrategy {
  // The ID echoing the candidate_id from the ExecutionCandidate request.
  string candidate_id = 1;

  // Metadata for the filters that were successfully applied to the URL for this
  // task type.
  repeated AppliedFilterUIString applied_filters = 2;

  // The execution strategy the client should use to actuate the task.
  TaskExecution execution = 3;

  // UI strings to display to the user.
  SuggestionMessage suggestion_message = 4;
}

// UI strings to display to the user for the suggestion.
message SuggestionMessage {
  // The short cue string to display in the Omnibox (e.g., "Find Stays?").
  string short_text = 1;

  // The detailed cue string to display (e.g., "Find Stays? New York • Dec 11-14
  // • 2 adults").
  string detailed_text = 2;
}

// Response containing all valid strategies generated from the request
// candidates.
message GetTaskExecutionStrategiesResponse {
  // A list of valid execution strategies, one for each candidate that could be
  // successfully applied.
  repeated TaskExecutionStrategy execution_strategies = 1;
}

// Defines how the client should execute the suggested task.
message TaskExecution {
  oneof strategy {
    UrlNavigation url_navigation = 1;
  }
}

// Execution strategy for navigating to a constructed URL.
message UrlNavigation {
  // The final URL constructed with the applied attributes.
  string navigation_url = 1;
}

// UI representation of an applied filter.
message AppliedFilterUIString {
  // The normalized key of the filter (e.g., "PRICE_MIN").
  string key = 1;

  // User-visible label for the filter (e.g., "Minimum Price").
  string label = 2;

  // The resolved value of the filter (e.g., "2" or "LGA").
  string value = 3;
}
