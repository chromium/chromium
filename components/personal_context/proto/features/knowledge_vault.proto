edition = "2024";

package personal_context.proto;

option optimize_for = LITE_RUNTIME;

// Request for the Knowledge Vault feature. The knowledge vault is a per-user
// vault of markdown notes that the service builds from content the user saves,
// and answers questions from with citations to its notes.
message KnowledgeVaultRequest {
  // The operation to run on the user's vault.
  oneof operation {
    // Saves content into the vault.
    KnowledgeVaultCaptureRequest capture = 1;

    // Answers a question from the vault's notes.
    KnowledgeVaultAskRequest ask = 2;

    // Reports whether a capture has been organized into notes.
    KnowledgeVaultCaptureStatusRequest capture_status = 3;

    // Lists the entries of a vault directory.
    KnowledgeVaultListFilesRequest list_files = 4;

    // Reads a vault file.
    KnowledgeVaultReadFileRequest read_file = 5;

    // Searches the vault's notes.
    KnowledgeVaultSearchRequest search = 6;
  }
}

// Response for the Knowledge Vault feature. Sets the field that matches the
// request's operation.
message KnowledgeVaultResponse {
  oneof result {
    KnowledgeVaultCaptureResponse capture = 1;
    KnowledgeVaultAskResponse ask = 2;
    KnowledgeVaultCaptureStatusResponse capture_status = 3;
    KnowledgeVaultListFilesResponse list_files = 4;
    KnowledgeVaultReadFileResponse read_file = 5;
    KnowledgeVaultSearchResponse search = 6;
  }
}

// Saves content into the vault. The service stores the content right away and
// organizes it into notes in the background, which takes minutes; follow it
// with `KnowledgeVaultCaptureStatusRequest`.
message KnowledgeVaultCaptureRequest {
  // The body of the saved content, as markdown or plain text.
  string content = 1;

  // The title of the saved page or note.
  string title = 2;

  // The URL of the saved page. Empty when the content is not a page.
  string source_url = 3;
}

message KnowledgeVaultCaptureResponse {
  // Identifies the capture in `KnowledgeVaultCaptureStatusRequest`.
  string capture_id = 1;
}

message KnowledgeVaultCaptureStatusRequest {
  // The `capture_id` from `KnowledgeVaultCaptureResponse`.
  string capture_id = 1;
}

message KnowledgeVaultCaptureStatusResponse {
  enum State {
    STATE_UNSPECIFIED = 0;

    // Stored and not yet organized into notes.
    STATE_PENDING = 1;

    // Organized into notes.
    STATE_DONE = 2;

    // Organizing the capture into notes failed.
    STATE_FAILED = 3;
  }

  State state = 1;

  // Vault-relative paths of the notes created or updated from the capture. Set
  // when `state` is `STATE_DONE`.
  repeated string note_paths = 2;

  // Diagnostic message describing why background organization failed. Set when
  // `state` is `STATE_FAILED`.
  string error_message = 3;
}

message KnowledgeVaultAskRequest {
  // The user's question.
  string question = 1;
}

message KnowledgeVaultAskResponse {
  // The answer in markdown. Cites the notes it draws on inline as `[[slug]]`
  // links.
  string answer = 1;
}

message KnowledgeVaultListFilesRequest {
  // Vault-relative path of the directory to list, for example "notes". Empty
  // lists the vault root. Must not contain ".." or a leading "/".
  string directory = 1;
}

message KnowledgeVaultListFilesResponse {
  // The entries directly under the requested directory.
  repeated KnowledgeVaultFileEntry entries = 1;
}

message KnowledgeVaultFileEntry {
  // Vault-relative path of the entry.
  string path = 1;

  // Whether the entry is a directory.
  bool is_directory = 2;

  // Size of the file in bytes. Zero for directories.
  int64 size_bytes = 3;
}

message KnowledgeVaultReadFileRequest {
  // Vault-relative path of the file to read. Must not contain ".." or a
  // leading "/".
  string path = 1;
}

message KnowledgeVaultReadFileResponse {
  // The text content of the file.
  string content = 1;
}

message KnowledgeVaultSearchRequest {
  // The text to search the vault's notes for.
  string query = 1;

  // The maximum number of results to return. The service picks a default when
  // non-positive.
  int32 max_results = 2;
}

message KnowledgeVaultSearchResponse {
  // The matching notes, best match first.
  repeated KnowledgeVaultSearchResult results = 1;
}

message KnowledgeVaultSearchResult {
  // Vault-relative path of the matching note.
  string path = 1;

  // The text in the note that matches the query.
  string snippet = 2;
}
