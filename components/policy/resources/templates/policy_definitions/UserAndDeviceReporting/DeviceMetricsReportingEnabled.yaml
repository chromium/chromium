arc_support: This policy also controls Android usage and diagnostic data collection.
caption: Enable metrics reporting
desc: |-
  Setting the policy to Enabled has <ph name="PRODUCT_OS_NAME">$2<ex>Google ChromeOS</ex></ph> report usage metrics and diagnostic data, including crash reports, back to Google. Setting the policy to Disabled turns off metrics and diagnostic data reporting.

  For managed devices, leaving the policy unset keeps metrics and diagnostic data reporting enabled by default.

  For unmanaged devices, this policy does not apply, and users can choose the metrics and diagnostic data reporting behavior during device setup or later through settings.
default: null
device_only: true
example_value: true
features:
  dynamic_refresh: true
items:
- caption: Always send metrics to Google
  value: true
- caption: Never send metrics to Google
  value: false
- caption: Send metrics to Google on managed devices, or allow the user to decide on unmanaged devices
  value: null
owners:
- chrome-metrics-team@google.com
- cros-reporting-eng@google.com
- lbaraz@chromium.org
- zmin@chromium.org
schema:
  type: boolean
supported_on:
- chrome_os:14-
tags:
- admin-sharing
- google-sharing
type: main
generate_device_proto: False
