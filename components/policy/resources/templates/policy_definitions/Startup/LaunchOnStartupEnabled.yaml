caption: Start <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> with <ph name="MS_WIN_NAME">Microsoft® Windows®</ph>
default: null
desc: |-
  Controls whether <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> opens a browser window when the user signs in to <ph name="MS_WIN_NAME">Microsoft® Windows®</ph>.

  <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> has a "Start <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> with <ph name="MS_WIN_NAME">Microsoft® Windows®</ph>" setting that registers it to launch when the user signs in, so the browser is ready right away. Users may also be shown prompts suggesting they change this setting.

  Setting the policy to Enabled, <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> launches and opens a browser window when the user signs in. Users can't change the setting and aren't shown prompts to change it.

  Setting the policy to Disabled, <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> doesn't launch when the user signs in. Users can't change the setting and aren't shown prompts to change it.

  Not setting the policy, users can change the setting.

  This policy has no effect on versions of <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> where the "Start <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> with <ph name="MS_WIN_NAME">Microsoft® Windows®</ph>" setting is not available.
example_value: true
features:
  can_be_recommended: true
  dynamic_refresh: true
  per_profile: false
items:
- caption: Open <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> when the user signs in to <ph name="MS_WIN_NAME">Microsoft® Windows®</ph>
  value: true
- caption: Don't open <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> when the user signs in to <ph name="MS_WIN_NAME">Microsoft® Windows®</ph>
  value: false
- caption: Allow the user to decide
  value: null
