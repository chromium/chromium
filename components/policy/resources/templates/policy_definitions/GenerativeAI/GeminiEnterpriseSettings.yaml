caption: Configure <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> settings (BETA)

desc: |-
  Configures the connection settings for <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> in <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph>.

  To configure <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph>, administrators must provide either:
  * The <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> web application URL (<ph name="URL">url</ph>), OR
  * All three legacy parameters together: <ph name="PROJECT_ID">project_id</ph>, <ph name="APP_ID">app_id</ph>, and <ph name="LOCATION">location</ph>. Specifying only a partial subset of these three parameters without a URL will cause the policy to be rejected.

  If both the <ph name="URL">url</ph> parameter and the legacy parameters are configured, the <ph name="URL">url</ph> parameter takes precedence.

  If this policy is set, <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> will be configured for users signed in with a managed account or managed browser.

  If this policy is unset, <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> will not be configured.

  Note that this policy does not control the general <ph name="GOOGLE_GEMINI_PRODUCT_NAME">Gemini</ph> integration, which can be controlled by the <ph name="GEMINI_SETTINGS_POLICY_NAME">GeminiSettings</ph> policy.

example_value:
  url: "https://vertexaisearch.cloud.google.com/home/cid/12345678-1234-1234-1234-123456789abc"
  project_id: "acme-project"
  app_id: "acme-corp-v1"
  location: "global"

future_on:
- chrome.*
- chrome_os

features:
  dynamic_refresh: true
  per_profile: true

type: dict

schema:
  type: object
  properties:
    url:
      type: string
      pattern: '^https:\/\/[a-zA-Z0-9.-]+(\/.*)?$'
      description: The web application URL of the <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> instance for this organization.
    project_id:
      type: string
      pattern: '^[a-z0-9-]{1,30}$'
      description: The ID or number of the <ph name="GOOGLE_CLOUD_PRODUCT_NAME">Google Cloud</ph> project corresponding to the <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> instance to be enabled. Learn more about project IDs at https://docs.cloud.google.com/resource-manager/docs/creating-managing-projects.
    app_id:
      type: string
      pattern: '^[a-z0-9][a-z0-9-_]{0,62}$'
      description: The unique identifier of the <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> engine. The format must be 1-63 characters matching the pattern [a-z0-9][a-z0-9-_]*. Learn more at https://docs.cloud.google.com/gemini/enterprise/docs/reference/rest/v1/projects.locations.collections.engines#Engine.
    location:
      type: string
      pattern: '^[a-z]([a-z0-9-]{0,48}[a-z0-9])?$'
      description: The multi-region or location of the <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> app. Learn more about <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> location at https://docs.cloud.google.com/gemini/enterprise/docs/locations.

tags:
- google-sharing
