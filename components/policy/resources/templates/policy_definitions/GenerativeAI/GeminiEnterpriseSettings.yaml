caption: Configure <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> settings (BETA)

desc: |-
  Configures the connection settings for <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> in <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph>.

  This policy is being replaced by the <ph name="GEMINI_ENTERPRISE_URL_POLICY_NAME">GeminiEnterpriseUrl</ph> policy. If both are set, <ph name="GEMINI_ENTERPRISE_URL_POLICY_NAME">GeminiEnterpriseUrl</ph> takes precedence.

  The policy configures the <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> web application URL via <ph name="GEMINI_ENTERPRISE_SETTINGS_URL_POLICY_VALUE">url</ph>, which must be a valid URL that uses the https scheme, points to a <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> domain, and doesn't include a username or password. If it doesn't meet these requirements, the policy is ignored and <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> is left unconfigured.

  If this policy is set, <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> will be configured for users signed in with a managed account or managed browser.

  If this policy is unset, <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> will not be configured.

  Note that this policy does not control the general <ph name="GOOGLE_GEMINI_PRODUCT_NAME">Gemini</ph> integration, which can be controlled by the <ph name="GEMINI_SETTINGS_POLICY_NAME">GeminiSettings</ph> policy.

example_value:
  url: "https://vertexaisearch.cloud.google.com/home/cid/12345678-1234-1234-1234-123456789abc"

future_on:
- chrome.*
- chrome_os

features:
  dynamic_refresh: false
  per_profile: true

type: dict

schema:
  type: object
  properties:
    url:
      type: string
      description: The web application URL of the <ph name="GEMINI_ENTERPRISE_PRODUCT_NAME">Gemini Enterprise</ph> instance for this organization. Must be a valid https URL.

tags:
- google-sharing
