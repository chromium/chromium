caption: List of URL patterns for which <ph name="CHROME_DEVTOOLS_NAME">Chrome DevTools</ph> are blocked
desc: |-
  This policy can be used to block <ph name="CHROME_DEVTOOLS_NAME">Chrome DevTools</ph> on specific URLs. For information on the URL format, see https://support.google.com/chrome/a?p=url_blocklist_filter_format.

  <ph name="CHROME_DEVTOOLS_NAME">Chrome DevTools</ph> availability is evaluated at the target level. URL patterns are matched against the URL of each target being inspected (such as the main frame of a page, an embedded subframe, an extension, or a web application). The resulting behavior depends on whether the <ph name="DEVELOPER_TOOLS_AVAILABILITY_ALLOWLIST_POLICY_NAME">DeveloperToolsAvailabilityAllowlist</ph> policy is also set.

  If this policy is set and <ph name="DEVELOPER_TOOLS_AVAILABILITY_ALLOWLIST_POLICY_NAME">DeveloperToolsAvailabilityAllowlist</ph> is not, a target's URL matching a pattern on this blocklist will block <ph name="CHROME_DEVTOOLS_NAME">Chrome DevTools</ph> for that target (for example, a subframe whose URL matches this blocklist cannot be inspected, but the main page remains inspectable if its URL is not blocklisted). If a target's URL does not match any pattern, the availability is determined by the <ph name="DEVELOPER_TOOLS_AVAILABILITY_POLICY_NAME">DeveloperToolsAvailability</ph> policy.

  If both this and the <ph name="DEVELOPER_TOOLS_AVAILABILITY_ALLOWLIST_POLICY_NAME">DeveloperToolsAvailabilityAllowlist</ph> policies are set, the allowlist takes precedence. If a target's URL matches a pattern on the allowlist, it will be allowed, even if it also matches a pattern in this blocklist. If a target's URL matches a pattern on this blocklist (but not the allowlist), it will be blocked. If a target's URL matches neither, the <ph name="DEVELOPER_TOOLS_AVAILABILITY_POLICY_NAME">DeveloperToolsAvailability</ph> policy will be used as a fallback.

  If this policy is not set, the availability of <ph name="CHROME_DEVTOOLS_NAME">Chrome DevTools</ph> is determined by the <ph name="DEVELOPER_TOOLS_AVAILABILITY_ALLOWLIST_POLICY_NAME">DeveloperToolsAvailabilityAllowlist</ph> and <ph name="DEVELOPER_TOOLS_AVAILABILITY_POLICY_NAME">DeveloperToolsAvailability</ph> policies.

  This policy is limited to 1,000 entries.

example_value:
- 'https://example.com'
- example.com
- https://ssl.server.com
- hosting.com/bad_path
- https://server:8080/path
- .exact.hostname.com
- '*'
- file://*
supported_on:
- chrome.*:147-
- chrome_os:147-
- android:154-
features:
  dynamic_refresh: true
  per_profile: true
owners:
- file://extensions/OWNERS
- mickaczmarczyk@google.com
schema:
  items:
    type: string
  type: array
tags:
- filtering
type: list