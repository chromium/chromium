caption: Control <ph name="ALR_FEATURE_NAME">Accept-Language Reduction</ph>
deprecated: true

desc: |-
  This policy is deprecated and has no effect starting with M157 because the <ph name="ALR_FEATURE_NAME">Accept-Language Reduction</ph> feature has been discontinued. The <ph name="AL_HEADER_NAME">Accept-Language</ph> HTTP request header and the JavaScript <ph name="JS_GETTER_NAME">navigator.languages</ph> getter continue to provide the full configured language list.

  Before M157, the <ph name="AL_HEADER_NAME">Accept-Language</ph> HTTP request header and the JavaScript <ph name="JS_GETTER_NAME">navigator.languages</ph> getter were planned for reduction for privacy reasons.
  To facilitate testing and ensure compatibility, this policy allowed you to enable or disable the <ph name="ALR_FEATURE_NAME">Accept-Language Reduction</ph> feature.

  If this policy was set to enabled or left unset, <ph name="ALR_FEATURE_NAME">Accept-Language Reduction</ph> was applied through field trials.
  If this policy was set to disabled, field trials were not able to activate <ph name="ALR_FEATURE_NAME">Accept-Language Reduction</ph>.

  For more information about this feature, please visit: https://github.com/explainers-by-googlers/reduce-accept-language.

  NOTE: Only newly-started renderer processes will reflect changes to this policy while the browser is running.

