caption: Enable Suggested Content
default_for_enterprise_users: false
deprecated: true
desc: |-
  This policy is deprecated and has no effect starting with M159 because the Suggested Content feature has been removed.

  Before M159, this feature enabled suggestions for new content to explore, including apps, webpages, and more.
  If this policy was set to True, then suggestions for new content to explore were enabled.
  If this policy was set to False, then suggestions for new content to explore were disabled.
  If this policy was left unset, then suggestions for new content to explore were disabled for managed users and enabled for other users.
default: true
example_value: false
features:
  can_be_recommended: true
  dynamic_refresh: true
  per_profile: true
items:
- caption: Enable suggested content
  value: true
- caption: Disable suggested content
  value: false
owners:
- chrome-knowledge-eng@google.com
schema:
  type: boolean
supported_on:
- chrome_os:85-158
tags: []
type: main
