caption: Allows users to be shown the app rating promo on <ph name="IOS_NAME">iOS</ph> and <ph name="ANDROID_NAME">Android</ph>
desc: |-
  Controls whether the in-app rating promo can be shown to users.

  Setting the policy to Enabled or leaving it unset allows the App Store Rating promo to be shown to the user, at most once per year.

  Setting the policy to Disabled prevents the App Store Rating promo from being shown to the user.
supported_on:
- ios:110-
- android:157-
features:
  dynamic_refresh: true
  per_profile: false
type: main
schema:
  type: boolean
items:
- caption: Allow the App Store Rating promo to be displayed
  value: true
- caption: Do not allow the App Store Rating promo to be displayed
  value: false
owners:
- hiramahmood@google.com
- file://components/policy/OWNERS
default: true
example_value: false
tags: []
