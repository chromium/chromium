caption: Show input options in the shelf
desc: |-
  Setting the policy to Enabled displays the input methods selection bubble on the shelf.

  Setting the policy to Disabled hides the input methods selection bubble from the shelf.

  If left unset, the input methods selection bubble is hidden from the shelf by default. The user can choose whether to display the bubble in the Settings page.
default: null
example_value: true
