caption: Kerberos delegation server allowlist
desc: |-
  Setting the policy assigns servers that <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> may delegate to. Separate multiple server names with commas. Wildcards, <ph name="WILDCARD_VALUE">*</ph>, are allowed.

        Leaving the policy unset means <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> won't delegate user credentials, even if a server is detected as intranet.

        On <ph name="LINUX_OS_NAME">Linux</ph>, <ph name="MAC_OS_NAME">macOS</ph> and <ph name="PRODUCT_OS_NAME">$2<ex>Google ChromeOS</ex></ph>, when this policy allows delegation to a server, the system GSSAPI/Kerberos library can canonicalize its hostname into a different service principal host (for example through DNS CNAME or reverse-DNS PTR lookups). <ph name="PRODUCT_NAME">$1<ex>Google Chrome</ex></ph> then withholds delegation from that service principal unless that host is also allowed by this policy.
example_value: '*.example.com,foobar.example.com'
features:
  dynamic_refresh: true
  per_profile: false
future_on:
- fuchsia
owners:
