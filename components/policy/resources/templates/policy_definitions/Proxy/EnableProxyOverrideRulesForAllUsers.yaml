caption: Controls which managed users can set the <ph name="PROXY_OVERRIDE_RULES_POLICY_NAME">ProxyOverrideRules</ph> and <ph name="PROXY_PROVISIONING_DOMAINS_POLICY_NAME">ProxyProvisioningDomains</ph> policies.
desc:
  When this policy is set to 0 or left unset, the <ph name="PROXY_OVERRIDE_RULES_POLICY_NAME">ProxyOverrideRules</ph> and <ph name="PROXY_PROVISIONING_DOMAINS_POLICY_NAME">ProxyProvisioningDomains</ph> policies will only be applied at the user scope for affiliated users on a managed browser.

  When this policy is set to 1, the <ph name="PROXY_OVERRIDE_RULES_POLICY_NAME">ProxyOverrideRules</ph> and <ph name="PROXY_PROVISIONING_DOMAINS_POLICY_NAME">ProxyProvisioningDomains</ph> policies will be applied at the user scope, even if that user is unaffiliated.

example_value: 1
default: 0
features:
  dynamic_refresh: true
  per_profile: false
future_on:
- android
supported_on:
- chrome.*:145-
owners:
- seblalancette@chromium.org
- domfc@chromium.org
- cbe-eng@google.com
schema:
  enum:
  - 0
  - 1
  type: integer
tags:
- system-security
type: int
