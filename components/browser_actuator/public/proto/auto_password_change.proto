syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package browser_actuator;

// These mirror the internal Automated Password Change task ingress protos. Do
// not modify without updating the corresponding protos.

// Feature-specific startup parameters packed inside
// StartTaskCommand.feature_payload when StartTaskCommand.use_case is
// TASK_USE_CASE_AUTO_PASSWORD_CHANGE.
//
// Passwords and credential secrets must never be placed in this payload; they
// remain inside Chrome's PasswordManager / ActorLogin credential store on the
// actuation session.
//
// Next ID: 3
message AutoPasswordChangeTaskPayload {
  // Optional starting HTTP(S) URL for the target site's password change page
  // or origin. When omitted, the task falls back to `domain` (or a generic
  // password-change prompt if both are omitted).
  string change_password_url = 1;

  // Optional credential domain or site label (for example, "example.com") used
  // to hydrate the task title and prompt context; inferred from
  // change_password_url when omitted.
  string domain = 2;
}
