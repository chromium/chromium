edition = "2023";

package optimization_guide.proto;

import "components/optimization_guide/proto/features/common_quality_data.proto";

import "components/optimization_guide/proto/model_quality_metadata.proto";

option optimize_for = LITE_RUNTIME;
option java_package = "org.chromium.components.optimization_guide.features.proto";

option java_outer_classname = "SmartSelectionSuggestionsProto";

// DO NOT EDIT THIS FILE DIRECTLY!
//
// This file is generated in g3 and then synced to Chrome. Instead, please refer to
// http://go/chrome-mqls-onboarding (Google-internal link), and then changes will
// be synced with Chrome automatically.

message SmartSelectionSuggestionsLoggingData {
  // The feature request.
  SmartSelectionSuggestionsRequest request = 1 [features = { field_presence: EXPLICIT }];

  // The feature response.
  SmartSelectionSuggestionsResponse response = 2 [features = { field_presence: EXPLICIT }];

  ModelExecutionInfo model_execution_info = 3 [features = { field_presence: EXPLICIT }];
}

// The request from the client to MES for smart selection suggestion generation.
message SmartSelectionSuggestionsRequest {
  SmartSelectionClientCapabilities client_capabilities = 1 [features = { field_presence: EXPLICIT }];

  repeated AreaOfInterest areas_of_interest = 2;
}

// Information about the Chrome client querying MES.
message SmartSelectionClientCapabilities {
  string locale = 1 [features = { field_presence: EXPLICIT }];

  ChromePlatform platform = 2 [features = { field_presence: EXPLICIT }];

  string chrome_version = 3 [features = { field_presence: EXPLICIT }];

  repeated SmartSelectionToolWithCapabilities available_tools = 4;
}

message SmartSelectionToolWithCapabilities {
  SmartSelectionToolId tool = 1 [features = { field_presence: EXPLICIT }];

  // Encodes tool capabilities, e.g. GiC's ability to add to calendar.
  repeated string capabilities = 2;
}

// A screen region that the user has selected.
message AreaOfInterest {
  // Raw image bytes - will generally be larger than the user's selected area.
  bytes image_bytes = 1 [features = { field_presence: EXPLICIT }];

  // The mime type of the image (e.g., "image/png", "image/jpeg", "image/webp").
  string mime_type = 2 [features = { field_presence: EXPLICIT }];

  // The coordinates of the rectangle selected by the user.
  // Coordinates MUST be in the physical pixel space of the encoded image in
  // `image_bytes` (with (0, 0) at the top-left of `image_bytes`), rather than
  // unscaled CSS/DIP viewport pixels.
  Rectangle selection = 3 [features = { field_presence: EXPLICIT }];

  // The annotated page content of the area of interest.
  AnnotatedPageContent annotated_page_content = 4 [features = { field_presence: EXPLICIT }];
}

// A rectangle in 2D pixel coordinates with the top-left corner at (0, 0).
message Rectangle {
  int32 x = 1 [features = { field_presence: EXPLICIT }];

  int32 y = 2 [features = { field_presence: EXPLICIT }];

  int32 width = 3 [features = { field_presence: EXPLICIT }];

  int32 height = 4 [features = { field_presence: EXPLICIT }];
}

// The response from MES to the client with a list of smart selection
// suggestions.
message SmartSelectionSuggestionsResponse {
  repeated SmartSelectionSuggestion suggestions = 1;

  // Server-side latency metrics for diagnostics.
  SmartSelectionLatencyMetrics latency_metrics = 2 [features = { field_presence: EXPLICIT }];
}

// Defines a single suggestion returned to the client.
message SmartSelectionSuggestion {
  // The tool that is invoked to process the suggestion when the user clicks it.
  SmartSelectionToolId tool = 1 [features = { field_presence: EXPLICIT }];

  // The (already localized) suggestion shown in the suggestions UI.
  string label = 2 [features = { field_presence: EXPLICIT }];
}

// Server-side latency breakdown for SmartSelectionSuggestions execution.
//
// The durations form a hierarchy where parent durations subsume child
// durations (plus any other overhead at each level):
//
//   mes_total_ms                         (total MES request handling)
//   |-- mes_image_preprocessing_ms       (MES image crop/dim/highlight)
//   +-- model_execution_ms               (backend GenerateContent RPC)
//       |-- model_content_processing_ms  (multimodal tokenization)
//       |-- model_prefill_queue_wait_ms  (prefill queue wait)
//       |-- model_prefill_ms             (prompt prefill)
//       |-- model_decode_queue_wait_ms   (prefill-to-decode queue + KV
//       transfer)
//       +-- model_decode_ms              (output token decoding)
message SmartSelectionLatencyMetrics {
  int64 mes_total_ms = 1 [features = { field_presence: EXPLICIT }];

  int64 model_execution_ms = 2 [features = { field_presence: EXPLICIT }];

  int64 mes_image_preprocessing_ms = 3 [features = { field_presence: EXPLICIT }];

  int64 model_content_processing_ms = 4 [features = { field_presence: EXPLICIT }];

  int64 model_prefill_queue_wait_ms = 5 [features = { field_presence: EXPLICIT }];

  int64 model_prefill_ms = 6 [features = { field_presence: EXPLICIT }];

  int64 model_decode_ms = 7 [features = { field_presence: EXPLICIT }];

  int64 model_decode_queue_wait_ms = 8 [features = { field_presence: EXPLICIT }];
}

enum SmartSelectionToolId {
  SMART_SELECTION_TOOL_UNSPECIFIED = 0;

  SMART_SELECTION_TOOL_GEMINI_IN_CHROME = 1;

  SMART_SELECTION_TOOL_GOOGLE_LENS = 2;

  SMART_SELECTION_TOOL_GOOGLE_SEARCH = 3;

  SMART_SELECTION_TOOL_QUICK_ANSWERS = 4;
}
