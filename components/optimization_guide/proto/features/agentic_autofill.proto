// Top-level message for Agentic Autofill data.
// Design doc: go/agentic-autofill-mqls.
message AgenticAutofillLoggingData {
  AgenticAutofillQuality quality = 1 [features = { field_presence: EXPLICIT }];
}

// End-to-end quality metrics for a single Agentic Autofill session on one tab.
//
// A session starts when an actor task becomes active on the tab and ends on the
// first navigation after that task has finished, or when the tab is closed. It
// contains both invocations of `actor::AttemptFormFillingTool` and external
// events (page lifecycle, user edits, direct agent typing, and form
// submissions).
message AgenticAutofillQuality {
  // Chronological sequence of events occurring during the session.
  repeated Event events = 1;

  // A discrete event in the session.
  message Event {
    oneof event {
      // Metrics for an `actor::AttemptFormFillingTool` invocation.
      AttemptFormFillingToolCall attempt_form_filling_tool_call = 3;

      // Metrics for an event in the session other than an
      // `actor::AttemptFormFillingTool` invocation (session/task lifecycle
      // transitions, form submissions, user field edits, or direct agent typing
      // via `TypeAction`).
      ExternalEvent external_event = 4;
    }

    // Event timestamp in milliseconds since session start.
    int64 timestamp_ms = 1 [features = { field_presence: EXPLICIT }];

    // Snapshot of the forms and field types recognized by Autofill when this
    // event occurred. Populated with all cached forms on the page for session
    // lifecycle events and tool invocations, and with the affected form for
    // single-form events. At most one entry per `form_session_identifier`.
    repeated FormStructure forms = 2;
  }

  // Snapshot of a form and its fields as classified by Autofill at the time of
  // an event.
  message FormStructure {
    // Identifier of the form.
    FormIdentifier form_identifier = 1 [features = { field_presence: EXPLICIT }];

    // Form types recognized in this form (`autofill::FormType`; a single
    // `<form>` can contain multiple types, e.g. address and credit card
    // sections).
    repeated int32 form_types = 2;

    // All fields of the form in DOM order, including unrecognized fields.
    repeated FieldMetadata fields = 3;
  }

  // Identifies a specific form instance within the session.
  message FormIdentifier {
    // 64-bit `autofill::FormSignature` of the form.
    uint64 form_signature = 1 [features = { field_presence: EXPLICIT }];

    // Session-local identifier of the form instance
    // (`autofill::autofill_metrics::FormGlobalIdToHash64Bit`).
    uint64 form_session_identifier = 2 [features = { field_presence: EXPLICIT }];
  }

  // Metadata for a single field in a `FormStructure`.
  message FieldMetadata {
    // Identifier of the field.
    FieldIdentifier field_identifier = 1 [features = { field_presence: EXPLICIT }];

    // Whether Autofill considers the field fillable
    // (`autofill::AutofillField::IsFieldFillable()` with a recognized address
    // or payment `autofill::FieldType`).
    bool is_autofillable = 2 [features = { field_presence: EXPLICIT }];

    // The `autofill::FieldType` value the field was filled with, if filled.
    int32 autofilled_type = 3 [features = { field_presence: EXPLICIT }];

    // Final `autofill::FieldType` values assigned to the field
    // (`autofill::AutofillField::Type().GetTypes()`) after resolving server
    // predictions, local heuristics, `autocomplete` attributes, and
    // rationalization. Unrecognized fields report
    // `autofill::FieldType::UNKNOWN_TYPE` (1).
    repeated int32 overall_types = 4;

    // Raw server prediction (`autofill::FieldType`), or
    // `autofill::FieldType::NO_SERVER_DATA` (0) if no server prediction has
    // arrived.
    int32 server_type = 5 [features = { field_presence: EXPLICIT }];

    // Raw local heuristic prediction (`autofill::FieldType`), or
    // `autofill::FieldType::UNKNOWN_TYPE` (1) if local heuristics did not
    // match.
    int32 heuristic_type = 6 [features = { field_presence: EXPLICIT }];

    // Whether this field lives in a cross-origin iframe whose origin is not
    // on the actor iframe allowlist
    // (`autofill::IsIframeUrlAllowlistedForActor`). Only populated for fields
    // in cross-origin iframes.
    bool is_in_redacted_iframe = 7 [features = { field_presence: EXPLICIT }];

    // The registered domain of the cross-origin iframe containing this
    // field. Only populated for fields in cross-origin iframes.
    string iframe_domain = 8 [features = { field_presence: EXPLICIT }];
  }

  // Identifies a specific field instance within a form.
  message FieldIdentifier {
    // 64-bit `autofill::FieldSignature` of the field.
    uint64 field_signature = 1 [features = { field_presence: EXPLICIT }];

    // Session-local identifier of the field instance
    // (`autofill::autofill_metrics::FieldGlobalIdToHash64Bit`).
    uint64 field_session_identifier = 2 [features = { field_presence: EXPLICIT }];
  }

  // Quality metrics for a single `actor::AttemptFormFillingTool` invocation.
  message AttemptFormFillingToolCall {
    // User interaction with the autofill confirmation dialog presented during
    // this invocation.
    DialogInteraction dialog_interaction = 1 [features = { field_presence: EXPLICIT }];

    // Per-sub-section interactions during this tool invocation.
    repeated SubSectionInteraction sub_section_interactions = 2;

    // Terminal status of the tool invocation. See `ActionResultCode` in
    // https://source.chromium.org/chromium/chromium/src/+/main:chrome/common/actor.mojom
    // for definition.
    int32 overall_status = 3 [features = { field_presence: EXPLICIT }];

    // Total duration of the tool execution in milliseconds.
    int64 total_duration_ms = 4 [features = { field_presence: EXPLICIT }];
  }

  // User interaction with the confirmation dialog during a tool invocation.
  message DialogInteraction {
    // Number of times the user changed the previewed suggestion before
    // confirming or closing the dialog.
    int32 preview_changed_count = 1 [features = { field_presence: EXPLICIT }];

    // Whether the user confirmed the selected suggestions in the dialog.
    bool confirmed = 2 [features = { field_presence: EXPLICIT }];

    // IDs of suggestions selected by the user across form sections in this
    // dialog.
    repeated string selected_suggestion_ids = 3;

    // Time the dialog was open in milliseconds.
    int64 duration_ms = 4 [features = { field_presence: EXPLICIT }];
  }

  // Metrics for suggestion retrieval and filling of a single requested form
  // sub-section during a tool invocation.
  message SubSectionInteraction {
    // Identifier of the form containing this sub-section.
    FormIdentifier form_identifier = 1 [features = { field_presence: EXPLICIT }];

    // Suggestion retrieval metrics for this sub-section.
    SuggestionsRetrieval suggestions_retrieval = 2 [features = { field_presence: EXPLICIT }];

    // Filling execution metrics for this sub-section.
    FillingExecution filling_execution = 3 [features = { field_presence: EXPLICIT }];
  }

  // Suggestion retrieval metrics for a single requested section of a form.
  message SuggestionsRetrieval {
    // IDs of available suggestions generated for this section, in display
    // order. IDs are generated monotonically across all sections in the
    // invocation (`autofill::ActorFormFillingServiceImpl`), so they uniquely
    // identify suggestions across `requested_data` entries when referenced by
    // `DialogInteraction.selected_suggestion_ids`.
    repeated string available_suggestion_ids = 1;

    // Type of data requested for filling this section.
    int32 requested_data = 2 [features = { field_presence: EXPLICIT }];

    // Duration of suggestion retrieval in milliseconds.
    int64 duration_ms = 3 [features = { field_presence: EXPLICIT }];

    // Whether the user had any saved addresses or credit cards of the requested
    // type in `autofill::PersonalDataManager` when suggestions were retrieved.
    // Can be `true` while `available_suggestion_ids` is empty if the saved
    // profiles/cards could not generate a suggestion for the trigger field (for
    // example, missing a value for the trigger field's `FieldType`, or filtered
    // out by suggestion generation rules).
    bool has_stored_data = 4 [features = { field_presence: EXPLICIT }];
  }

  // Outcome of filling a single section of a form during a tool invocation.
  message FillingExecution {
    // Identifiers of fields successfully filled.
    repeated FieldIdentifier filled_fields = 1;

    // Skip reasons for fields that were not filled during execution.
    repeated FieldSkipReason field_skip_reasons = 2;

    // Duration of the filling execution in milliseconds.
    int64 duration_ms = 3 [features = { field_presence: EXPLICIT }];
  }

  // Skip reasons for a single field that was not filled during execution. A
  // single field can have multiple skip reasons because
  // `autofill::FormFiller::GetFillingSkipReasonsForField` returns a
  // `DenseSet<autofill::FieldFillingSkipReason>`.
  message FieldSkipReason {
    // Identifier of the skipped field.
    FieldIdentifier field_identifier = 1 [features = { field_presence: EXPLICIT }];

    // Numeric `autofill::FieldFillingSkipReason` enum values. Logged as
    // `int32` because `autofill::FieldFillingSkipReason` is a C++ enum with
    // no corresponding Google3 proto enum definition.
    repeated int32 skip_reason_codes = 2;

    // Human-readable skip reason messages from
    // `autofill::GetSkipFieldFillLogMessage`.
    repeated string skip_reasons = 3;
  }

  // Event in the session other than an `actor::AttemptFormFillingTool`
  // invocation.
  message ExternalEvent {
    oneof event {
      // Session or actor task lifecycle status.
      SessionStatus session_status = 1;

      // Form submission outcome, or unsubmitted form outcome when the page
      // navigates away or the tab is closed.
      FormSubmissionDetails submission_details = 2;

      // Form field modification outside of `actor::AttemptFormFillingTool`
      // (manual user edit or direct actor typing via
      // `optimization_guide::proto::TypeAction`).
      FieldModificationDetails field_modification_details = 3;
    }

    // The registered domain of the page. Only populated on `SESSION_STARTED`,
    // `NAVIGATED_AWAY`, and `TAB_CLOSED` events.
    string domain = 4 [features = { field_presence: EXPLICIT }];
  }

  // Details of form submission, or of an unsubmitted form when the page
  // navigates away or the tab is closed.
  message FormSubmissionDetails {
    // Identifier of the form.
    FormIdentifier form_identifier = 1 [features = { field_presence: EXPLICIT }];

    // Submission outcome for the form.
    Outcome outcome = 2 [features = { field_presence: EXPLICIT }];

    // Whether any field in the form was filled by
    // `actor::AttemptFormFillingTool` during this session.
    bool filled_by_attempt_form_filling = 3 [features = { field_presence: EXPLICIT }];

    // Identifiers of fields in the form filled by
    // `actor::AttemptFormFillingTool`.
    repeated FieldIdentifier filled_fields = 4;

    // Identifiers of fields filled by `actor::AttemptFormFillingTool` that were
    // edited by the user prior to submission.
    repeated FieldIdentifier corrected_fields = 5;

    // Identifiers of fields in the form that Autofill considers fillable.
    repeated FieldIdentifier autofillable_fields = 6;

    // Whether the submission occurred while the agent was controlling the tab
    // (`true`) or when the user was in control (`false`). Only populated when
    // `outcome == SUBMITTED_SUCCESSFULLY`.
    bool submitted_by_agent = 7 [features = { field_presence: EXPLICIT }];

    enum Outcome {
      UNSPECIFIED = 0;

      // Form was submitted.
      SUBMITTED_SUCCESSFULLY = 1;

      // Form fields were cleared by the page after being filled.
      FORM_CLEARED = 2;

      // Page navigated away while the form remained unsubmitted.
      NAVIGATED_AWAY = 3;

      // Tab was closed while the form remained unsubmitted.
      TAB_CLOSED = 4;
    }
  }

  // Details of a form field modification outside of
  // `actor::AttemptFormFillingTool` (either a manual user edit or direct actor
  // typing via `optimization_guide::proto::TypeAction`).
  message FieldModificationDetails {
    // Identifier of the form containing the modified field.
    FormIdentifier form_identifier = 1 [features = { field_presence: EXPLICIT }];

    // Identifier of the modified field.
    FieldIdentifier field_identifier = 2 [features = { field_presence: EXPLICIT }];

    // Whether the field was filled by `actor::AttemptFormFillingTool` prior to
    // this modification.
    bool was_autofilled_by_attempt_form_filling = 3 [features = { field_presence: EXPLICIT }];

    // Whether Autofill considers the modified field fillable.
    bool is_autofillable = 4 [features = { field_presence: EXPLICIT }];

    // Whether the field was modified by the actor directly via
    // `optimization_guide::proto::TypeAction` (`true`) or edited manually by
    // the user (`false`).
    bool modified_by_actor = 5 [features = { field_presence: EXPLICIT }];
  }

  // Session or actor task lifecycle status.
  enum SessionStatus {
    SESSION_STATUS_UNSPECIFIED = 0;

    // Actor session started on the tab.
    SESSION_STARTED = 1;

    // The page navigated away. Ends the session only if the actor task has
    // already finished; otherwise the session continues on the new page.
    NAVIGATED_AWAY = 2;

    // Tab was closed, ending the session.
    TAB_CLOSED = 3;

    // The agent handed control back to the user
    // (`actor::ActorTask::State::kWaitingOnUser` with
    // `actor::ActorTask::StoppedReason::kWaitingUserTakeOver`) on a page
    // without an autofillable form.
    HANDOVER_TO_USER = 4;

    // The agent handed control back to the user on a page with an autofillable
    // address or payments form. Recorded instead of `HANDOVER_TO_USER`.
    HANDOVER_ON_AUTOFILLABLE_FORM = 5;

    // The user paused the task to take over control
    // (`actor::ActorTask::State::kPausedByUser`).
    USER_TOOK_OVER = 6;

    // The agent paused itself (`actor::ActorTask::State::kPausedByActor`).
    AGENT_PAUSED = 7;

    // The agent paused to ask the user for input, clarification, or
    // confirmation (`actor::ActorTask::StoppedReason::kWaitingUserInput`,
    // `actor::ActorTask::StoppedReason::kWaitingUserClarification`, or
    // `actor::ActorTask::StoppedReason::kWaitingUserConfirmation`) outside of
    // an active form-filling dialog.
    AGENT_WAITING_FOR_USER_INPUT = 8;

    // Terminal state of the actor task on the tab. The session log remains open
    // until the page navigates away or the tab closes.
    TASK_COMPLETED = 9;

    TASK_CANCELLED = 10;

    TASK_FAILED = 11;
  }
}
