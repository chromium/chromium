edition = "2023";

package optimization_guide.proto;

import "components/optimization_guide/proto/features/common_quality_data.proto";

import "components/optimization_guide/proto/model_quality_metadata.proto";

option optimize_for = LITE_RUNTIME;
option java_package = "org.chromium.components.optimization_guide.features.proto";

option java_outer_classname = "RecordReplayProto";

// DO NOT EDIT THIS FILE DIRECTLY!
//
// This file is generated in g3 and then synced to Chrome. Instead, please refer to
// http://go/chrome-mqls-onboarding (Google-internal link), and then changes will
// be synced with Chrome automatically.

// Top-level MQLS / MES wrapper for Record & Replay.
// Next ID: 4
message RecordReplayLoggingData {
  RecordReplayRequest request = 1 [features = { field_presence: EXPLICIT }];

  RecordReplayResponse response = 2 [features = { field_presence: EXPLICIT }];

  ModelExecutionInfo model_execution_info = 3 [features = { field_presence: EXPLICIT }];
}

// Request from Chrome to MES for Record & Replay skill compilation and
// follow-up refinement.
// Next ID: 8
message RecordReplayRequest {
  TaskType task_type = 1 [features = { field_presence: EXPLICIT }];

  // Initial active tab URL when recording started.
  string start_url = 2 [features = { field_presence: EXPLICIT }];

  // Initial active tab title when recording started.
  string start_page_title = 3 [features = { field_presence: EXPLICIT }];

  // Total duration of the recording session in milliseconds.
  int64 total_duration_ms = 4 [features = { field_presence: EXPLICIT }];

  // Optional free-text note or follow-up instruction from the user.
  string user_note = 5 [features = { field_presence: EXPLICIT }];

  // User's BCP-47 locale (e.g., "en-US").
  string user_locale = 6 [features = { field_presence: EXPLICIT }];

  // Chronologically interleaved user actions and finalized voice transcripts.
  repeated RecordedEvent events = 7;

  // Hybrid semantic and deterministic DOM locator metadata for an action.
  // Next ID: 5
  message TargetElementLocator {
    string ax_role = 1 [features = { field_presence: EXPLICIT }];

    string accessible_name = 2 [features = { field_presence: EXPLICIT }];

    string fallback_css_selector = 3 [features = { field_presence: EXPLICIT }];

    int32 dom_node_id = 4 [features = { field_presence: EXPLICIT }];
  }

  // A single user action captured during a recording session.
  // Maps 1:1 to Chromium's `context_hub::RecordedAction`.
  // Next ID: 11
  message RecordedAction {
    int32 action_index = 1 [features = { field_presence: EXPLICIT }];

    ActionType action_type = 2 [features = { field_presence: EXPLICIT }];

    string page_url = 3 [features = { field_presence: EXPLICIT }];

    string page_title = 4 [features = { field_presence: EXPLICIT }];

    string action_description = 5 [features = { field_presence: EXPLICIT }];

    TargetElementLocator target_locator = 6 [features = { field_presence: EXPLICIT }];

    // Literal input or selection value entered by the user. Must be omitted or
    // set to "[REDACTED]" by the client when `is_sensitive` is true.
    string input_value = 7 [features = { field_presence: EXPLICIT }];

    // True if the interacted element is a password, payment, or OTP field,
    // signaling the compiler to emit a `yield_to_user` handoff step.
    bool is_sensitive = 8 [features = { field_presence: EXPLICIT }];

    // Raw JPEG-encoded viewport screenshot captured at the time of the action.
    bytes screenshot_jpeg_bytes = 9 [features = { field_presence: EXPLICIT }];

    // Optional structural page snapshot for M2 DOM disambiguation.
    AnnotatedPageContent annotated_page_content = 10 [features = { field_presence: EXPLICIT }];
  }

  // A finalized voice narration segment from speech recognition.
  // Maps 1:1 to Chromium's `context_hub::RecordedTranscript`.
  // Next ID: 3
  message RecordedTranscript {
    int32 transcript_index = 1 [features = { field_presence: EXPLICIT }];

    string text = 2 [features = { field_presence: EXPLICIT }];
  }

  // A single chronologically ordered event (either a user action or a voice
  // transcript) produced by `CollectSortedRecordedEvents()`.
  // Next ID: 4
  message RecordedEvent {
    oneof event {
      RecordedAction action = 2;

      RecordedTranscript transcript = 3;
    }

    // Elapsed time since the start of the recording session in milliseconds.
    int64 timestamp_ms = 1 [features = { field_presence: EXPLICIT }];
  }

  // Category of user interaction captured during a recording session.
  // Next ID: 8
  enum ActionType {
    ACTION_TYPE_UNSPECIFIED = 0;

    ACTION_TYPE_LEFT_CLICK = 1;

    ACTION_TYPE_TAB_CHANGE = 2;

    ACTION_TYPE_NAVIGATION = 3;

    ACTION_TYPE_TYPE = 4;

    ACTION_TYPE_SELECT = 5;

    ACTION_TYPE_SCROLL = 6;

    ACTION_TYPE_KEY_PRESS = 7;
  }

  // Next ID: 3
  enum TaskType {
    TASK_TYPE_UNSPECIFIED = 0;

    // M1: Compile a recorded browser session into a reusable Chrome Skill.
    TASK_TYPE_COMPILE_SKILL = 1;

    // M2: Incorporate user answers to compiler clarification questions or
    // conversational edits to a compiled skill.
    TASK_TYPE_REFINE_COMPILED_SKILL = 2;
  }
}

// Response from MES to Chrome for Record & Replay.
// Next ID: 5
message RecordReplayResponse {
  CompiledSkill compiled_skill = 1 [features = { field_presence: EXPLICIT }];

  ErrorCode error_code = 2 [features = { field_presence: EXPLICIT }];

  string error_message = 3 [features = { field_presence: EXPLICIT }];

  // Follow-up questions for the client to prompt the user when more context or
  // disambiguation is needed (e.g., when `error_code` is
  // `ERROR_CODE_INSUFFICIENT_CONTEXT` or `ERROR_CODE_UNCLEAR_INTENT`).
  repeated string clarification_questions = 4;

  // Extracted workflow parameter surfaced for UI chips / M2 confirmation.
  // Next ID: 4
  message SkillParameter {
    // Parameter identifier (e.g., "date_range", "destination_city").
    string name = 1 [features = { field_presence: EXPLICIT }];

    // Description of what the parameter controls.
    string description = 2 [features = { field_presence: EXPLICIT }];

    // Example / default value observed during the recording.
    string default_value = 3 [features = { field_presence: EXPLICIT }];
  }

  // Compiled reusable Chrome Skill artifact.
  // Next ID: 5
  message CompiledSkill {
    // Action-oriented skill title / identifier (1-5 words).
    string name = 1 [features = { field_presence: EXPLICIT }];

    // Concise 1-2 sentence trigger description ("<Verb>... Use when...").
    string description = 2 [features = { field_presence: EXPLICIT }];

    // Complete single-file SKILL.md (YAML frontmatter + Markdown instructions,
    // parameters, hybrid locators, and `yield_to_user` sensitive handoffs).
    // Passed to `GenerateSkillCallback` and `GlicKeyedService::Invoke`.
    string skill_markdown = 3 [features = { field_presence: EXPLICIT }];

    // Structured parameters inferred from user inputs and voice narration.
    repeated SkillParameter parameters = 4;
  }

  // Next ID: 4
  enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;

    ERROR_CODE_INAPPROPRIATE_CONTENT = 1;

    ERROR_CODE_UNCLEAR_INTENT = 2;

    ERROR_CODE_INSUFFICIENT_CONTEXT = 3;
  }
}
