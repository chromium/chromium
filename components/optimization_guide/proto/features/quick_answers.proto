edition = "2023";

package optimization_guide.proto;

import "components/optimization_guide/proto/features/common_quality_data.proto";

import "components/optimization_guide/proto/model_quality_metadata.proto";

option optimize_for = LITE_RUNTIME;
option java_package = "org.chromium.components.optimization_guide.features.proto";

option java_outer_classname = "QuickAnswersProto";

// DO NOT EDIT THIS FILE DIRECTLY!
//
// This file is generated in g3 and then synced to Chrome. Instead, please refer to
// http://go/chrome-mqls-onboarding (Google-internal link), and then changes will
// be synced with Chrome automatically.

message QuickAnswersLoggingData {
  // The feature request.
  QuickAnswersRequest request = 1 [features = { field_presence: EXPLICIT }];

  // The feature response.
  QuickAnswersResponse response = 2 [features = { field_presence: EXPLICIT }];

  ModelExecutionInfo model_execution_info = 3 [features = { field_presence: EXPLICIT }];
}

// The request from the client to MES for Quick Answers generation.
message QuickAnswersRequest {
  // The text selected by the user on the page.
  string selected_text = 1 [features = { field_presence: EXPLICIT }];

  // The inner text surrounding the `selected_text` on the page, including
  // the selected text itself.
  string surrounding_text = 2 [features = { field_presence: EXPLICIT }];

  // The title of the webpage.
  string page_title = 3 [features = { field_presence: EXPLICIT }];

  // The URL of the webpage.
  string page_url = 4 [features = { field_presence: EXPLICIT }];

  // The user's locale as a BCP 47 language code (e.g., "en-US").
  string user_locale = 5 [features = { field_presence: EXPLICIT }];

  // The annotated page content of the webpage.
  AnnotatedPageContent annotated_page_content = 6 [features = { field_presence: EXPLICIT }];
}

// The response from MES to the client for Quick Answers.
message QuickAnswersResponse {
  // The generated answer text, formatted as Markdown.
  string answer = 1 [features = { field_presence: EXPLICIT }];
}
