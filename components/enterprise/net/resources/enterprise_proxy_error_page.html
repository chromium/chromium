<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$i18n{title}</title>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <link rel="stylesheet" href="enterprise_proxy_error_page.css">
</head>
<body>
  <h1>Enterprise Proxy Error</h1>
  <p>Destination URL: <span id="destination-url">$i18n{destination_url}</span></p>
  <p>Proxy URL: <span id="proxy-url">$i18n{proxy_url}</span></p>
