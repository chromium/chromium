# mypy configuration for tools/metrics, passed by mypy_helpers.py. Modules
# under src/ are named after the chromium_src alias that setup_modules.py and
# the mypy stubs directory provide.

[mypy]
# Also type check the bodies of functions without annotations, so that errors
# in them aren't hidden.
check_untyped_defs = True

# Vendored code is type checked only as far as tools/metrics uses it; errors
# inside it are not actionable here.
[mypy-chromium_src.third_party.*]
follow_imports = silent

# tools/metrics modules are also reachable through the chromium_src alias.
# Their errors are already reported under their tools/metrics/ path.
[mypy-chromium_src.tools.metrics.*]
follow_imports = silent

# Presubmit test mocks shared by all of src/; errors inside them are not
# actionable here either.
[mypy-chromium_src.PRESUBMIT_test_mocks]
follow_imports = silent

# Not part of the tools/metrics vpython environment.
[mypy-json5]
ignore_missing_imports = True
