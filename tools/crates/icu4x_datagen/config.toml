# Configuration for //tools/crates/run_icu4x_datagen.py (//tools/crates/icu4x_datagen).
#
# By default, every ICU4X data marker is mapped to its corresponding ICU4C data
# tree in //third_party/icu/filters/<platform>.json (`locales_tree`, `curr_tree`,
# `lang_tree`, `region_tree`, `unit_tree`, `zone_tree`, `coll_tree`, or `singleton`).
# Run `python3 tools/crates/run_icu4x_datagen.py list-markers` to inspect the
# default mapping for all registered ICU4X markers (around 340 markers total).

# Unified `.patch` files (relative to the Chromium `src/` root) applied to
# `ICU4X-json` payloads before baking Rust data into `//third_party/rust/icu4x_data`.
# See `//third_party/rust/icu4x_data/patches/README.md` for details.
patches = [
  "third_party/rust/icu4x_data/patches/name_5_langs.patch",
  "third_party/rust/icu4x_data/patches/locale1.patch",
  "third_party/rust/icu4x_data/patches/google3-overlay.patch",
]

[resource_filters]
# Restrict `TransliteratorRulesV1` (`transliterator/rules/v1`) to the upstream
# and custom transliterators configured under `[transliterators]`.
filter_transliterators = true

# Restrict `CurrencyDisplaynameV1`, `CurrencyExtendedDataV1`, and `CurrencySymbolsV1`
# to the active currencies in ICU4C `resourceFilters` (`curr_tree`).
filter_currencies = true

# Restrict `LocaleNamesLanguage*V1` to UI + non-UI target languages in ICU4C
# `resourceFilters` (`lang_tree`).
filter_target_languages = true

# Restrict `LocaleNamesVariant*V1` to target variants in ICU4C `resourceFilters`
# (`lang_tree`: `POSIX`, `1996`, etc.).
filter_target_variants = true

# Restrict non-autonym locale trees (`locales_tree`, `lang_tree`) to UI locales
# by excluding the non-UI Accept-Languages that have `-/*` + `+/Languages/<lang>`
# rules in `//third_party/icu/filters/<platform>.json` (around 100 locales in
# `common.json`; run `inspect-filters` to view resolved per-platform locale
# family counts), while preserving `LocaleNamesLanguage*V1` autonyms
# (`lang/x/x`).
abridge_non_ui_locales = true

# Optional marker-pattern override rules (`[[rules]]`), evaluated in order
# (first matching `pattern` glob wins). Useful as Chromium migrates individual
# components off ICU4C filters or customizes marker locale coverage.
#
# Example:
# [[rules]]
# pattern = "datetime/*"
# icu4c_category = "locales_tree"
#
# [[rules]]
# pattern = "plurals/*"
# locales = ["und", "en", "fr", "ja"]

# Scope `TransliteratorRulesV1` to `locales_tree` rather than ICU4C's `translit`
# filter so all 6 browser and Cast platforms (`common`, `chromeos`, `android`,
# `ios`, `cast`, `chromecast_video` — including Cast, which builds `//base:i18n`
# and `SkeletonGenerator`) export transliterators even after ICU4C's `translit`
# data is excluded, while `flutter` and `flutter_desktop` (`locales_tree`
# excluded) omit them.
[[rules]]
pattern = "transliterator/*"
icu4c_category = "locales_tree"

[transliterators]
# Upstream CLDR `TransliteratorRulesV1` IDs used by `base::i18n::CreateTransliterator`
# and `::Latin-ASCII;` (`Latin-ASCII`, `Katakana-Hiragana`, `Hiragana-Katakana`).
include = [
  "und-t-und-latn-d0-ascii",
  "und-hira-t-und-kana",
  "und-kana-t-und-hira",
]

# Pre-compiled static UTS #35 rule sets for Chromium's custom transliterators.
# Short single-line rules are specified inline (`rules`), while multi-rule sets
# live in formatted `.txt` files under
# `//third_party/rust/icu4x_data/transliterators/` (`rules_file`).

# `NormalizeForAddress` (`//components/autofill/core/browser/data_model/transliterator.cc`)
[[transliterators.custom]]
bcp47_id = "und-t-und-x0-afill"
aliases = ["NormalizeForAddress"]
rules = "::NFD; ::[:Nonspacing Mark:] Remove; ::Lower; ::NFC; ::Latin-ASCII;"

# `DE_NormalizForAddress` (`//components/autofill/core/browser/data_model/transliterator.cc`)
[[transliterators.custom]]
bcp47_id = "und-t-und-x0-afillde"
rules_file = "third_party/rust/icu4x_data/transliterators/de_normalize_for_address.txt"

# `DropAcc` (`//components/url_formatter/spoof_checks/skeleton_generator.cc`) and
# `RemoveDiacritic` (`//chromeos/ash/components/local_search_service/content_extraction_utils.cc`)
[[transliterators.custom]]
bcp47_id = "und-t-und-x0-dropacc"
rules = "::NFD; ::[:Nonspacing Mark:] Remove; ::NFC; ł > l; ø > o; đ > d;"

# `ExtraConf` (`//components/url_formatter/spoof_checks/skeleton_generator.cc`)
[[transliterators.custom]]
bcp47_id = "und-t-und-x0-xconf"
rules_file = "third_party/rust/icu4x_data/transliterators/extra_conf.txt"

# `RemoveHyphen` (`//chromeos/ash/components/local_search_service/content_extraction_utils.cc`)
[[transliterators.custom]]
bcp47_id = "und-t-und-x0-rmhyph"
rules = "::[-~֊־᠆‐‑‒–—―⁓⁻₋−⸺⸻〜〰゠﹘﹣－] Remove;"

# `DiacriticStripper` (`//chrome/browser/ash/input_method/diacritics_insensitive_string_comparator.cc`)
[[transliterators.custom]]
bcp47_id = "und-t-und-x0-diacstr"
rules_file = "third_party/rust/icu4x_data/transliterators/diacritic_stripper.txt"
