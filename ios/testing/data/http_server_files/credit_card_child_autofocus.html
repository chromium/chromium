<html>
<head>
  <title>Child Frame Autofocus Test</title>
</head>
<body>
  Autofill Test - Child Frame Autofocus<br>
  <iframe id="child_frame"></iframe>
  <script>
    window.childFrameLoaded = false;
    window.childAutofocusTriggered = false;
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'autofocusTriggered') {
        window.childAutofocusTriggered = true;
      }
    });
    const childFrame = document.getElementById('child_frame');
    childFrame.addEventListener('load', function() {
      window.childFrameLoaded = true;
    });
    const urlParams = new URLSearchParams(window.location.search);
    const childSrc = urlParams.get('child_src') || '/credit_card_child_frame.html';
    childFrame.src = childSrc;
  </script>
</body>
</html>
