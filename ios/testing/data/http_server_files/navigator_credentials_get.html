<html><body>

<p>Credential Get Test Page</p>
<button id="get-passkey-btn" onclick="triggerGet()">Get Passkey</button>
<div id="result"></div>

<script>
const mockCredentialRequestOptions = {
  challenge: Uint8Array.from(
    'randomlygeneratedcryptographicchallengestring',
    (c) => c.charCodeAt(0)
  ).slice(0, 32),
  timeout: 60000, // 60 seconds
  rpId: 'localhost',
  userVerification: 'preferred',
  allowCredentials: [],
};

async function triggerGet() {
  try {
    const credential = await navigator.credentials.get({
      publicKey: mockCredentialRequestOptions,
      mediation: 'required'
    });
    if (credential) {
      document.getElementById('result').innerText = 'Assertion Success';
    } else {
      document.getElementById('result').innerText = 'Assertion Failed: Null Credential';
    }
  } catch (err) {
    document.getElementById('result').innerText = 'Assertion Failed: ' + err.name;
  }
}
</script>

</body></html>
