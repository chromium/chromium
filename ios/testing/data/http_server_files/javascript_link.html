<!--
This file contains a link with a javascript: URL scheme. The link is at a
precise position to be able to tap it.
-->

<html>
  <body>
    <a href="javascript:void(0);" id="link" aria-label="link" style="display:inline-block;position:absolute;left:40px;top:40px;width:10px;height:10px;">Link</a>
  </body>
</html>
