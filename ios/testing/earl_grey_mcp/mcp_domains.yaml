      - ios/chrome/browser/contextual_panel/**/*_app_interface.h
      - ios/chrome/browser/https_upgrades/**/*_app_interface.h
      - ios/chrome/browser/intelligence/**/*_app_interface.h
      - ios/chrome/browser/net/**/*_app_interface.h
      - ios/chrome/browser/optimization_guide/**/*_app_interface.h
      - ios/chrome/browser/partial_translate/**/*_app_interface.h
      - ios/chrome/browser/price_insights/**/*_app_interface.h
      - ios/chrome/browser/safe_browsing/**/*_app_interface.h
      - ios/chrome/browser/ssl/**/*_app_interface.h
      - ios/chrome/browser/translate/**/*_app_interface.h
      - ios/chrome/browser/web/**/*_app_interface.h
      - ios/chrome/browser/web_extension/**/*_app_interface.h

  - id: metrics_sync_and_promos
    description: "Metrics, variations, performance, WPT, sync, notifications, promos."
    include:
      - ios/chrome/browser/credential_provider_promo/**/*_app_interface.h
      - ios/chrome/browser/default_browser/**/*_app_interface.h
      - ios/chrome/browser/docking_promo/**/*_app_interface.h
      - ios/chrome/browser/feature_engagement/**/*_app_interface.h
      - ios/chrome/browser/metrics/**/*_app_interface.h
      - ios/chrome/browser/post_restore_signin/**/*_app_interface.h
      - ios/chrome/browser/promos_manager/**/*_app_interface.h
      - ios/chrome/browser/push_notification/**/*_app_interface.h
