  <text x="260" y="250" text-anchor="middle" font-size="13" fill="#111111">User Interactions</text>

  <!-- Arrows -->
  <line x1="320" y1="65" x2="202" y2="65" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow-end)" />
  <text x="260" y="55" text-anchor="middle" font-size="13" fill="#111111">Owns</text>

  <line x1="410" y1="110" x2="272" y2="179" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow-end)" />
  <text x="318" y="138" text-anchor="middle" font-size="13" fill="#111111">Owns</text>

  <line x1="112" y1="111" x2="248" y2="179" stroke="#222222" stroke-width="1.5" marker-start="url(#arrow-end)" marker-end="url(#arrow-end)" />
  <text x="148" y="156" text-anchor="middle" font-size="13" fill="#111111">Updates</text>
