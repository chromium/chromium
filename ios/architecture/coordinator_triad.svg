    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#222222" />
    </marker>
  </defs>

  <!-- Mediator Box -->
  <rect x="20" y="20" width="180" height="90" fill="#f4a6a3" stroke="#333333" stroke-width="1.5" />
  <text x="110" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Mediator</text>
  <text x="110" y="70" text-anchor="middle" font-size="13" fill="#111111">Business Logic</text>
  <text x="110" y="90" text-anchor="middle" font-size="13" fill="#111111">Model Interactions</text>

  <!-- Coordinator Box -->
  <rect x="320" y="20" width="180" height="90" fill="#ffe599" stroke="#333333" stroke-width="1.5" />
  <text x="410" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Coordinator</text>
  <text x="410" y="70" text-anchor="middle" font-size="13" fill="#111111">Manages Objects</text>
  <text x="410" y="90" text-anchor="middle" font-size="13" fill="#111111">App Interactions</text>

  <!-- View Controller Box -->
  <rect x="170" y="180" width="180" height="90" fill="#b6d7a8" stroke="#333333" stroke-width="1.5" />
  <text x="260" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">View Controller</text>
