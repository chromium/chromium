  <rect x="252" y="86" width="151" height="56" fill="#cfe2f3" stroke="#222222" stroke-width="1.5" />
  <text x="327" y="109" text-anchor="middle" font-size="12" fill="#111111">WebContent</text>
  <text x="327" y="127" text-anchor="middle" font-size="12" fill="#111111">ViewController</text>

