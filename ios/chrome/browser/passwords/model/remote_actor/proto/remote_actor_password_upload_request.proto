syntax = "proto3";

package remote_actor.proto;

option optimize_for = LITE_RUNTIME;

// Request sent from remote actors to Chrome iOS to upload a credential to
// Passbox.
message RemoteActorPasswordUploadRequest {
  // The GAIA ID of the account on whose behalf the remote actor is acting.
  // Chrome verifies that the user is signed into this account before
  // proceeding.
  string gaia_id = 1;

  // The web domain for which the credential is requested from Google Password
  // Manager (e.g., "https://example.com").
  string domain = 2;

  // The unique identifier of the remote actor task requesting the credential.
  // Used for tracking and granting permissions via the Agentic Permissions
  // Service (APS).
  string task_id = 3;
}
