syntax = "proto3";

package remote_actor.proto;

option optimize_for = LITE_RUNTIME;

// Options for uploading an existing credential from Google Password Manager to
// Passbox.
message RemoteActorPasswordExistingCredentialOptions {
  // If true, the remote actor flow will immediately upload the credential to
  // Passbox without waiting for confirmation or reauthentication, in cases
  // where only one credential exists. Defaults to false if unset.
  bool user_has_already_consented = 1;
}

// Options for storing a new credential in Google Password Manager prior to
// uploading to Passbox.
message RemoteActorPasswordNewCredentialOptions {
  // The username for the new credential.
  string username = 1;

  // The password for the new credential.
  string password = 2;
}

// Request sent from remote actors to Chrome iOS to upload a credential to
// Passbox.
message RemoteActorPasswordUploadRequest {
  // The GAIA ID of the account on whose behalf the remote actor is acting.
  // Chrome verifies that the user is signed into this account before
  // proceeding.
  string gaia_id = 1;

  // The web domain for which the credential is requested from Google Password
  // Manager (e.g., "https://example.com").
  string domain = 2;

  // The unique identifier of the remote actor task requesting the credential.
  // Used for tracking and granting permissions via the Agentic Permissions
  // Service (APS).
  string task_id = 3;

  // Specifies desired behavior and relevant parameters. If omitted, the default
  // behavior is to attempt an existing credential upload.
  oneof options {
    // Uploads an existing credential from Google Password Manager to Passbox.
    RemoteActorPasswordExistingCredentialOptions existing_credential_options =
        4;

    // Stores a new credential in Google Password Manager prior to uploading to
    // Passbox.
    RemoteActorPasswordNewCredentialOptions new_credential_options = 5;
  }
}
