// Test proto for lpm_stub_fuzzer that covers a wide range of field types to
// catch issues like https://crbug.com/558759075.

syntax = "proto2";

package lpm_test;

enum TestEnum {
  TEST_ENUM_UNSPECIFIED = 0;
  TEST_ENUM_FOO = 1;
  TEST_ENUM_BAR = 2;
}

message Nested {
  optional int32 int32_value = 1;
  optional string string_value = 2;
  repeated uint32 uint32_values = 3;
  optional Nested child = 4;
}

message TestMessage {
  // Singular scalars.
  optional int32 int32_value = 1;
  optional int64 int64_value = 2;
  optional uint32 uint32_value = 3;
  optional uint64 uint64_value = 4;
  optional sint32 sint32_value = 5;
  optional sint64 sint64_value = 6;
  optional fixed32 fixed32_value = 7;
  optional fixed64 fixed64_value = 8;
  optional sfixed32 sfixed32_value = 9;
  optional sfixed64 sfixed64_value = 10;
  optional float float_value = 11;
  optional double double_value = 12;
  optional bool bool_value = 13;
  optional TestEnum enum_value = 14;
  optional string string_value = 15;
  optional bytes bytes_value = 16;

  // Unpacked repeated scalars.
  repeated int32 int32_values = 21;
  repeated int64 int64_values = 22;
  repeated uint32 uint32_values = 23;
  repeated uint64 uint64_values = 24;
  repeated sint32 sint32_values = 25;
  repeated sint64 sint64_values = 26;
  repeated fixed32 fixed32_values = 27;
  repeated fixed64 fixed64_values = 28;
  repeated sfixed32 sfixed32_values = 29;
  repeated sfixed64 sfixed64_values = 30;
  repeated float float_values = 31;
  repeated double double_values = 32;
  repeated bool bool_values = 33;
  repeated TestEnum enum_values = 34;

  // Packed repeated scalars.
  repeated int32 packed_int32_values = 41 [packed = true];
  repeated int64 packed_int64_values = 42 [packed = true];
  repeated uint32 packed_uint32_values = 43 [packed = true];
  repeated uint64 packed_uint64_values = 44 [packed = true];
  repeated sint32 packed_sint32_values = 45 [packed = true];
  repeated sint64 packed_sint64_values = 46 [packed = true];
  repeated fixed32 packed_fixed32_values = 47 [packed = true];
  repeated fixed64 packed_fixed64_values = 48 [packed = true];
  repeated sfixed32 packed_sfixed32_values = 49 [packed = true];
  repeated sfixed64 packed_sfixed64_values = 50 [packed = true];
  repeated float packed_float_values = 51 [packed = true];
  repeated double packed_double_values = 52 [packed = true];
  repeated bool packed_bool_values = 53 [packed = true];
  repeated TestEnum packed_enum_values = 54 [packed = true];

  // Repeated strings and bytes.
  repeated string string_values = 61;
  repeated bytes bytes_values = 62;

  // Messages.
  optional Nested nested = 71;
  repeated Nested nested_values = 72;
  optional TestMessage recursive = 73;

  // Oneof.
  oneof choice {
    int32 choice_int32 = 81;
    string choice_string = 82;
    Nested choice_nested = 83;
  }

  // Maps.
  map<int32, int32> int32_map = 91;
  map<string, string> string_map = 92;
  map<uint32, Nested> nested_map = 93;
}
