check_raw_ptr_in_container:
  enabled: true
  override_defaults: true
  included_types:
    - "std::stack"
    - "std::unordered_set"
    - "std::deque"
    - "std::tuple"
    - "std::variant"
    - "std::list"
    - "std::queue"
    - "std::set"
    - "base::flat_tree_internal::flat_tree"
    - "std::vector"
  # Pointer types that never point to PartitionAlloc memory (e.g. OS or driver
  # handles), so `raw_ptr<T>` gives them no protection and, for some of them,
  # doesn't compile. A container field is skipped if one of its template
  # arguments, as written in the source, is a typedef listed here by its
  # fully-qualified name. Aliases aren't resolved, so every alias in use must be
  # listed (e.g. `HMODULE` separately from `HINSTANCE`), and pointers to records
  # (e.g. `HWND__*`) aren't matched. When the plugin flags a new opaque handle,
  # add it here.
  excluded_pointer_types:
    # Win32 handles, see base/win/windows_types.h and
    # base/win/win_handle_types_list.inc.
    - "EVT_HANDLE"
    - "HANDLE"
    - "HBITMAP"
    - "HBRUSH"
    - "HDC"
    - "HDESK"
    - "HDEVINFO"
    - "HDEVNOTIFY"
    - "HFONT"
    - "HGLRC"
    - "HICON"
    - "HINSTANCE"
    - "HINTERNET"
    - "HKEY"
    - "HKL"
    - "HMENU"
    - "HMODULE"
    - "HMONITOR"
    - "HPEN"
    - "HPOWERNOTIFY"
    - "HRGN"
    - "HWINEVENTHOOK"
    - "HWINSTA"
    - "HWND"
    - "LSA_HANDLE"
    # Vulkan non-dispatchable handles, pointers only on 64-bit platforms.
    - "VkDescriptorSet"
    - "VkDeviceMemory"
    - "VkFramebuffer"
    - "VkImage"
    - "VkImageView"
    - "VkSemaphore"
    # PDFium handles, see third_party/pdfium/public/fpdfview.h.
    - "FPDF_PAGEOBJECT"
    # Objective-C object pointer, when <objc/objc.h> is compiled as C++.
    - "id"
