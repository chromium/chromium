line-length = 80
indent-width = 2
extend-exclude = [
  "*_pb2.py",
  # Legacy Python 2 scripts.
  "tools/build/remoting_ios_localize.py",
  "tools/build/shader_to_header.py",
  "tools/extract_android_native_lib.py",
  "tools/jscompile.py",
  "tools/native_messaging_host_test.py",
  "tools/remote_test_helper/*",
  "tools/runclient.py",
]

[format]
quote-style = "preserve"

[lint]
# Enable the legacy Ruff 0.15 default ruleset.
select = ["E4", "E7", "E9", "F"]
unfixable = ["F401"]
