syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package remoting.protocol;

// Next ID: 9
message TerminalControl {
  // Message sent by the host to the client as the first message on a terminal
  // channel.
  //
  // Next ID: 3
  message CreateTerminalResponse {
    // Next ID: 6
    message Error {
      enum Reason {
        // The reason is unknown.
        UNKNOWN = 0;

        // An unexpected error occurred on the host.
        INTERNAL_ERROR = 1;

        // The host is temporarily unable to create a terminal (for example,
        // because it is still restoring persistent terminals). The request may
        // be retried later.
        BUSY = 2;

        // The host failed to allocate a pseudo-terminal.
        PTY_ERROR = 3;

        // tmux is not installed on the host.
        TMUX_MISSING = 4;

        // The host failed to launch the terminal process.
        LAUNCH_FAILED = 5;
      }

      optional Reason reason = 1;

      // The system error code, as returned by the platform.
      optional int32 code = 2;

      // The filename where the error occurred.
      optional string file_name = 3;

      // The line number where the error occurred.
      optional uint32 line_number = 4;

      optional string error_message = 5;
    }

    oneof result {
      // The id of the newly created or restored terminal.
      int32 terminal_id = 1;

      // A human-readable error message.
      Error error = 2;
    }
  }

  // Message sent by the client to the host to permanently terminate a terminal
  // session. An explicit message is used rather than relying on data channel
  // closure so the host can distinguish deliberate terminal removal (which
  // terminates the underlying tmux window) from connection teardown or browser
  // tab closure (which detaches the session and preserves it across
  // connections).
  message RemoveTerminal {}

  // Message sent by the client to the host on user input.
  //
  // Next ID: 2
  message TerminalInput {
    optional string input = 1;
  }

  // Message sent by the client to the host to resize a terminal.
  //
  // Next ID: 3
  message ResizeTerminal {
    optional uint32 width = 1;
    optional uint32 height = 2;
  }

  // Message sent by the host to the client when terminal output is received, or
  // on connection with the initial contents of the terminal.
  //
  // Next ID: 2
  message TerminalOutput {
    optional string output = 1;
  }

  // Next ID: 4
  message ProcessInfo {
    // The name of the current running process.
    optional string process_name = 1;

    // True if the process is "active", in which case the client should prompt
    // the user to confirm before destroying the terminal.
    optional bool is_active = 2;

    // True if the process is terminated, in which case no further input will be
    // accepted.
    optional bool is_terminated = 3;
  }

  // LINT.IfChange(AgentStatus)
  // Next ID: 3
  message AgentInfo {
    enum AgentState {
      UNSPECIFIED = 0;
      IDLE = 1;
      WORKING = 2;
      TOOL_USE = 3;
      REVIEWING = 4;
      AUTHENTICATING = 5;
      INITIALIZING = 6;
      ERROR = 7;
    }

    // The current state of the AI coding agent running in this terminal, if
    // any.
    optional AgentState agent_state = 1;

    // The title for the active agent conversation. While an agent is active,
    // this value takes precedence over any title set via escape sequences.
    optional string conversation_title = 2;
  }
  // LINT.ThenChange(//remoting/host/mojom/common.mojom:AgentStatus)

  // Message sent by the host when a terminal process exits. An explicit
  // in-band message is used rather than immediately closing the data channel
  // on the host so that any queued TerminalOutput messages are flushed in order
  // before the client closes the channel, and so the client can distinguish
  // terminal exit from an unexpected connection drop.
  message CloseTerminal {}

  oneof control {
    CreateTerminalResponse create_response = 1;
    RemoveTerminal remove_request = 2;
    TerminalInput terminal_input = 3;
    TerminalOutput terminal_output = 4;
    ProcessInfo process_info = 5;
    ResizeTerminal resize_terminal = 6;
    CloseTerminal close_terminal = 7;
    AgentInfo agent_info = 8;
  }
}
