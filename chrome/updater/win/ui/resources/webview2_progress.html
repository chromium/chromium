<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body[hidden] { display: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars during resize. */
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        #status-text {
            white-space: pre-line;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 500;
        }
        #app-name {
            margin-block-end: 20px;
            overflow-wrap: anywhere;
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #1a73e8; /* Blue. */
            transition: width 0.3s ease;
        }
        button {
            padding: 8px 16px;
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #1a73e8;
            font-weight: 500;
        }
        button:hover {
            background-color: #f8f9fa;
        }
        .marquee { animation: marquee 2s infinite linear;
          width: 30% !important; }
        @keyframes marquee { from { margin-inline-start: -30%; } to
          { margin-inline-start: 100%; } }
    </style>
</head>
<body hidden>

    <div class="container">
        <div id="status-text" role="status"></div>

        <div id="app-name" hidden></div>

        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar-fill" role="progressbar"
                 aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <button id="cancel-btn"></button>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const cancelButton = document.getElementById('cancel-btn');
        const bar = document.getElementById('progress-bar');
        const appNameText = document.getElementById('app-name');
        let cancelingText = '';

        // The host sends localized text and metadata. The page owns layout and
        // rendering, and never interprets installer states or resource IDs.
        window.updateUI = ({statusText: text, title, language, textDirection,
                            cancelText, cancelingText: canceling, progress,
                            isMarquee, complete, appName}) => {
            document.documentElement.lang = language;
            document.documentElement.dir = textDirection;
            document.title = title;
            statusText.textContent = text;
            cancelButton.textContent = cancelText;
            cancelingText = canceling;
            const position = Number.isFinite(progress) ?
                Math.max(0, Math.min(100, progress)) : 0;
            bar.style.width = position + '%';
            bar.classList.toggle('marquee', isMarquee);
            bar.setAttribute('aria-label', text);
            if (isMarquee) {
                bar.removeAttribute('aria-valuenow');
            } else {
                bar.setAttribute('aria-valuenow', String(position));
            }
            cancelButton.hidden = complete;
            appNameText.textContent = appName || '';
            appNameText.hidden = !appName || complete;
            document.body.hidden = false;
        };

        cancelButton.addEventListener('click', () => {
            statusText.textContent = cancelingText;
            cancelButton.disabled = true;
            window.chrome?.webview?.postMessage('cancel_installation');
        });

        // Keep the page hidden until the host replays its latest progress,
        // including the labels and language metadata.
        window.chrome?.webview?.postMessage('ui_ready');
    </script>
</body>
</html>
