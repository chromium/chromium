<!DOCTYPE html>
<html>
<head>
<body>
  <style>
    ::granted {
      display:none
    }
  </style>
  <geolocation id="geolocation"></geolocation>
  <usermedia id="camera" type="camera"></usermedia>
  <usermedia id="microphone" type="microphone"></usermedia>

  <script>
    function clickById(element_id) {
      let el = document.getElementById(element_id);
      if (el.checkVisibility()) {
        el.click();
      } else {
        setTimeout(clickById, 100, element_id);
      }
    }

    let locationEvents = 0;
    let onLocationEvent = null;
    document.getElementById('geolocation').addEventListener('location', () => {
      locationEvents++;
      if (onLocationEvent) {
        onLocationEvent();
      }
    });

    // Resolves once the <geolocation> element has fired `count` location
    // events in total.
    async function waitForLocationEvents(count) {
      while (locationEvents < count) {
        await new Promise(resolve => onLocationEvent = resolve);
      }
      return true;
    }
  </script>
</body>
</html>
