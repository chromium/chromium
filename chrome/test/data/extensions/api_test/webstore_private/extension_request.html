<script src="common.js"></script>
<script>

runTests([
  function getExtensionStatusCanRequest() {
    var manifest = getManifest();
    chrome.webstorePrivate.getExtensionStatus(
        extensionId, manifest, callbackPass(function(result) {
      assertEq("can_request", result);
    }));
  },

  function beginInstallRequest() {
    var manifest = getManifest();
    chrome.webstorePrivate.beginInstallWithManifest3(
        {id: extensionId, manifest: manifest},
        callbackFail("User cancelled install", function(result) {
          assertEq("user_cancelled", result);
        }));
  },
]);

</script>
