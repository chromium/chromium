<html>
<head>
  <title>Guest SW Test</title>
  <script>
    async function startSW() {
      const reg = await navigator.serviceWorker.register('guest_sw.js');
      await navigator.serviceWorker.ready;
      return new Promise((resolve) => {
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (e.data === 'FETCH_DONE') {
            resolve('DONE');
          }
        });
        const target = reg.active || navigator.serviceWorker.controller;
        target.postMessage('FETCH');
      });
    }
  </script>
</head>
<body>
  Guest SW Test Page
</body>
</html>
