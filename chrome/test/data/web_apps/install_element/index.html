<html>
<head>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="parent">
    <install id="install-app" installurl="" manifestid=""></install>
  </div>
  <script>
    // The installresult event has a 'result' property with values:
    // - "success"
    // - "aborted"
    // - "invalid_data"
    document.getElementById('parent').addEventListener('installresult', (event) => {
      console.log(event.target.id + '-installresult-' + event.result);
    });
  </script>
</body>
</html>
