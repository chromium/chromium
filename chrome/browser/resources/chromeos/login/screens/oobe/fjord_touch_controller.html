<style>
  webview {
    display: flex;
    height: 90%;
    overflow: hidden;
    width: 100%;
  }

  #nextButtonContainer {
    float: inline-end;
    padding-inline-end: var(--oobe-adaptive-dialog-buttons-horizontal-padding);
    position: relative;
  }

  #testImageSkipButton {
    float: inline-end;
    padding-inline-end: var(--oobe-adaptive-dialog-buttons-horizontal-padding);
  }
</style>

<webview id="oobeFrame" src="http://codec.localhost:27702/oobe/tc-setup">
</webview>

<!-- The disabled button does not receive pointer events, so the tooltip is
     attached to this container instead. -->
<div id="nextButtonContainer">
  <oobe-text-button on-click="onDoneButtonClicked"
      text-key="fjordTouchControllerNextButton"
      inverse
      disabled="[[isNextButtonDisabled]]"
      id="primaryButton">
  </oobe-text-button>
  <template is="dom-if" if="[[isNextButtonDisabled]]" restamp>
    <paper-tooltip id="nextButtonTooltip" for="nextButtonContainer"
        position="top" animation-delay="0" fit-to-visible-bounds>
      [[i18nDynamic(locale, 'fjordTouchControllerNextButtonTooltip')]]
    </paper-tooltip>
  </template>
</div>

<!-- Only shown on test images. Lets testers move to the next screen without
     finishing the touch controller setup. -->
<oobe-text-button on-click="onTestImageSkipButtonClicked"
    text-key="fjordTouchControllerTestImageSkipButton"
    hidden="[[!isTestImageSkipButtonVisible]]"
    id="testImageSkipButton">
</oobe-text-button>
