<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{roundedIconsAttribute} $i18n{webuiRoundedIconsAttribute}>
  <head>
    <meta charset="utf-8">
    <title>$i18n{title}</title>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        width: 100%;
      }

      body {
        background: var(--color-side-panel-content-background);
        overflow: auto;
<if expr="is_android">
        /* Scale text with the OS font size setting on Android. Unlike page
         * zoom, text-size-adjust only scales computed font sizes (and
         * line-height / glyph-metric units like ch, not px or em), so layout
         * dimensions stay the same. */
        text-size-adjust: calc(100% * env(preferred-text-scale));
</if>
      }
    </style>
  </head>
  <body>
    <customize-chrome-app></customize-chrome-app>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <script type="module" src="app.js"></script>
  </body>
</html>
