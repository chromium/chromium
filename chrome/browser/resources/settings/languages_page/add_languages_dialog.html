    <style include="settings-shared">
      #dialog-title {
        align-items: center;
        display: flex;
      }

      #dialog-body {
        display: flex;
        flex-direction: column;
        height: 350px;
        overflow: auto;
        padding-inline-start: 0;
        padding-inline-end: 0;
      }

      #dialog-title > span,
      #list {
        flex: 1;
      }

      cr-checkbox {
        padding-bottom: 7px;
        padding-inline-end: var(--cr-section-padding);
        padding-inline-start: 40px;
        padding-top: 7px;
      }

      cr-checkbox::part(label-container) {
        min-width: 0;
      }
    </style>
    <cr-dialog id="dialog" close-text="$i18n{close}">
      <div id="dialog-title" slot="title">
        <span>$i18n{addLanguagesDialogTitle}</span>
        <cr-search-field label="$i18n{searchLanguages}" id="search"
            clear-label="$i18n{clearSearch}"
            on-search-changed="onSearchChanged_"
            on-keydown="onKeydown_" autofocus>
        </cr-search-field>
      </div>
      <div id="dialog-body" slot="body" scrollable>
        <div id="list" role="listbox" focusgroup="listbox block"
            hidden$="[[!getLanguagesCount_(filterValue_)]]">
          <template is="dom-repeat" items="[[getLanguages_(filterValue_)]]">
            <cr-checkbox checked="[[willAdd_(item.code)]]"
                aria-label="[[i18n('addLanguageAriaLabel', item.displayName)]]"
                on-change="onLanguageCheckboxChange_">
              <div class="text-elide">
                [[getDisplayText_(item)]]
              </div>
            </cr-checkbox>
          </template>
        </div>
      </div>
      <div slot="button-container">
        <cr-button class="cancel-button" on-click="onCancelButtonClick_">
          $i18n{cancel}
        </cr-button>
        <cr-button class="action-button" on-click="onActionButtonClick_"
            disabled="[[disableActionButton_]]">
          $i18n{add}
        </cr-button>
      </div>
    </cr-dialog>
