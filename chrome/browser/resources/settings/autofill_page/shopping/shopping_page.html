<style include="settings-shared autofill-shared">
  .card {
    overflow: hidden;
  }
</style>

<settings-subpage page-title="$i18n{shoppingCardTitle}" class="multi-card"
    route-path$="[[routePath]]">
  <div class="card">
    <settings-toggle-button id="optInToggle"
        disabled="[[optInToggleDisabled_(
            autofillSettingsEnterprisePolicyEnabled_,
            profileEnabledPref_)]]"
        on-settings-boolean-control-change="onOptInToggleChange_"
        pref="[[shoppingOptedIn_]]"
        no-extension-indicator
        label="$i18n{shoppingOptInToggleLabel}"
        sub-label="$i18n{shoppingOptInToggleSubLabel}">
    </settings-toggle-button>
    <template is="dom-if" if="[[showSuggestionsFromGeminiSettings_]]">
      <cr-link-row label="$i18n{autofillPersonalContextSettingsTitle}"
          sub-label="$i18n{autofillPersonalContextSettingsSubpageSummary}"
          id="suggestionsFromGeminiLinkRow"
          on-click="onSuggestionsFromGeminiClick_" class="hr">
      </cr-link-row>
    </template>
    <template is="dom-if" if="[[extensionControlledIndicatorIsVisible_(
            profileEnabledPref_)]]">
      <div class="cr-row continuation">
        <extension-controlled-indicator class="flex"
            id="autofillExtensionIndicator"
            extension-id="[[profileEnabledPref_.extensionId]]"
            extension-name="[[profileEnabledPref_.controlledByName]]"
            extension-can-be-disabled="[[
                profileEnabledPref_.extensionCanBeDisabled
                ]]">
        </extension-controlled-indicator>
      </div>
    </template>
  </div>

  <!-- Entities list card -->
  <div class="card">
    <settings-autofill-ai-entries-list
        list-title="$i18n{shoppingCardTitle}"
        page-name="Shopping"
        allowed-entity-types="[[getAllowedEntityTypes_()]]"
        metric-entity-types="[[getMetricEntityTypes_()]]"
        allow-new-entities-addition-pref="[[shoppingOptedIn_]]">
    </settings-autofill-ai-entries-list>
  </div>
</settings-subpage>
