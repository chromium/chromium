<div class="list-item">
  <div class="settings-row">
    <site-favicon .url="${this.model.faviconOrigin}"></site-favicon>
    <div class="middle" id="displayName">
      <div class="site-representation url-directionality text-elide">
        ${this.model.displayName}
      </div>
      <div class="second-line cr-secondary-text">
        ${this.model.description || ''}
      </div>
    </div>
  </div>
  <!-- Incognito icon. -->
  ${this.model.incognito ? html`
    <cr-tooltip-icon id="incognitoTooltip"
        icon-aria-label="$i18n{incognitoSiteExceptionDesc}"
        icon-class="settings20:incognito-circle-filled"
        tooltip-text="$i18n{incognitoSiteExceptionDesc}">
    </cr-tooltip-icon>
  ` : ''}
  <!-- Trash can icon. -->
  <div class="row-aligned">
    <div class="separator"></div>
    <cr-icon-button id="resetButton"
        aria-label="${this.model.resetAriaLabel}"
        class="icon-delete-gray" @click="${this.onResetButtonClick_}">
    </cr-icon-button>
  </div>
</div>
