<!-- #html_wrapper_imports_start
import {ChooserType, ContentSettingsTypes} from './constants.js';
#html_wrapper_imports_end -->
<settings-subpage page-title="$i18n{siteSettingsSmartCardReaders}"
    route-path="${this.routePath}">
  <div class="content-settings-header secondary">
    $i18n{siteSettingsSmartCardReadersDescription}
  </div>
  <settings-category-default-radio-group
      .category="${ContentSettingsTypes.SMART_CARD_READERS}"
      description=
          "$i18n{siteSettingsSmartCardReadersDefaultDescription}"
      ask-option-label=
          "$i18n{siteSettingsSmartCardReadersAsk}"
      ask-option-icon="privacy:smart-card-reader"
      block-option-label="$i18n{siteSettingsSmartCardReadersBlocked}"
      block-option-icon="privacy:smart-card-reader-off">
  </settings-category-default-radio-group>
  <chooser-exception-list
      .category="${ContentSettingsTypes.SMART_CARD_READERS}"
      .chooserType="${ChooserType.SMART_CARD_READERS_DEVICES}">
  </chooser-exception-list>
</settings-subpage>
