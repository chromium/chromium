    <!-- Confirm reset settings dialog. -->
    <cr-dialog id="confirmResetSettings" close-text="$i18n{close}">
      <div slot="body">${this.resetPermissionsMessage_}</div>
      <div slot="button-container">
        <cr-button class="cancel-button" @click="${this.onCloseDialogClick_}">
          $i18n{cancel}
        </cr-button>
        <cr-button class="action-button" @click="${this.onResetSettingsClick_}">
          $i18n{siteSettingsSiteResetAll}
        </cr-button>
      </div>
    </cr-dialog>

    <div id="emptyListMessage" ?hidden="${this.hasExceptions_()}">
      <div class="secondary">${this.emptyListMessage_}</div>
    </div>

    <div ?hidden="${!this.hasExceptions_()}">
      <cr-button id="resetSettingsButton" role="button" aria-disabled="false"
          @click="${this.onConfirmClearSettingsClick_}">
        $i18n{siteSettingsReset}
      </cr-button>
    </div>

    ${this.chooserExceptions.map(item => html`
      <chooser-exception-list-entry .exception="${item}"
          @show-tooltip="${this.onShowTooltip_}">
      </chooser-exception-list-entry>
    `)}

    <cr-tooltip id="tooltip" manual-mode position="top">
      ${this.tooltipText_}
    </cr-tooltip>
