<div>
  ${this.shouldBeStatic_() ? html`
    <!-- Static row, only if the exception applies to all domains, '*'. -->
    <storage-access-static-site-list-entry
        .model="${this.getStaticSiteEntryForModel_()}">
    </storage-access-static-site-list-entry>
  ` : html`
    <!-- Collapsible row, otherwise. -->
    <div class="list-item">
      <!-- Top row of the collapsible component that represents an origin. -->
      <cr-expand-button id="expandButton" no-hover .expanded="${this.expanded_}"
          @expanded-changed="${this.onExpandedChanged_}"
          aria-label="${this.getExpandButtonAriaLabel_()}">
        <div class="settings-row">
          <site-favicon .url="${this.model.origin}"></site-favicon>
          <div class="middle" id="displayName">
            <div class="site-representation url-directionality text-elide">
              ${this.model.displayName}
            </div>
            <div class="second-line cr-secondary-text">
              ${this.getDescription_()}
            </div>
          </div>
        </div>
      </cr-expand-button>
      <!-- Trash can icon. -->
      <div class="row-aligned">
        <div class="separator"></div>
        <cr-icon-button id="resetAllButton" class="icon-delete-gray"
            aria-label="${this.getResetAllButtonAriaLabel_()}"
            @click="${this.onResetAllButtonClick_}">
        </cr-icon-button>
      </div>
    </div>
    ${this.expanded_ ? html`
      <div class="list-frame">
        ${this.model.exceptions.map(item => html`
          <!-- Nested row that represents an embedding origin. -->
          <div class="hr">
            <storage-access-static-site-list-entry
                .model="${this.getStaticSiteEntryForException_(item)}">
            </storage-access-static-site-list-entry>
          </div>
        `)}
      </div>
    ` : ''}
  `}
</div>
