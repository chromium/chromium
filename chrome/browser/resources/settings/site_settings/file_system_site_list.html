<div class="cr-row first">
  <h2 class="cr-secondary-text">
    $i18n{siteSettingsFileSystemSiteListHeader}
  </h2>
</div>
<div class="list-frame" ?hidden="${this.hasAllowedGrants_()}">
  <div class="list-item cr-secondary-text">$i18n{noSitesAdded}</div>
</div>
${this.allowedGrants_.map(item => html`
  <file-system-site-entry .grantsPerOrigin="${item}"
      @revoke-grants="${this.onRevokeGrants_}">
  </file-system-site-entry>
`)}
