<!-- #html_wrapper_imports_start
import {ContentSetting} from './constants.js';
#html_wrapper_imports_end -->

    <div id="category" ?hidden="${this.shouldHideCategory_()}">
      <div class="cr-row first">
        <h3 id="listHeader" class="flex secondary" tabindex="-1">
          ${this.categoryHeader}
        </h3>
        <cr-button id="addSite" class="header-aligned-button"
            ?hidden="${!this.shouldShowAddSiteButton_()}"
            @click="${this.onAddSiteClick_}"
            aria-label="${this.getAddButtonLabel_()}">
          $i18n{add}
        </cr-button>
      </div>
      <div ?hidden="${!this.shouldShowHeaderWarning_()}"
          id="systemPermissionDeclinedWarning" class="list-frame">
        <div class="list-item secondary">
          <div id="systemPermissionWarningText"></div>
        </div>
      </div>
      <cr-action-menu id="actionMenu" role-description="$i18n{menu}">
        <button class="dropdown-item" id="allow" @click="${this.onAllowClick_}"
            ?hidden="${!this.showAllowAction_}">
          $i18n{siteSettingsActionAllow}
        </button>
        <button class="dropdown-item" id="block" @click="${this.onBlockClick_}"
            ?hidden="${!this.showBlockAction_}">
          $i18n{siteSettingsActionBlock}
        </button>
        <button class="dropdown-item" id="sessionOnly"
            @click="${this.onSessionOnlyClick_}"
            ?hidden="${!this.shouldShowSessionOnlyActionForSite_()}">
          $i18n{siteSettingsActionSessionOnly}
        </button>
        <button class="dropdown-item" id="edit" @click="${this.onEditClick_}">
          $i18n{edit}
        </button>
        <button class="dropdown-item" id="reset" @click="${this.onResetClick_}">
          $i18n{siteSettingsActionReset}
        </button>
      </cr-action-menu>

      <div class="list-frame" ?hidden="${this.hasSites_()}">
        <div class="list-item secondary">$i18n{noSitesAdded}</div>
      </div>
      <div class="list-frame" ?hidden="${!this.shouldShowNoSearchResults_()}">
        <div class="list-item secondary">$i18n{searchNoResults}</div>
      </div>
      <div class="list-frame menu-content vertical-list" id="listContainer"
          ?hidden="${!this.hasSites_()}">
        <settings-focus-list-container id="list" role="grid"
            aria-labelledby="listHeader"
            aria-describedby="${this.categoryHeader}">
          ${this.filteredSites_.map((item, index) => html`
            <site-list-entry .model="${item}"
                ?read-only-list="${this.readOnlyList}"
                @show-action-menu="${this.onShowActionMenu_}"
                ?first="${!index}"
                ?singleton-entry="${this.hasOneFilteredSite_()}"
                .sectionHeader="${this.categoryHeader}"
                @show-tooltip="${this.onShowTooltip_}"
                @site-list-entry-reset-click="${
                    this.onSiteListEntryResetClick_}"
                .cookiesExceptionType="${this.cookiesExceptionType}">
            </site-list-entry>
          `)}
        </settings-focus-list-container>
      </div>
    </div>
    <cr-tooltip id="tooltip" ?hidden="${!this.tooltipText_}"
        fit-to-visible-bounds manual-mode position="top">
      ${this.tooltipText_}
    </cr-tooltip>
    ${this.showEditExceptionDialog_ ? html`
      <settings-edit-exception-dialog .model="${this.actionMenuSite_!}"
          @close="${this.onEditExceptionDialogClose_}">
      </settings-edit-exception-dialog>
    ` : ''}
    ${this.showAddSiteDialog_ ? html`
      <add-site-dialog .hasIncognito="${this.hasIncognito_}"
          .category="${this.category}"
          .contentSetting="${this.categorySubtype || ContentSetting.DEFAULT}"
          @close="${this.onAddSiteDialogClose_}"
          .cookiesExceptionType="${this.cookiesExceptionType}">
      </add-site-dialog>
    ` : ''}
