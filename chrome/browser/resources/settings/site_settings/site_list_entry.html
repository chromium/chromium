    <div class="list-item" focus-row-container>
      <div class="settings-row" role="row" aria-label="${this.getAriaLabel_()}">
        <div role="gridcell" class="settings-row"
            @click="${this.onOriginClick_}" id="originArea"
            aria-label="${this.getAriaLabel_()}"
            ?actionable="${this.allowNavigateToSiteDetail_}">
          <site-favicon .url="${this.getFaviconOrigin_()}"></site-favicon>
          <div class="middle no-min-width">
            <div class="text-elide">
              <span class="url-directionality">
                ${this.getDisplayName_()}
              </span>
            </div>
            <!-- This div must not contain extra whitespace. -->
            <div class="secondary"
                id="siteDescription">${this.getSiteDescription_()}</div>
          </div>

          ${this.allowNavigateToSiteDetail_ ? html`
            <cr-icon-button class="subpage-arrow"
                aria-label="${this.getViewButtonAriaLabel_()}"
                aria-describedby="siteDescription"
                aria-roledescription="$i18n{subpageArrowRoleDescription}"
                focus-type="site-details" focus-row-control>
            </cr-icon-button>
            <div class="separator"></div>
          ` : ''}
        </div>
        ${this.shouldShowPolicyPrefIndicator_() ? html`
          <div role="gridcell">
            <cr-policy-pref-indicator .pref="${this.getPolicyPref_()}"
                @mouseenter="${this.onShowTooltipMouseenter_}"
                @focus="${this.onShowTooltipFocus_}" focus-row-control
                focus-type="policy">
            </cr-policy-pref-indicator>
          </div>
        ` : ''}
        ${this.model.incognito ? html`
          <div role="gridcell">
            <cr-tooltip-icon id="incognitoTooltip"
                icon-aria-label="$i18n{incognitoSiteExceptionDesc}"
                icon-class="settings20:incognito-circle-filled"
                focus-row-control focus-type="incognito"
                @mouseenter="${this.onShowIncognitoTooltipMouseenter_}"
                @focus="${this.onShowIncognitoTooltipFocus_}">
            </cr-tooltip-icon>
          </div>
        ` : ''}
        ${this.shouldShowResetButton_() ? html`
          <div role="gridcell">
            <cr-icon-button id="resetSite" class="icon-delete-gray"
                @click="${this.onResetButtonClick_}"
                aria-label="${this.getRemoveButtonAriaLabel_()}"
                focus-row-control focus-type="reset">
            </cr-icon-button>
          </div>
        ` : ''}
        ${this.shouldShowActionMenu_() ? html`
          <div role="gridcell">
            <cr-icon-button id="actionMenuButton" class="icon-more-vert"
                @click="${this.onShowActionMenuClick_}"
                title="${this.getActionMenuButtonLabel_()}" focus-row-control
                focus-type="menu">
            </cr-icon-button>
          </div>
        ` : ''}
      </div>
    </div>
