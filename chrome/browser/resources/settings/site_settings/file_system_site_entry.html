<div class="list-frame">
  <div class="origin-row">
    <site-favicon .url="${this.grantsPerOrigin.origin}"></site-favicon>
    <div class="origin">${this.grantsPerOrigin.origin}</div>
    <cr-icon-button id="fileSystemSiteDetails"
        class="subpage-arrow"
        aria-label="${this.grantsPerOrigin.origin}"
        aria-roledescription="$i18n{subpageArrowRoleDescription}"
        @click="${this.onNavigateToDetailsPageClick_}">
    </cr-icon-button>
    <div class="separator"></div>
    <cr-icon-button
        class="icon-delete-gray"
        id="removeGrants"
        aria-label="$i18n{siteSettingsFileSystemSiteListRemoveGrants}"
        @click="${this.onRemoveGrantsClick_}">
    </cr-icon-button>
  </div>
</div>
