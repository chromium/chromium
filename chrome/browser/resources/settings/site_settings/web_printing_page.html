<!-- #html_wrapper_imports_start
import {ContentSettingsTypes} from './constants.js';
#html_wrapper_imports_end -->
<settings-subpage page-title="$i18n{siteSettingsWebPrinting}"
    search-label="$i18n{siteSettingsAllSitesSearch}"
    @search-term-changed="${this.onSearchTermChanged_}"
    route-path="${this.routePath}">
  <div class="content-settings-header secondary">
      $i18n{siteSettingsWebPrintingDescription}
  </div>
  <settings-category-default-radio-group
      .category="${ContentSettingsTypes.WEB_PRINTING}"
      ask-option-label="$i18n{siteSettingsWebPrintingAsk}"
      ask-option-icon="settings:print"
      block-option-label="$i18n{siteSettingsWebPrintingBlock}"
      block-option-icon="settings:print-disabled">
  </settings-category-default-radio-group>
  <category-setting-exceptions
      .category="${ContentSettingsTypes.WEB_PRINTING}"
      allow-header="$i18n{siteSettingsWebPrintingAllowedExceptions}"
      block-header="$i18n{siteSettingsWebPrintingBlockedExceptions}"
      .searchFilter="${this.searchTerm_}">
  </category-setting-exceptions>
</settings-subpage>
