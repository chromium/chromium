    <cr-dialog id="dialog">
      <div slot="title">$i18n{editSiteTitle}</div>
      <div slot="body">
        <cr-input id="input" label="$i18n{addSite}" .value="${this.origin_}"
            placeholder="$i18n{addSiteExceptionPlaceholder}"
            @input="${this.onOriginInput_}"
            .errorMessage="${this.errorMessage_}" ?invalid="${this.invalid_}"
            autofocus spellcheck="false">
        </cr-input>
      </div>
      <div slot="button-container">
        <cr-button class="cancel-button" @click="${this.onCancelClick_}"
            id="cancel">$i18n{cancel}</cr-button>
        <cr-button id="actionButton" class="action-button"
            @click="${this.onActionButtonClick_}" ?disabled="${this.invalid_}">
          $i18n{save}
        </cr-button>
      </div>
    </cr-dialog>
