<settings-subpage .pageTitle="${this.pageTitle_}"
    route-path="${this.routePath}">
  <div class="grants-list-header"
      ?hidden="${!this.grantsPerOrigin_.editGrants.length}">
    $i18n{siteSettingsFileSystemSiteListEditHeader}
  </div>
  ${this.grantsPerOrigin_.editGrants.map(item => html`
    <file-system-site-entry-item .grant="${item}"
        @revoke-grant="${this.onRevokeGrant_}">
    </file-system-site-entry-item>
  `)}
  <div class="grants-list-header view-grants"
      ?hidden="${!this.grantsPerOrigin_.viewGrants.length}">
    $i18n{siteSettingsFileSystemSiteListViewHeader}
  </div>
  ${this.grantsPerOrigin_.viewGrants.map(item => html`
    <file-system-site-entry-item .grant="${item}"
        @revoke-grant="${this.onRevokeGrant_}">
    </file-system-site-entry-item>
  `)}
</settings-subpage>
