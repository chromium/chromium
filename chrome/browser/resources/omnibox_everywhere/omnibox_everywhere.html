<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{webuiRoundedIconsAttribute}>
<head>
  <meta charset="utf-8">
  <title>Omnibox Popup</title>
  <link rel="stylesheet" href="//resources/css/text_defaults_md.css">
  <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
  <style>
    html {
      height: auto;
      overflow: hidden;

      /* Note: Needed to prevent a horizontal scrollbar when this UI is shown
         via OmniboxPopupPresenter (not reproducible in a tab). */
      max-width: 100vw;
    }

    /* Override the default max-width: 100vw (which equals 544px when the
     * persistent C++ widget is resting) so Blink's EnableAutoResize can measure
     * the expanded app width and resize the native widget window. */
    html:has(omnibox-everywhere-app[dynamic-sizing]) {
      max-width: none;
      width: max-content;
    }

    body {
      background-color: transparent;
      height: auto;
      /* Padding accommodates the CSS drop-shadow without clipping at the
       * widget bounds. */
      padding: 24px;
      margin: 0;
    }

    /* Shrink-wrap <body> to the app's intrinsic width for EnableAutoResize and
     * use 32px horizontal padding so the CSS drop-shadow/glow is not clipped at
     * the right edge. */
    body:has(omnibox-everywhere-app[dynamic-sizing]) {
      padding: 24px 32px;
      width: max-content;
    }
  </style>
</head>
<body>
  <omnibox-everywhere-app></omnibox-everywhere-app>
</body>
<script type="module" src="omnibox_everywhere.js"></script>
</html>
