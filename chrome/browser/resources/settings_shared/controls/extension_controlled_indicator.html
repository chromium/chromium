<img role="presentation" src="chrome://extension-icon/${this.extensionId}/20/1">
<span>${this.getLabel_()}</span>
<cr-button id="manage" @click="${this.onManageClick_}">
  $i18n{manage}
  <cr-icon icon="cr:open-in-new" slot="suffix-icon"></cr-icon>
</cr-button>
${this.extensionCanBeDisabled ? html`
  <cr-button id="disable" @click="${this.onDisableClick_}">
    $i18n{disable}
  </cr-button>
` : ''}
