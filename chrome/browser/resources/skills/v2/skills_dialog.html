<!DOCTYPE html>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{webuiRefresh2026}>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background-color:
          var(--color-webui-page-background, var(--color-sys-base, white));
    }
    webview {
      display: block;
      border: none;
      width: 100%;
    }
    webview[hidden] {
      display: block !important;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
    }
    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <webview id="webview" partition="glicskillspart" autosize="on"
      minwidth="512" maxwidth="512" minheight="200" maxheight="710"
      hidden></webview>
  <loading-page id="loading-page" dialog></loading-page>
  <error-page id="error-page" dialog hidden></error-page>
  <script type="module" src="v2/skills_dialog.js"></script>
</body>
</html>
