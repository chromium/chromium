<cr-input .value="${this.value}" id="inputValue" readonly class="input-field"
    label="${this.label}" placeholder="${this.placeholder}" role="textbox"
    aria-disabled="true">
  <cr-icon-button id="copyButton" class="icon-copy-content"
      slot="inline-suffix" title="${this.copyButtonLabel}"
      @click="${this.onCopyValueClick_}" ?hidden="${!this.value}">
  </cr-icon-button>
</cr-input>
