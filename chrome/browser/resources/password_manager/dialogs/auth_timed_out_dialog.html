<cr-dialog id="dialog">
  <div slot="title" class="dialog-title">${this.getTitle_()}</div>
  <div slot="body">
    <div>$i18n{authTimedOutDescription}</div>
  </div>
  <div slot="button-container">
    <cr-button class="action-button" autofocus
        @click="${this.onCloseButtonClick_}">
      $i18n{gotIt}
    </cr-button>
  </div>
</cr-dialog>
