<cr-dialog id="dialog" show-on-attach>
  <div slot="title" id="title" class="dialog-title">
    $i18n{editPasswordTitle}
  </div>
  <div slot="body">
    <div class="cr-form-field-label">$i18n{sitesLabel}</div>
    ${this.credential.affiliatedDomains.map(item => html`
      <div class="elide-left">
        <a href="${item.url}" class="site-link" target="_blank">
          ${item.name}
        </a>
      </div>
    `)}
    <cr-input id="usernameInput" label="$i18n{usernameLabel}" autofocus
        .value="${this.username_}"
        @value-changed="${this.onUsernameValueChanged_}"
        error-message="${this.usernameErrorMessage_ || ''}"
        ?invalid="${this.doesUsernameExistAlready_()}"
        spellcheck="false">
    </cr-input>
    <a id="viewExistingPasswordLink" is="action-link" href="/"
        @click="${this.onViewExistingPasswordClick_}"
        aria-description="${this.getViewExistingPasswordAriaDescription_()}"
        ?hidden="${!this.showRedirect_()}">
      $i18n{viewExistingPassword}
    </a>
    <cr-input id="passwordInput" label="$i18n{passwordLabel}" required
        type="${this.getPasswordInputType()}"
        .value="${this.password_}"
        @value-changed="${this.onPasswordValueChanged_}"
        ?invalid="${!this.password_.length}"
        class="password-input" spellcheck="false">
      <cr-icon-button id="showPasswordButton" slot="inline-suffix"
          class="${this.getShowHideButtonIconClass()}"
          title="${this.getShowHideButtonLabel()}"
          @click="${this.onShowHidePasswordButtonClick}">
      </cr-icon-button>
    </cr-input>
    <div id="footnote">
      ${this.getFootnote_()}
    </div>
    <cr-textarea id="passwordNote" label="$i18n{noteLabel}"
        .value="${this.note_}" @value-changed="${this.onNoteValueChanged_}"
        ?invalid="${this.isNoteInputInvalid_()}" autogrow
        first-footer="${this.getFirstNoteFooter_()}"
        second-footer="${this.getSecondNoteFooter_()}">
    </cr-textarea>
  </div>
  <div slot="button-container">
    <cr-button id="cancelButton" class="cancel-button"
        @click="${this.onCancelClick_}">
      $i18n{cancel}
    </cr-button>
    <cr-button id="saveButton" class="action-button"
        ?disabled="${!this.canEditPassword_}" @click="${this.onEditClick_}">
      $i18n{save}
    </cr-button>
  </div>
</cr-dialog>
