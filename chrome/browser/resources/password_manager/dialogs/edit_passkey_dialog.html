<cr-dialog id="dialog" show-on-attach>
  <div slot="title" id="title" class="dialog-title">
    $i18n{editPasskeyTitle}
  </div>
  <div slot="body">
    <div class="cr-form-field-label">$i18n{sitesLabel}</div>
    ${this.passkey.affiliatedDomains.map(item => html`
      <div class="elide-left">
        <a href="${item.url}" class="site-link" target="_blank">
          ${item.name}
        </a>
      </div>
    `)}
    <cr-input id="displayNameInput" label="$i18n{displayNameLabel}" autofocus
        .value="${this.displayName_}"
        @value-changed="${this.onDisplayNameValueChanged_}"
        placeholder="$i18n{displayNamePlaceholder}">
    </cr-input>
    <cr-input id="usernameInput" label="$i18n{usernameLabel}"
        .value="${this.username_}"
        @value-changed="${this.onUsernameValueChanged_}"
        placeholder="$i18n{usernamePlaceholder}">
    </cr-input>
  </div>
  <div slot="button-container">
    <cr-button id="cancelButton" class="cancel-button"
        @click="${this.onCancelClick_}">
      $i18n{cancel}
    </cr-button>
    <cr-button id="saveButton" class="action-button"
        @click="${this.onEditClick_}">
      $i18n{save}
    </cr-button>
  </div>
</cr-dialog>
