<picture id="image">
  <if expr="_google_chrome">
    <source class="banner"
        srcset="./images/${this.getBannerImageName_()}_dark.svg"
        media="(prefers-color-scheme: dark)">
    <img class="banner" alt=""
        src="./images/${this.getBannerImageName_()}.svg">
  </if>
  <if expr="not _google_chrome">
    <source class="banner"
        srcset="./images/${this.getBannerImageName_()}_dark_non_branded.svg"
        media="(prefers-color-scheme: dark)">
    <img class="banner" alt=""
        src="./images/${this.getBannerImageName_()}_non_branded.svg">
  </if>
</picture>
<div id="cardContent">
  <h2 id="title">${this.card.title}</h2>
  <div id="description" class="cr-primary-text label"
      .innerHTML="${this.getDescription_()}"></div>
  <cr-button id="actionButton" ?hidden="${!this.card.actionButtonText}"
      class="action-button" @click="${this.onActionButtonClick_}">
    ${this.card.actionButtonAvatarUrl ? html`
      <img id="avatar" slot="prefix-icon"
          src="${this.card.actionButtonAvatarUrl}" alt="">
    ` : ''}
    ${this.card.actionButtonText}
  </cr-button>
</div>
<cr-icon-button id="closeButton" class="icon-clear no-overlap"
    ?hidden="${!this.card.isDismissible}"
    @click="${this.onCloseClick_}" title="$i18n{close}"
    aria-label="$i18n{closeNotificationCardButtonAriaLabel}">
</cr-icon-button>
