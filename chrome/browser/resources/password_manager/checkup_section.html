<h2 class="page-title">$i18n{checkupTitle}</h2>
<div id="checkupContent" class="card">
  <div id="illustartion" role="presentation">
    <picture>
      <source class="banner" srcset="./images/${this.bannerImage_}_dark.svg"
          media="(prefers-color-scheme: dark)">
      <img id="bannerImage" class="banner" alt=""
          src="./images/${this.bannerImage_}.svg">
    </picture>
  </div>
  <div class="hr" id="checkupStatus">
    <div id="spinner" class="spinner" ?hidden="${!this.isCheckRunning_}"></div>
    <div id="labelWrapper">
      <div id="checkupStatusLabel" class="title">${this.checkedPasswordsText_}</div>
      <div id="checkupStatusSubLabel" class="cr-secondary-text label"
          .innerHTML="${this.getCheckupSublabelValue_()}"
          @click="${this.onCheckupStatusSubLabelClick_}">
      </div>
    </div>
    <div id="checkupButtons" ?hidden="${!this.showCheckButton_()}">
      <cr-icon-button id="refreshButton" class="icon-refresh"
          ?disabled="${this.isCheckRunning_}" ?hidden="${this.showRetryButton_()}"
          @click="${this.onPasswordCheckButtonClick_}" title="$i18n{reload}"
          aria-label="$i18n{runCheckupAriaDescription}">
      </cr-icon-button>
      <cr-button id="retryButton" ?hidden="${!this.showRetryButton_()}"
          class="action-button" @click="${this.onPasswordCheckButtonClick_}">
        $i18n{tryAgain}
      </cr-button>
    </div>
  </div>
  <div id="checkupResult" ?hidden="${!this.showCheckupResult_()}">
    <cr-link-row id="compromisedRow" class="hr secondary-text-on-surface"
        start-icon="${this.getIcon_(this.compromisedPasswords_, true)}"
        label="${this.getCompromisedSectionLabel_()}"
        sub-label="${this.getCompromisedSectionSublabel_()}"
        ?show-yellow-icon="${this.didCompromiseCheckFail_()}"
        ?show-red-icon="${this.hasIssues_(this.compromisedPasswords_)}"
        ?non-clickable="${!this.hasIssues_(this.compromisedPasswords_)}"
        @click="${this.onCompromisedClick_}" role-description="button"
        aria-show-label aria-show-sublabel>
    </cr-link-row>
    <cr-link-row id="reusedRow" class="hr secondary-text-on-surface"
        start-icon="${this.getIcon_(this.reusedPasswords_)}"
        label="${this.reusedPasswordsText_}"
        sub-label="${this.getReusedSectionSublabel_()}"
        ?show-yellow-icon="${this.hasIssues_(this.reusedPasswords_)}"
        ?non-clickable="${!this.hasIssues_(this.reusedPasswords_)}"
        @click="${this.onReusedClick_}" role-description="button"
        aria-show-label aria-show-sublabel>
    </cr-link-row>
    <cr-link-row id="weakRow" class="hr secondary-text-on-surface"
        start-icon="${this.getIcon_(this.weakPasswords_)}"
        label="${this.weakPasswordsText_}"
        sub-label="${this.getWeakSectionSublabel_()}"
        ?show-yellow-icon="${this.hasIssues_(this.weakPasswords_)}"
        ?non-clickable="${!this.hasIssues_(this.weakPasswords_)}"
        @click="${this.onWeakClick_}" role-description="button"
        aria-show-label aria-show-sublabel>
    </cr-link-row>
  </div>
</div>
