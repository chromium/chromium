<div id="outerRow" ?noSubLabel="${!this.hasSubLabel_()}">
  <div id="labelWrapper">
    <div class="label" aria-hidden="true">${this.label}</div>
    <div class="cr-secondary-text label" id="sub-label"
        ?hidden="${!this.hasSubLabel_()}">
      ${this.subLabel ? html`
        <span id="sub-label-text" aria-hidden="true">
          ${this.subLabel}
        </span>
      ` : ''}
      ${this.subLabelWithLink ? html`
        <div id="sub-label-text-with-link"
            .innerHTML="${this.getSubLabelWithLinkContent_()}"
            @click="${this.onSubLabelTextWithLinkClick_}">
        </div>
      ` : ''}
    </div>
  </div>
  ${this.hasPrefPolicyIndicator_() ? html`
    <cr-policy-pref-indicator .pref="${this.pref}"
        icon-aria-label="${this.label}">
    </cr-policy-pref-indicator>
  ` : ''}
  <cr-toggle id="control" ?checked="${this.checked}"
      @checked-changed="${this.onCheckedChanged_}"
      ?disabled="${this.controlDisabled_()}"
      @change="${this.onToggleChange_}"
      aria-label="${this.getAriaLabel_()}">
  </cr-toggle>
</div>
