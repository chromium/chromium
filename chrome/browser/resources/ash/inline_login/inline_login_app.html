<style>
  :host {
    --dialog-top-border-size: 35px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .signin-frame {
    height: 100%;
    margin: 0;
    padding: 0;
    width: 100%;
  }

  .container,
  #addAccount.active {
    align-items: center;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: center;
  }

  #addAccount {
    /* margin-bottom = padding below button + button height
     *                 + padding above button. */
    margin-bottom: calc(3 * 32px);
  }
  /* Make distance to the top 64px. */
  #welcome, #signinBlockedByPolicy, #signinError {
    margin-top: calc(64px - var(--dialog-top-border-size));
  }

  .buttons {
    display: flex;
    padding: 0 32px 32px;
  }

  .action-buttons,
  .next-button {
    margin-inline-start: auto;
  }

  .rounded-button {
    border-radius: 20px;
  }

  .signin-frame {
    background-color: white;
    overflow: hidden;
  }

  paper-spinner-lite {
    --spinner-size: 24px;
    display: none;
    height: var(--spinner-size);
    width: var(--spinner-size);
  }

  paper-spinner-lite[active] {
    display: inline-block;
  }
</style>

<div class="container">
  <cr-view-manager id="viewManager">
    <!-- Show welcome screen on Chrome OS to clarify that account will be
         available in ARC. -->
    <div id="[[viewEnum.WELCOME]]" slot="view">
      <welcome-page-app on-opened-new-window="closeDialog">
      </welcome-page-app>
    </div>
    <div id="[[viewEnum.SIGNIN_BLOCKED_BY_POLICY]]" slot="view">
      <signin-blocked-by-policy-page email="[[email]]"
        hosted-domain="[[hostedDomain]]" device-type="[[deviceType]]">
      </signin-blocked-by-policy-page>
    </div>
    <div id="[[viewEnum.SIGNIN_ERROR]]" slot="view">
      <signin-error-page>
      </signin-error-page>
    </div>
    <div id="[[viewEnum.ADD_ACCOUNT]]" slot="view">
      <paper-spinner-lite id="spinner"
          active="[[isSpinnerActive(loading, verifyingAccount)]]">
      </paper-spinner-lite>
      <p hidden$="[[!verifyingAccount]]">
        $i18n{accountManagerDialogSigninSpinnerText}
      </p>

      <webview id="signinFrame" name="signin-frame" class="signin-frame"
        hidden$="[[isSpinnerActive(loading, verifyingAccount)]]"
        allowscaling>
      </webview>
    </div>
  </cr-view-manager>
</div>

<div class="buttons"
    hidden$="[[isSpinnerActive(loading, verifyingAccount)]]">
  <cr-button class="back-button rounded-button"
      aria-label="$i18n{accessibleBackButtonLabel}"
      on-click="handleGoBack"
      hidden$="[[!shouldShowBackButton(currentView, verifyingAccount)]]">
    <iron-icon icon="[[getBackButtonIcon()]]"></iron-icon>
    $i18n{accessibleBackButtonLabel}
  </cr-button>

  <div class="action-buttons"
      hidden$="[[!shouldShowGaiaButtons(currentView)]]">
    <gaia-action-buttons authenticator="[[authenticator]]"
        rounded-button="true"
        on-set-focus-to-webview="setFocusToWebview">
    </gaia-action-buttons>
  </div>

  <cr-button class="next-button action-button rounded-button"
      aria-label="[[i18n('ok')]]"
      on-click="onOkButtonClick"
      hidden$="[[!shouldShowOkButton(currentView)]]">
    [[i18n('ok')]]
  </cr-button>
</div>
