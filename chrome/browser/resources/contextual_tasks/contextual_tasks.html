<!DOCTYPE HTML>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{webuiRoundedIconsAttribute}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0">
    <title>$i18n{title}</title>
    <link rel="stylesheet" href="//resources/css/text_defaults_md.css">
    <!-- TODO(crbug.com/509722915): Re-enable this style sheet on Android once
              themes are supported. -->
<if expr="not is_android">
    <link rel="stylesheet" href="//theme/colors.css?sets=chrome">
</if>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior-x: contain;
        padding: 0;
        width: 100%;
      }

      /* This is only used for first load. */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: rgba(34, 36, 43, 1);
        }
      }

      body {
        align-items: stretch;
        display: flex;
        flex-direction: column;
        /* Contain and clip absolutely positioned content, like the zero state
         * container during its slide up animation. Otherwise its offset makes
         * the document scrollable, and focusing the composebox scrolls the
         * toolbar out of view until the animation ends. */
        overflow: clip;
        position: relative;
      }

      contextual-tasks-app {
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <contextual-tasks-app></contextual-tasks-app>
    <script type="module" src="app.js"></script>
  </body>
</html>
