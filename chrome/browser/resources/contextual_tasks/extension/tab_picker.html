<!DOCTYPE html>
<html $i18n{webuiRoundedIconsAttribute}>
<head>
  <meta charset="utf-8">
  <title>Tab Picker</title>
  <script src="color_scheme.js"></script>
  <link rel="stylesheet" href="//resources/css/text_defaults_md.css">
  <style>
    html {
      color-scheme: light;
    }

    html[dark-mode] {
      color-scheme: light dark;
    }

    html,
    body {
      background: transparent;
      height: 100%;
      margin: 0;
      overflow: hidden;
      padding: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <tab-picker-app></tab-picker-app>
  <!-- Put tab picker first: attach listeners before post
      message sends any tab events.
      TODO(crbug.com/571638878) - Pull initial state or cache last state
      so order of html does not matter here.
  -->
  <script type="module" src="tab_picker.js"></script>
  <script type="module" src="post_message_entrypoint.js"></script>
</body>
</html>
