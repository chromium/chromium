<ntp-module-header
    id="moduleHeader"
    header-text="${this.i18n('modulesLaunchpadTitle')}"
    .menuItems="${this.getMenuItems_()}"
    more-actions-text="${this.i18nRecursive(
        '', 'modulesMoreActions', 'modulesLaunchpadTitle')}"
    @disable-button-click="${this.onDisableButtonClick_}">
  <img id="titleIcon" slot="title-icon"
      srcset="chrome://theme/current-channel-logo@1x 1x,
              chrome://theme/current-channel-logo@2x 2x"
      alt="">
</ntp-module-header>
<div id="greeting">${this.i18n('modulesLaunchpadZeroStateGreeting')}</div>
