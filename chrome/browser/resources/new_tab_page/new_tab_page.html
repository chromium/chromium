<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{roundedIconsAttribute} $i18n{webuiRoundedIconsAttribute}>
  <head>
    <meta charset="utf-8">
    <title>$i18n{title}</title>
    <style>
      body {
        background: $i18n{backgroundColor};
        margin: 0;
      }

      /* Keep full-viewport sizing on the preloaded OOP iframe before ntp-app
       * upgrades; once defined, app.css ::slotted(#backgroundImage) owns layout
       * inside #backgroundImageContainer without outer-document cascade
       * overrides. */
      ntp-app:not(:defined) #backgroundImage {
        border: none;
        height: 100%;
        position: fixed;
        top: 0;
        width: 100%;
      }

      #backgroundImage {
        visibility: hidden;
      }

      [show-background-image] #backgroundImage {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <ntp-app>
      <iframe id="backgroundImage" slot="backgroundImage"
          src="$i18nRaw{backgroundImageUrl}"></iframe>
    </ntp-app>
    <script type="module" src="new_tab_page.js"></script>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <link rel="stylesheet" href="shared_vars.css">
  </body>
</html>
